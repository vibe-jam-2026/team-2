<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slapshot Squirrels</title>
<!--
  SLAPSHOT SQUIRRELS
  A small two-player, turn-based artillery game (inspired by Worms).
  Two hockey-helmeted squirrels on two islands slap exploding pucks at
  each other. Whatever you do: DO NOT touch the red button.

  Single self-contained file: HTML + CSS + JavaScript (Canvas API).
  No external libraries or assets. Open it in any modern desktop browser.
-->
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1620;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #8fd0f5;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>

<script>
'use strict';

/* ======================================================================
 * 1. CONFIGURATION: tweak these values to change how the game plays
 * ====================================================================== */
const CONFIG = {
  // World
  WIDTH: 1280,
  HEIGHT: 720,
  WATER_Y: 620,             // y-coordinate of the water surface

  // Islands
  LEFT_ISLAND_X: 250,       // centre x of Red's island
  RIGHT_ISLAND_X: 1030,     // centre x of Blue's island
  ISLAND_HALF_WIDTH: 200,   // half the width of an island (px)
  ISLAND_HEIGHT: 150,       // peak height of an island above the water (px)

  // Physics
  GRAVITY: 520,             // downward acceleration of the puck (px/s²)
  MAX_SHOT_SPEED: 950,      // puck launch speed at 100% power (px/s)
  WIND_MAX: 120,            // wind acceleration at wind level 10 (px/s²)
  PLAYER_GRAVITY: 900,      // falling acceleration for squirrels (px/s²)

  // Explosions and damage
  CRATER_RADIUS: 40,        // radius of terrain removed by an explosion
  DAMAGE_RADIUS: 65,        // no damage beyond this distance from the blast
  MAX_DAMAGE: 40,           // damage for a direct hit
  START_HEALTH: 100,

  // Movement
  MOVE_DISTANCE: 140,       // pixels a squirrel may walk per turn
  WALK_SPEED: 80,           // walking speed (px/s)
  MAX_STEP_UP: 3,           // max climb per pixel walked (higher = steeper slopes allowed)
  MAX_STEP_DOWN: 5,         // max drop per pixel walked before the squirrel starts falling

  // Aiming
  AIM_SPEED: 60,            // degrees per second while holding Up/Down
  POWER_SPEED: 45,          // percent per second while holding Left/Right

  // The red button (sits on a post in the water between the islands)
  BUTTON_X: 640,
  BUTTON_Y: 520,            // y of the top of the button housing (dome sits on top)
  BUTTON_RADIUS: 18,
};

const W = CONFIG.WIDTH;
const H = CONFIG.HEIGHT;
const TAU = Math.PI * 2;

// Size of the squirrel hit box (feet are at p.y; the box goes up from there)
const PLAYER_HALF_W = 11;
const PLAYER_HEIGHT = 38;
const PUCK_RADIUS = 5;

// Hockey-stick swing timings (seconds)
const STICK_REST = 0.55;    // stick angle (radians from straight down) when idle
const SWING_TIME = 0.45;    // full swing animation length
const SWING_IMPACT = 0.29;  // moment the stick hits the puck

const TEAMS = [
  { name: 'Red',  color: '#e0393a', dark: '#97191b', light: '#ff9a9a' },
  { name: 'Blue', color: '#2f6fe0', dark: '#173f91', light: '#9cc0ff' },
];

/* ======================================================================
 * 2. SMALL HELPERS
 * ====================================================================== */
const rand = (min, max) => min + Math.random() * (max - min);
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

/** Draws a rounded-rectangle path (fill/stroke it afterwards). */
function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ======================================================================
 * 3. CANVAS SETUP: fixed 1280x720 game, scaled to fit the window
 * ====================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = `${W * scale}px`;
  canvas.style.height = `${H * scale}px`;
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

/** Converts a mouse event into game (canvas) coordinates. */
function toGameCoords(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top) * (H / r.height),
  };
}

/* ======================================================================
 * 4. DESTRUCTIBLE TERRAIN
 *    The islands are drawn once into an off-screen canvas (for looks)
 *    and mirrored in a per-pixel "solid" array (for collisions).
 *    Explosions erase circles from both.
 * ====================================================================== */
const terrainCanvas = document.createElement('canvas');
terrainCanvas.width = W;
terrainCanvas.height = H;
const tctx = terrainCanvas.getContext('2d', { willReadFrequently: true });
const solid = new Uint8Array(W * H);

/** True if the pixel at (x, y) is ground. */
function isSolid(x, y) {
  x = Math.floor(x);
  y = Math.floor(y);
  if (x < 0 || x >= W || y < 0 || y >= H) return false;
  return solid[y * W + x] === 1;
}

/** Builds two fresh random islands and the collision map. */
function generateTerrain() {
  tctx.clearRect(0, 0, W, H);
  drawIsland(CONFIG.LEFT_ISLAND_X);
  drawIsland(CONFIG.RIGHT_ISLAND_X);

  // Copy the alpha channel into the collision map
  const data = tctx.getImageData(0, 0, W, H).data;
  for (let i = 0; i < W * H; i++) solid[i] = data[i * 4 + 3] > 127 ? 1 : 0;
}

/** Draws one island centred on cx: a bumpy hill with grass on top. */
function drawIsland(cx) {
  const hw = CONFIG.ISLAND_HALF_WIDTH;
  const phase = [rand(0, TAU), rand(0, TAU), rand(0, TAU)];

  // Surface outline: tall in the middle, dipping under water at the edges
  const top = [];
  for (let x = cx - hw; x <= cx + hw; x += 2) {
    const t = (x - cx) / hw;                                        // -1..1
    const base = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(t), 4)), 0.6);
    const bumps = 14 * Math.sin(t * 3 + phase[0])
                + 7 * Math.sin(t * 7 + phase[1])
                + 3 * Math.sin(t * 13 + phase[2]);
    const heightAboveWater = (CONFIG.ISLAND_HEIGHT + bumps) * base - 30 * (1 - base);
    top.push([x, CONFIG.WATER_Y - heightAboveWater]);
  }

  // Body: earth that turns sandy near the waterline
  const g = tctx.createLinearGradient(0, CONFIG.WATER_Y - CONFIG.ISLAND_HEIGHT - 20, 0, CONFIG.WATER_Y + 30);
  g.addColorStop(0, '#8b5a33');
  g.addColorStop(0.65, '#6c4325');
  g.addColorStop(0.88, '#d8bf86');
  g.addColorStop(1, '#c4a56b');
  tctx.fillStyle = g;
  tctx.beginPath();
  tctx.moveTo(top[0][0], H);
  for (const [x, y] of top) tctx.lineTo(x, y);
  tctx.lineTo(top[top.length - 1][0], H);
  tctx.closePath();
  tctx.fill();

  // Pebbles (drawn only on top of the island thanks to 'source-atop')
  tctx.save();
  tctx.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 160; i++) {
    tctx.fillStyle = Math.random() < 0.5 ? 'rgba(60,35,18,0.45)' : 'rgba(190,150,100,0.35)';
    tctx.beginPath();
    tctx.arc(cx + rand(-hw, hw), rand(CONFIG.WATER_Y - CONFIG.ISLAND_HEIGHT, CONFIG.WATER_Y), rand(1.5, 4), 0, TAU);
    tctx.fill();
  }
  tctx.restore();

  // Grass along the top edge (only the part above water)
  const grassPath = () => {
    tctx.beginPath();
    let drawing = false;
    for (const [x, y] of top) {
      if (y < CONFIG.WATER_Y - 8) {
        if (!drawing) tctx.moveTo(x, y); else tctx.lineTo(x, y);
        drawing = true;
      } else {
        drawing = false;
      }
    }
  };
  tctx.lineJoin = 'round';
  tctx.lineCap = 'round';
  tctx.strokeStyle = '#3f9a35';
  tctx.lineWidth = 8;
  grassPath();
  tctx.stroke();
  tctx.strokeStyle = '#72cf55';
  tctx.lineWidth = 3;
  tctx.save();
  tctx.translate(0, -2);
  grassPath();
  tctx.stroke();
  tctx.restore();
}

/** Removes a circle of ground (explosion crater) and scorches its rim. */
function carveCrater(cx, cy, r) {
  tctx.save();
  tctx.globalCompositeOperation = 'destination-out';
  tctx.beginPath();
  tctx.arc(cx, cy, r, 0, TAU);
  tctx.fill();
  tctx.globalCompositeOperation = 'source-atop';      // only darkens existing ground
  tctx.strokeStyle = 'rgba(35,20,8,0.55)';
  tctx.lineWidth = 7;
  tctx.beginPath();
  tctx.arc(cx, cy, r + 2, 0, TAU);
  tctx.stroke();
  tctx.restore();

  const r2 = r * r;
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r2) solid[y * W + x] = 0;
    }
  }
}

/** Returns the y just above the first ground pixel in column x. */
function surfaceY(x) {
  for (let y = 0; y < H; y++) if (isSolid(x, y)) return y - 1;
  return H;
}

/* ======================================================================
 * 5. GAME STATE
 * ====================================================================== */
// state is one of: 'title', 'move', 'aim', 'swing', 'flight', 'settle', 'button', 'gameover'
let state = 'title';
let players = [];
let current = 0;          // index of the active player
let turnNumber = 0;       // counts turns; every 2 turns is a new round
let round = 1;
let windLevel = 0;        // -10..10 (negative = blowing left)
let wind = 0;             // horizontal acceleration applied to the puck
let moveLeft = 0;         // movement budget remaining this turn (px)
let walkAccum = 0;        // sub-pixel walking accumulator
let puck = null;
let settleTimer = 0;
let buttonEvent = null;   // { loser, how: 'puck' | 'click', t }
let result = null;        // game-over info
let gameOverTimer = 0;

let time = 0;             // total elapsed time (for animations)
let shake = 0;            // screen-shake strength
let particles = [];
let flashes = [];         // explosion fireballs
let floatTexts = [];      // "-32" damage pop-ups
let banner = null;        // big centred message, e.g. "Blue's turn"
let clouds = [];

const keys = {};
const mouse = { x: -100, y: -100 };

const active = () => players[current];

/* ======================================================================
 * 6. GAME FLOW
 * ====================================================================== */
function createPlayer(index, x) {
  const p = {
    index,
    ...TEAMS[index],
    x: Math.round(x),
    y: 0,
    vy: 0,
    grounded: true,
    inWater: false,
    health: CONFIG.START_HEALTH,
    defeat: null,           // null | 'health' | 'water' | 'button'
    aim: 45,                // degrees; 0 = flat toward the opponent, 90 = straight up, 180 = flat away
    power: 60,              // percent
    facing: index === 0 ? 1 : -1,
    swingT: -1,             // swing animation clock (-1 = not swinging)
    walking: false,
    walkPhase: 0,
    hurtT: 0,
  };
  p.y = surfaceY(p.x);
  return p;
}

/** Resets everything. If startNow is false the title screen is shown. */
function newGame(startNow) {
  generateTerrain();
  players = [
    createPlayer(0, CONFIG.LEFT_ISLAND_X + rand(-40, 20)),
    createPlayer(1, CONFIG.RIGHT_ISLAND_X + rand(-20, 40)),
  ];
  current = 0;
  turnNumber = 0;
  round = 1;
  puck = null;
  particles = [];
  flashes = [];
  floatTexts = [];
  buttonEvent = null;
  result = null;
  randomizeWind();
  if (startNow) beginTurn();
  else state = 'title';
}

function randomizeWind() {
  windLevel = randInt(-10, 10);
  wind = (windLevel / 10) * CONFIG.WIND_MAX;
}

/** Starts the movement phase for the active player. */
function beginTurn() {
  state = 'move';
  moveLeft = CONFIG.MOVE_DISTANCE;
  walkAccum = 0;
  for (const p of players) p.swingT = -1;
  const p = active();
  showBanner(`${p.name}'s turn`, p.color);
}

function nextTurn() {
  current = 1 - current;
  turnNumber++;
  if (turnNumber % 2 === 0) {          // both players have shot: new round
    round++;
    randomizeWind();
  }
  beginTurn();
}

/** Movement phase -> aiming phase. */
function startAiming() {
  state = 'aim';
  updateFacingFromAim(active());
}

/** Space pressed: begin the swing. The puck is launched mid-swing. */
function shoot() {
  state = 'swing';
  active().swingT = 0;
}

/** Waits for explosions, falling squirrels etc. before the next turn. */
function enterSettle() {
  state = 'settle';
  settleTimer = 0;
}

/** The red button was hit or clicked. The given player loses. */
function triggerButton(loser, how) {
  loser.defeat = 'button';
  buttonEvent = { loser, how, t: 0 };
  puck = null;
  state = 'button';
  shake = 14;
  for (let i = 0; i < 40; i++) {
    const a = rand(0, TAU), s = rand(80, 320);
    particles.push({ x: CONFIG.BUTTON_X, y: CONFIG.BUTTON_Y - 8, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      g: 300, life: rand(0.5, 1.1), max: 1.1, size: rand(2, 4), color: i % 2 ? '#ffe14d' : '#ff3030', glow: true });
  }
}

/** Decides the winner and shows the game-over screen. */
function showGameOver() {
  for (const p of players) if (!p.defeat && p.health <= 0) p.defeat = 'health';
  const losers = players.filter(p => p.defeat);
  result = losers.length >= 2
    ? { winner: null, losers }
    : { winner: players.find(p => !p.defeat), losers };
  state = 'gameover';
  gameOverTimer = 0;
}

function defeatMessage(p) {
  switch (p.defeat) {
    case 'button':
      return buttonEvent && buttonEvent.how === 'click'
        ? `${p.name} clicked the red button during their own turn!`
        : `${p.name} hit the red button with a puck!`;
    case 'water':
      return `${p.name} fell into the water.`;
    default:
      return `${p.name} ran out of health.`;
  }
}

/* ======================================================================
 * 7. SQUIRREL MOVEMENT AND PHYSICS
 * ====================================================================== */

/**
 * Moves a grounded squirrel one pixel left/right, following the slope.
 * Returns false if blocked by a cliff, overhang or the screen edge.
 */
function stepPlayer(p, dir) {
  const nx = p.x + dir;
  if (nx < 4 || nx > W - 4) return false;

  // Climb: how far up do we need to go for our feet to be free?
  let climb = 0;
  while (isSolid(nx, p.y - climb) && climb <= CONFIG.MAX_STEP_UP) climb++;
  if (climb > CONFIG.MAX_STEP_UP) return false;          // too steep
  const ny = p.y - climb;
  if (isSolid(nx, ny - PLAYER_HEIGHT + 6)) return false; // head would hit ground

  p.x = nx;
  p.y = ny;

  // Walking downhill: snap down to the ground if it's close, else start falling
  if (!isSolid(p.x, p.y + 1)) {
    let drop = 1;
    while (drop <= CONFIG.MAX_STEP_DOWN && !isSolid(p.x, p.y + 1 + drop)) drop++;
    if (drop <= CONFIG.MAX_STEP_DOWN) p.y += drop;
    else { p.grounded = false; p.vy = 0; }
  }
  return true;
}

/** Gravity for squirrels: falling when the ground disappears, drowning in water. */
function updatePlayerPhysics(p, dt) {
  if (p.grounded && !isSolid(p.x, p.y + 1)) {
    p.grounded = false;
    p.vy = 0;
  }
  if (p.grounded) return;

  p.vy = Math.min(p.vy + CONFIG.PLAYER_GRAVITY * dt, p.inWater ? 60 : 900);
  let dist = p.vy * dt;
  while (dist > 0) {
    const s = Math.min(1, dist);
    if (!p.inWater && isSolid(p.x, Math.floor(p.y) + 1)) {   // landed
      p.y = Math.floor(p.y);
      p.grounded = true;
      p.vy = 0;
      return;
    }
    p.y += s;
    dist -= s;
  }

  // Into the water: instant loss
  if (!p.inWater && p.y > CONFIG.WATER_Y + 4) {
    p.inWater = true;
    if (!p.defeat) p.defeat = 'water';
    spawnSplash(p.x, CONFIG.WATER_Y, 30);
    showBanner('SPLASH!', '#ffffff');
  }
}

/** Movement phase: walk with Left/Right while there is movement left. */
function updateMovePhase(dt) {
  const p = active();
  p.walking = false;
  if (!p.grounded || p.defeat) return;

  const dir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  if (dir === 0 || moveLeft <= 0) { walkAccum = 0; return; }

  p.facing = dir;
  p.walking = true;
  p.walkPhase += dt * 14;
  walkAccum += CONFIG.WALK_SPEED * dt;
  while (walkAccum >= 1 && moveLeft > 0) {
    walkAccum -= 1;
    if (!stepPlayer(p, dir)) { walkAccum = 0; p.walking = false; break; }
    moveLeft -= 1;
    if (!p.grounded) break;           // walked off a ledge
  }
}

/* ======================================================================
 * 8. AIMING, SHOOTING AND THE PUCK
 * ====================================================================== */

/** Unit vector of the current aim (angle is measured toward the opponent). */
function aimVector(p) {
  const opp = players[1 - p.index];
  const toward = Math.sign(opp.x - p.x) || (p.index === 0 ? 1 : -1);
  const a = p.aim * Math.PI / 180;
  return { x: Math.cos(a) * toward, y: -Math.sin(a) };
}

function updateFacingFromAim(p) {
  const d = aimVector(p);
  if (Math.abs(d.x) > 0.02) p.facing = Math.sign(d.x);
}

function updateAimPhase(dt) {
  const p = active();
  const angleDir = (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0);
  const powerDir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  p.aim = clamp(p.aim + angleDir * CONFIG.AIM_SPEED * dt, 0, 180);
  p.power = clamp(p.power + powerDir * CONFIG.POWER_SPEED * dt, 5, 100);
  updateFacingFromAim(p);
}

/** Swing phase: release the puck at the moment of impact. */
function updateSwingPhase() {
  const p = active();
  if (p.swingT >= SWING_IMPACT) launchPuck(p);
}

function launchPuck(p) {
  const d = aimVector(p);
  const speed = CONFIG.MAX_SHOT_SPEED * p.power / 100;
  puck = {
    x: p.x + d.x * 20,
    y: p.y - 18 + d.y * 20,
    vx: d.x * speed,
    vy: d.y * speed,
    rot: 0,
    spin: (d.x >= 0 ? 1 : -1) * (6 + speed / 60),
    owner: p,
    age: 0,
    trail: [],
  };
  state = 'flight';
  // A few sparks off the stick
  for (let i = 0; i < 8; i++) {
    particles.push({ x: puck.x, y: puck.y, vx: rand(-80, 80) + d.x * 60, vy: rand(-80, 40), g: 200,
      life: rand(0.2, 0.4), max: 0.4, size: 2, color: '#ffffff', glow: false });
  }
}

/** Moves the puck in small sub-steps so it never tunnels through anything. */
function updatePuck(dt) {
  if (!puck) return;
  const steps = Math.max(1, Math.ceil(Math.hypot(puck.vx, puck.vy) * dt / 2));
  const h = dt / steps;
  for (let i = 0; i < steps; i++) {
    puck.vx += wind * h;
    puck.vy += CONFIG.GRAVITY * h;
    puck.x += puck.vx * h;
    puck.y += puck.vy * h;
    puck.age += h;
    if (checkPuckCollision()) return;
  }
  puck.rot += puck.spin * dt;
  puck.trail.push({ x: puck.x, y: puck.y });
  if (puck.trail.length > 14) puck.trail.shift();
}

/** Geometry of the red button (housing + dome) and its post. */
const BUTTON = {
  housingX0: CONFIG.BUTTON_X - 26,
  housingX1: CONFIG.BUTTON_X + 26,
  housingY0: CONFIG.BUTTON_Y,
  housingY1: CONFIG.BUTTON_Y + 16,
  postX0: CONFIG.BUTTON_X - 6,
  postX1: CONFIG.BUTTON_X + 6,
};

/** True if a circle of radius r at (x, y) touches the button itself. */
function touchesButton(x, y, r) {
  const dx = x - CONFIG.BUTTON_X, dy = y - CONFIG.BUTTON_Y;
  const onDome = dy <= 2 && Math.hypot(dx, dy) < CONFIG.BUTTON_RADIUS + r;
  const onHousing = x > BUTTON.housingX0 - r && x < BUTTON.housingX1 + r
                 && y > BUTTON.housingY0 - r && y < BUTTON.housingY1 + r;
  return onDome || onHousing;
}

/** Checks everything the puck can hit. Returns true if the flight ended. */
function checkPuckCollision() {
  const { x, y, owner } = puck;

  // 1. The red button: a direct hit means the shooter loses
  if (touchesButton(x, y, PUCK_RADIUS)) {
    triggerButton(owner, 'puck');
    return true;
  }
  // 2. The button's post: an ordinary obstacle
  if (x > BUTTON.postX0 - PUCK_RADIUS && x < BUTTON.postX1 + PUCK_RADIUS && y > BUTTON.housingY1) {
    explode(x, y);
    return true;
  }
  // 3. Squirrels (the shooter is ignored for a moment so the puck can leave the stick)
  for (const p of players) {
    if (p.inWater) continue;
    if (p === owner && puck.age < 0.2) continue;
    if (x > p.x - PLAYER_HALF_W - PUCK_RADIUS && x < p.x + PLAYER_HALF_W + PUCK_RADIUS &&
        y > p.y - PLAYER_HEIGHT - PUCK_RADIUS && y < p.y + PUCK_RADIUS) {
      explode(x, y);
      return true;
    }
  }
  // 4. Terrain
  if (isSolid(x, y) || isSolid(x + 4, y) || isSolid(x - 4, y) || isSolid(x, y + 4) || isSolid(x, y - 4)) {
    explode(x, y);
    return true;
  }
  // 5. Water: harmless splash
  if (y >= CONFIG.WATER_Y) {
    spawnSplash(x, CONFIG.WATER_Y, 22);
    floatTexts.push({ x, y: CONFIG.WATER_Y - 30, text: 'Splash!', color: '#ffffff', life: 1.2 });
    puck = null;
    enterSettle();
    return true;
  }
  // 6. Far off the side of the screen
  if (x < -400 || x > W + 400) {
    puck = null;
    enterSettle();
    return true;
  }
  return false;
}

/** Explosion: crater, distance-based damage, effects. */
function explode(x, y) {
  puck = null;
  carveCrater(x, y, CONFIG.CRATER_RADIUS);

  for (const p of players) {
    if (p.inWater) continue;
    // Distance from the blast to the closest point of the squirrel's body
    const cx = clamp(x, p.x - PLAYER_HALF_W, p.x + PLAYER_HALF_W);
    const cy = clamp(y, p.y - PLAYER_HEIGHT, p.y);
    const d = Math.hypot(x - cx, y - cy);
    if (d >= CONFIG.DAMAGE_RADIUS) continue;
    const dmg = Math.round(CONFIG.MAX_DAMAGE * (1 - d / CONFIG.DAMAGE_RADIUS));
    if (dmg <= 0) continue;
    p.health = Math.max(0, p.health - dmg);
    p.hurtT = 0.7;
    floatTexts.push({ x: p.x, y: p.y - 55, text: `-${dmg}`, color: p.color, life: 1.4 });
  }

  spawnExplosion(x, y);
  shake = 10;
  enterSettle();
}

/* ======================================================================
 * 9. PARTICLES AND EFFECTS
 * ====================================================================== */
function spawnExplosion(x, y) {
  flashes.push({ x, y, t: 0 });
  for (let i = 0; i < 28; i++) {                  // dirt debris
    const a = rand(Math.PI * 1.05, Math.PI * 1.95), s = rand(120, 380);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 750,
      life: rand(0.7, 1.3), max: 1.3, size: rand(2, 4.5), color: Math.random() < 0.5 ? '#6c4325' : '#8b5a33', glow: false });
  }
  for (let i = 0; i < 16; i++) {                  // fire
    const a = rand(0, TAU), s = rand(30, 160);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: -60,
      life: rand(0.25, 0.6), max: 0.6, size: rand(6, 12), color: Math.random() < 0.5 ? '#ffb02e' : '#ff5a1f', glow: true });
  }
  for (let i = 0; i < 10; i++) {                  // smoke
    const a = rand(0, TAU), s = rand(10, 60);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, g: -40,
      life: rand(1, 1.8), max: 1.8, size: rand(10, 18), color: '#6b6b6b', smoke: true });
  }
}

function spawnSplash(x, y, count) {
  for (let i = 0; i < count; i++) {
    particles.push({ x: x + rand(-8, 8), y, vx: rand(-130, 130), vy: rand(-460, -180), g: 900,
      life: rand(0.6, 1.0), max: 1.0, size: rand(2, 4), color: Math.random() < 0.5 ? '#d8f1ff' : '#5fb0f0', water: true });
  }
}

function updateEffects(dt) {
  for (const pt of particles) {
    pt.vy += pt.g * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.smoke) pt.size += 12 * dt;
    // Debris and drops vanish when they reach the water
    if (!pt.glow && !pt.smoke && pt.y > CONFIG.WATER_Y + 4) pt.life = 0;
  }
  particles = particles.filter(pt => pt.life > 0);

  for (const f of flashes) f.t += dt;
  flashes = flashes.filter(f => f.t < 0.35);

  for (const t of floatTexts) { t.y -= 30 * dt; t.life -= dt; }
  floatTexts = floatTexts.filter(t => t.life > 0);

  if (banner) { banner.t += dt; if (banner.t > 1.6) banner = null; }
  shake = Math.max(0, shake - 30 * dt);

  // Clouds drift with the wind
  for (const c of clouds) {
    c.x += (windLevel * 6 + 4) * dt * c.depth;
    if (c.x > W + 120) c.x = -120;
    if (c.x < -120) c.x = W + 120;
  }
}

function showBanner(text, color) {
  banner = { text, color, t: 0 };
}

/* ======================================================================
 * 10. MAIN UPDATE
 * ====================================================================== */
function update(dt) {
  time += dt;
  updateEffects(dt);

  if (state !== 'title') {
    for (const p of players) {
      updatePlayerPhysics(p, dt);
      if (p.hurtT > 0) p.hurtT -= dt;
      if (p.swingT >= 0) p.swingT += dt;
      if (p !== active() || state !== 'move') p.walking = false;
    }
  }

  switch (state) {
    case 'move':   updateMovePhase(dt); break;
    case 'aim':    updateAimPhase(dt); break;
    case 'swing':  updateSwingPhase(); break;
    case 'flight': updatePuck(dt); break;
    case 'settle': {
      settleTimer += dt;
      const calm = players.every(p => p.grounded || p.inWater);
      if ((settleTimer > 1.0 && calm && particles.length < 10) || settleTimer > 4) {
        if (players.some(p => p.defeat || p.health <= 0)) showGameOver();
        else nextTurn();
      }
      break;
    }
    case 'button':
      buttonEvent.t += dt;
      if (buttonEvent.t > 2.4) showGameOver();
      break;
    case 'gameover':
      gameOverTimer += dt;
      break;
  }

  // Someone walked or fell into the water outside of a shot: end the game
  if ((state === 'move' || state === 'aim') && players.some(p => p.defeat)) enterSettle();
}

/* ======================================================================
 * 11. RENDERING: WORLD
 * ====================================================================== */
function initClouds() {
  clouds = [];
  for (let i = 0; i < 7; i++) {
    clouds.push({ x: rand(0, W), y: rand(40, 260), scale: rand(0.6, 1.3), depth: rand(0.5, 1.2) });
  }
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, CONFIG.WATER_Y);
  g.addColorStop(0, '#5fb3ea');
  g.addColorStop(1, '#d6efff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Sun
  const sun = ctx.createRadialGradient(1130, 95, 10, 1130, 95, 90);
  sun.addColorStop(0, 'rgba(255,248,200,1)');
  sun.addColorStop(0.35, 'rgba(255,235,150,0.9)');
  sun.addColorStop(1, 'rgba(255,235,150,0)');
  ctx.fillStyle = sun;
  ctx.beginPath();
  ctx.arc(1130, 95, 90, 0, TAU);
  ctx.fill();

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, TAU);
    ctx.arc(28, -10, 30, 0, TAU);
    ctx.arc(58, 0, 24, 0, TAU);
    ctx.arc(30, 10, 24, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawWater() {
  const g = ctx.createLinearGradient(0, CONFIG.WATER_Y, 0, H);
  g.addColorStop(0, 'rgba(40,125,205,0.82)');
  g.addColorStop(1, 'rgba(14,52,115,0.96)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 16) ctx.lineTo(x, waveY(x));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 16) {
    if (x === 0) ctx.moveTo(x, waveY(x)); else ctx.lineTo(x, waveY(x));
  }
  ctx.stroke();
}

function waveY(x) {
  return CONFIG.WATER_Y + Math.sin(x * 0.025 + time * 1.8) * 3 + Math.sin(x * 0.06 - time * 1.1) * 1.5;
}

/** The big red button on its post, plus a warning label. */
function drawButton() {
  const bx = CONFIG.BUTTON_X, by = CONFIG.BUTTON_Y, r = CONFIG.BUTTON_RADIUS;
  const triggered = state === 'button' || (state === 'gameover' && buttonEvent);
  const flashOn = triggered && Math.floor((buttonEvent.t || time) * 10) % 2 === 0;

  // Glow and shock rings when triggered
  if (triggered) {
    const glow = ctx.createRadialGradient(bx, by, 5, bx, by, 160);
    glow.addColorStop(0, flashOn ? 'rgba(255,255,255,0.9)' : 'rgba(255,40,40,0.8)');
    glow.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(bx, by, 160, 0, TAU);
    ctx.fill();
    if (state === 'button') {
      for (let i = 0; i < 3; i++) {
        const rr = ((buttonEvent.t * 220) + i * 80) % 260;
        ctx.strokeStyle = `rgba(255,60,60,${1 - rr / 260})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(bx, by, rr, 0, TAU);
        ctx.stroke();
      }
    }
  }

  // Post (metal pole going into the water)
  ctx.fillStyle = '#7f8792';
  ctx.fillRect(BUTTON.postX0, BUTTON.housingY1, BUTTON.postX1 - BUTTON.postX0, H - BUTTON.housingY1);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(BUTTON.postX0 + 2, BUTTON.housingY1, 3, H - BUTTON.housingY1);

  // Housing with hazard stripes
  ctx.save();
  roundRectPath(ctx, BUTTON.housingX0, BUTTON.housingY0, 52, 16, 4);
  ctx.fillStyle = '#ffcc1a';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#222';
  for (let x = BUTTON.housingX0 - 20; x < BUTTON.housingX1 + 20; x += 12) {
    ctx.beginPath();
    ctx.moveTo(x, BUTTON.housingY1);
    ctx.lineTo(x + 6, BUTTON.housingY1);
    ctx.lineTo(x + 22, BUTTON.housingY0);
    ctx.lineTo(x + 16, BUTTON.housingY0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;
  roundRectPath(ctx, BUTTON.housingX0, BUTTON.housingY0, 52, 16, 4);
  ctx.stroke();

  // Dome
  ctx.fillStyle = triggered ? (flashOn ? '#ffffff' : '#ff2020') : '#d61a1a';
  ctx.beginPath();
  ctx.ellipse(bx, by + 1, r, r * 0.85, 0, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#7a0b0b';
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(bx - 6, by - 8, 5, 3, -0.5, 0, TAU);
  ctx.fill();

  // Floating warning label
  if (!triggered) {
    const ly = by - 46 + Math.sin(time * 3) * 3;
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    roundRectPath(ctx, bx - 52, ly - 11, 104, 22, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
    ctx.fillStyle = '#c01515';
    ctx.fillText('DO NOT PRESS', bx, ly + 1);
    ctx.beginPath();
    ctx.moveTo(bx - 6, ly + 11);
    ctx.lineTo(bx + 6, ly + 11);
    ctx.lineTo(bx, ly + 18);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
  }
}

/** Current stick angle for a squirrel (radians from straight down, + = forward). */
function stickAngle(p) {
  if (p.swingT < 0) return STICK_REST;
  const t = Math.min(p.swingT, SWING_TIME);
  if (t < 0.22) return lerp(STICK_REST, -2.3, easeOutCubic(t / 0.22));   // wind-up
  if (t < 0.32) return lerp(-2.3, 1.2, (t - 0.22) / 0.1);                 // slap!
  return lerp(1.2, 1.9, easeOutCubic((t - 0.32) / (SWING_TIME - 0.32))); // follow-through
}

/**
 * Draws a squirrel in a hockey helmet holding a stick.
 * Drawn facing right in local coordinates (origin at the feet), mirrored when facing left.
 */
function drawSquirrel(p) {
  if (p.inWater && p.y > H + 40) return;
  const fur = '#a8672f', furDark = '#73421d', furLight = '#ecc89c';

  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.hurtT > 0 && Math.floor(p.hurtT * 20) % 2 === 0) ctx.globalAlpha = 0.45;
  ctx.scale(p.facing, 1);
  const bob = p.walking ? Math.abs(Math.sin(p.walkPhase)) * 2 : 0;
  ctx.translate(0, -bob);

  // Bushy tail
  ctx.fillStyle = fur;
  ctx.strokeStyle = furDark;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-6, -10);
  ctx.bezierCurveTo(-32, -8, -36, -40, -21, -52);
  ctx.bezierCurveTo(-10, -60, 3, -53, -4, -45);
  ctx.bezierCurveTo(-14, -37, -14, -23, -2, -17);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(236,200,156,0.7)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-10, -14);
  ctx.quadraticCurveTo(-28, -26, -19, -47);
  ctx.stroke();

  // Feet
  const step = p.walking ? Math.sin(p.walkPhase) * 3 : 0;
  ctx.fillStyle = furDark;
  ctx.beginPath();
  ctx.ellipse(-4 + step, -2, 5, 2.5, 0, 0, TAU);
  ctx.ellipse(5 - step, -2, 5, 2.5, 0, 0, TAU);
  ctx.fill();

  // Body in a team-coloured jersey with a white stripe
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, -15, 9, 11.5, 0, 0, TAU);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-10, -12, 20, 3);
  ctx.restore();
  ctx.strokeStyle = p.dark;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(0, -15, 9, 11.5, 0, 0, TAU);
  ctx.stroke();

  // Ear poking out behind the helmet
  ctx.fillStyle = fur;
  ctx.beginPath();
  ctx.moveTo(-4, -37);
  ctx.lineTo(-7, -47);
  ctx.lineTo(1, -40);
  ctx.closePath();
  ctx.fill();

  // Head, muzzle, nose, eye
  ctx.fillStyle = fur;
  ctx.beginPath();
  ctx.arc(4, -31, 8.5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = furLight;
  ctx.beginPath();
  ctx.ellipse(10, -27.5, 5, 3.8, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(14.5, -29, 1.7, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8, -32.5, 2.7, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(9, -32.5, 1.4, 0, TAU);
  ctx.fill();

  // Hockey helmet: dome, stripe, face cage
  ctx.fillStyle = p.color;
  ctx.strokeStyle = p.dark;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(3, -32, 10.5, Math.PI * 0.95, Math.PI * 2.03);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(3, -32, 7.5, Math.PI * 1.2, Math.PI * 1.75);
  ctx.stroke();
  ctx.strokeStyle = '#c9ced6';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(13, -33);
  ctx.quadraticCurveTo(18, -28, 13, -22);
  ctx.moveTo(9, -33);
  ctx.quadraticCurveTo(14, -27, 9, -22);
  ctx.moveTo(8, -28);
  ctx.lineTo(17, -28);
  ctx.stroke();

  // Hockey stick (angle depends on the swing animation)
  const th = stickAngle(p);
  const px = 3, py = -18, len = 20;
  const sx = Math.sin(th), sy = Math.cos(th);
  const ex = px + sx * len, ey = py + sy * len;
  const bladeA = STICK_REST - th;                // blade is horizontal at rest
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#6b4320';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(px - sx * 6, py - sy * 6);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.strokeStyle = '#151515';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex + Math.cos(bladeA) * 10, ey + Math.sin(bladeA) * 10);
  ctx.stroke();
  // Gloves
  ctx.fillStyle = p.dark;
  ctx.beginPath();
  ctx.arc(px, py, 3.2, 0, TAU);
  ctx.arc(px + sx * 8, py + sy * 8, 3.2, 0, TAU);
  ctx.fill();

  // Puck waiting on the ice... er, grass, in front of the blade while aiming
  if (p === active() && (state === 'aim' || (state === 'swing' && p.swingT < SWING_IMPACT))) {
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(22, -3, 6, 2.5, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/** Bouncing arrow above the active squirrel. */
function drawActiveMarker(p) {
  const y = p.y - 66 + Math.sin(time * 5) * 4;
  ctx.fillStyle = p.color;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(p.x - 9, y - 10);
  ctx.lineTo(p.x + 9, y - 10);
  ctx.lineTo(p.x, y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

/** Dashed aim line whose length shows the power. */
function drawAimGuide(p) {
  const d = aimVector(p);
  const ox = p.x, oy = p.y - 18;
  const len = 40 + p.power * 0.9;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(ox + d.x * 22, oy + d.y * 22);
  ctx.lineTo(ox + d.x * len, oy + d.y * len);
  ctx.stroke();
  ctx.setLineDash([]);
  const tx = ox + d.x * len, ty = oy + d.y * len, a = Math.atan2(d.y, d.x);
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.moveTo(tx + Math.cos(a) * 10, ty + Math.sin(a) * 10);
  ctx.lineTo(tx + Math.cos(a + 2.5) * 10, ty + Math.sin(a + 2.5) * 10);
  ctx.lineTo(tx + Math.cos(a - 2.5) * 10, ty + Math.sin(a - 2.5) * 10);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/** The spinning exploding puck, its trail, and an arrow if it leaves the top of the screen. */
function drawPuck() {
  if (!puck) return;
  puck.trail.forEach((t, i) => {
    ctx.fillStyle = `rgba(255,255,255,${(i / puck.trail.length) * 0.5})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 2 + i * 0.15, 0, TAU);
    ctx.fill();
  });

  ctx.save();
  ctx.translate(puck.x, puck.y);
  ctx.rotate(puck.rot);
  roundRectPath(ctx, -7, -3, 14, 6, 2.5);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(-6, -3, 12, 1.5);
  ctx.fillStyle = Math.floor(time * 12) % 2 ? '#ff3b3b' : '#ffd23b';   // blinking "fuse" light
  ctx.beginPath();
  ctx.arc(0, 0, 1.8, 0, TAU);
  ctx.fill();
  ctx.restore();

  if (puck.y < 0) {
    const x = clamp(puck.x, 20, W - 20);
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(x, 6);
    ctx.lineTo(x - 8, 20);
    ctx.lineTo(x + 8, 20);
    ctx.closePath();
    ctx.fill();
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.round(-puck.y)} px`, x, 34);
  }
}

function drawEffects() {
  for (const f of flashes) {
    const k = f.t / 0.35;
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 20 + k * 60);
    g.addColorStop(0, `rgba(255,250,210,${1 - k})`);
    g.addColorStop(0.5, `rgba(255,160,40,${0.8 * (1 - k)})`);
    g.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(f.x, f.y, 20 + k * 60, 0, TAU);
    ctx.fill();
  }
  for (const pt of particles) {
    const a = clamp(pt.life / pt.max, 0, 1);
    ctx.globalAlpha = pt.smoke ? a * 0.5 : a;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.glow ? pt.size * (0.4 + a * 0.6) : pt.size, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of floatTexts) {
    ctx.globalAlpha = clamp(t.life, 0, 1);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

/* ======================================================================
 * 12. RENDERING: HUD AND SCREENS
 * ====================================================================== */
function panel(x, y, w, h) {
  roundRectPath(ctx, x, y, w, h, 10);
  ctx.fillStyle = 'rgba(10,20,35,0.6)';
  ctx.fill();
}

function drawHealthPanel(p, x) {
  const isActive = p === active() && state !== 'title' && state !== 'gameover';
  panel(x, 14, 270, 62);
  if (isActive) {
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3;
    roundRectPath(ctx, x, 14, 270, 62, 10);
    ctx.stroke();
  }
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.fillStyle = p.light;
  ctx.fillText(`${p.name} Squirrel`, x + 14, 32);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.fillText(`${Math.ceil(p.health)} HP`, x + 256, 32);

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x + 14, 48, 242, 14);
  ctx.fillStyle = p.color;
  ctx.fillRect(x + 14, 48, 242 * (p.health / CONFIG.START_HEALTH), 14);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 14.5, 48.5, 241, 13);
}

function drawWind(cx, cy) {
  panel(cx - 90, cy - 26, 180, 52);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('WIND', cx, cy - 13);
  if (windLevel === 0) {
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('Calm (0)', cx, cy + 8);
    return;
  }
  const dir = Math.sign(windLevel);
  const len = 14 + Math.abs(windLevel) * 5;
  const ax = cx - 20;                    // arrow centre (number goes to the right)
  ctx.strokeStyle = '#9fe0ff';
  ctx.fillStyle = '#9fe0ff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(ax - dir * len / 2, cy + 8);
  ctx.lineTo(ax + dir * len / 2, cy + 8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ax + dir * (len / 2 + 9), cy + 8);
  ctx.lineTo(ax + dir * (len / 2 - 2), cy + 1);
  ctx.lineTo(ax + dir * (len / 2 - 2), cy + 15);
  ctx.closePath();
  ctx.fill();
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(String(Math.abs(windLevel)), cx + 48, cy + 9);
}

function drawHUD() {
  drawHealthPanel(players[0], 14);
  drawHealthPanel(players[1], W - 284);

  // Turn info + wind in the top centre
  const p = active();
  panel(W / 2 - 150, 14, 300, 34);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  const phaseName = { move: 'Move', aim: 'Aim', swing: 'Shoot!', flight: 'Puck in the air', settle: '...', button: '!!!', gameover: '' }[state] || '';
  // "Round N · <Name> · <Phase>", with the name in team colour, centred as a whole
  const parts = [
    [`Round ${round} · `, '#fff'],
    [p.name, p.light],
    [phaseName ? ` · ${phaseName}` : '', '#fff'],
  ];
  const total = parts.reduce((sum, [text]) => sum + ctx.measureText(text).width, 0);
  let tx = W / 2 - total / 2;
  ctx.textAlign = 'left';
  for (const [text, color] of parts) {
    ctx.fillStyle = color;
    ctx.fillText(text, tx, 31);
    tx += ctx.measureText(text).width;
  }
  drawWind(W / 2, 86);

  // Bottom panel: movement bar or angle/power
  const bx = W / 2 - 220, by = H - 74;
  if (state === 'move') {
    panel(bx, by, 440, 60);
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Movement left: ${Math.round(moveLeft)}`, bx + 16, by + 18);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(bx + 16, by + 32, 200, 14);
    ctx.fillStyle = '#7ddc5a';
    ctx.fillRect(bx + 16, by + 32, 200 * (moveLeft / CONFIG.MOVE_DISTANCE), 14);
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('← / → walk', bx + 236, by + 20);
    ctx.fillText('Enter: done moving', bx + 236, by + 42);
  } else if (state === 'aim') {
    const elevation = p.aim <= 90 ? p.aim : 180 - p.aim;
    const arrow = aimVector(p).x >= 0 ? '→' : '←';
    panel(bx, by, 440, 60);
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Angle: ${Math.round(elevation)}° ${arrow}`, bx + 16, by + 18);
    ctx.fillText(`Power: ${Math.round(p.power)}%`, bx + 130, by + 18);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(bx + 16, by + 32, 200, 14);
    const pg = ctx.createLinearGradient(bx + 16, 0, bx + 216, 0);
    pg.addColorStop(0, '#ffe14d');
    pg.addColorStop(1, '#ff3b2f');
    ctx.fillStyle = pg;
    ctx.fillRect(bx + 16, by + 32, 200 * (p.power / 100), 14);
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('↑ / ↓ angle   ← / → power', bx + 236, by + 20);
    ctx.fillText('Space: SHOOT', bx + 236, by + 42);
  }

  // Turn banner
  if (banner) {
    const a = banner.t < 1.2 ? 1 : 1 - (banner.t - 1.2) / 0.4;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = 'bold 44px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.strokeText(banner.text, W / 2, 200);
    ctx.fillStyle = banner.color;
    ctx.fillText(banner.text, W / 2, 200);
    ctx.globalAlpha = 1;
  }
}

/** Big flashing alert while the red button "goes off". */
function drawButtonAlarm() {
  const t = buttonEvent.t;
  ctx.fillStyle = `rgba(255,0,0,${0.15 + 0.15 * Math.sin(t * 20)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 54px system-ui, sans-serif';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#000';
  const text = 'THE RED BUTTON WAS PRESSED!';
  ctx.strokeText(text, W / 2, 250);
  ctx.fillStyle = Math.floor(t * 8) % 2 ? '#ffffff' : '#ff3030';
  ctx.fillText(text, W / 2, 250);
}

function drawTitle() {
  ctx.fillStyle = 'rgba(8,16,30,0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 68px system-ui, sans-serif';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#000';
  ctx.strokeText('SLAPSHOT SQUIRRELS', W / 2, 150);
  ctx.fillStyle = '#ffd23b';
  ctx.fillText('SLAPSHOT SQUIRRELS', W / 2, 150);

  ctx.font = '20px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('Two squirrels. Two islands. Exploding hockey pucks.', W / 2, 210);

  const lines = [
    ['Move phase', '← / → walk along the island, Enter to finish moving'],
    ['Aim phase', '↑ / ↓ change angle, ← / → change power, Space to shoot'],
    ['Win by', 'reducing the other squirrel to 0 HP or knocking them into the water'],
    ['Never', 'hit the red button with a puck, or click it on your turn. You lose instantly.'],
  ];
  ctx.font = '17px system-ui, sans-serif';
  lines.forEach(([k, v], i) => {
    const y = 275 + i * 36;
    ctx.textAlign = 'right';
    ctx.fillStyle = i === 3 ? '#ff6b6b' : '#9fe0ff';
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillText(k, W / 2 - 200, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = '17px system-ui, sans-serif';
    ctx.fillText(v, W / 2 - 180, y);
  });

  ctx.textAlign = 'center';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.4 * Math.sin(time * 4)})`;
  ctx.fillText('Press ENTER or click to start', W / 2, 470);
}

/** Rectangle of the "Play again" button on the game-over screen. */
const PLAY_AGAIN = { x: W / 2 - 110, y: 430, w: 220, h: 56 };

function drawGameOver() {
  ctx.fillStyle = `rgba(8,16,30,${Math.min(0.7, gameOverTimer * 1.5)})`;
  ctx.fillRect(0, 0, W, H);
  panel(W / 2 - 330, 170, 660, 350);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 56px system-ui, sans-serif';
  if (result.winner) {
    ctx.fillStyle = result.winner.color;
    ctx.fillText(`${result.winner.name} wins!`, W / 2, 240);
  } else {
    ctx.fillStyle = '#fff';
    ctx.fillText("It's a draw!", W / 2, 240);
  }
  ctx.font = '22px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  result.losers.forEach((p, i) => ctx.fillText(defeatMessage(p), W / 2, 310 + i * 34));
  if (result.losers.some(p => p.defeat === 'button')) {
    ctx.font = 'italic 17px system-ui, sans-serif';
    ctx.fillStyle = '#ff9a9a';
    ctx.fillText('It said DO NOT PRESS.', W / 2, 385);
  }

  const hover = inRect(mouse, PLAY_AGAIN);
  roundRectPath(ctx, PLAY_AGAIN.x, PLAY_AGAIN.y, PLAY_AGAIN.w, PLAY_AGAIN.h, 12);
  ctx.fillStyle = hover ? '#ffe270' : '#ffd23b';
  ctx.fill();
  ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.fillStyle = '#2a2000';
  ctx.fillText('Play again', W / 2, PLAY_AGAIN.y + PLAY_AGAIN.h / 2 + 1);
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('or press Enter', W / 2, PLAY_AGAIN.y + PLAY_AGAIN.h + 18);
}

function inRect(pt, r) {
  return pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
}

/* ======================================================================
 * 13. MAIN RENDER
 * ====================================================================== */
function render() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  drawSky();
  ctx.drawImage(terrainCanvas, 0, 0);
  drawButton();
  for (const p of players) drawSquirrel(p);
  if (state === 'aim') drawAimGuide(active());
  if (['move', 'aim', 'swing'].includes(state)) drawActiveMarker(active());
  drawPuck();
  drawWater();
  drawEffects();
  ctx.restore();

  if (state === 'title') {
    drawTitle();
    return;
  }
  drawHUD();
  if (state === 'button') drawButtonAlarm();
  if (state === 'gameover') drawGameOver();
}

/* ======================================================================
 * 14. INPUT
 * ====================================================================== */
const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'NumpadEnter'];

window.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;

  const enter = e.code === 'Enter' || e.code === 'NumpadEnter';
  if (enter) {
    if (state === 'title') newGame(true);
    else if (state === 'gameover' && gameOverTimer > 0.5) newGame(true);
    else if (state === 'move' && active().grounded) startAiming();
  }
  if (e.code === 'Space' && state === 'aim') shoot();
});

window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// States in which a turn is in progress (clicking the red button loses)
const TURN_STATES = ['move', 'aim', 'swing', 'flight', 'settle'];

canvas.addEventListener('mousedown', e => {
  const pt = toGameCoords(e);
  if (state === 'title') { newGame(true); return; }
  if (state === 'gameover') {
    if (gameOverTimer > 0.5 && inRect(pt, PLAY_AGAIN)) newGame(true);
    return;
  }
  if (TURN_STATES.includes(state) && touchesButton(pt.x, pt.y, 4)) {
    triggerButton(active(), 'click');
  }
});

canvas.addEventListener('mousemove', e => {
  const pt = toGameCoords(e);
  mouse.x = pt.x;
  mouse.y = pt.y;
  const overButton = TURN_STATES.includes(state) && touchesButton(pt.x, pt.y, 4);
  const overPlay = state === 'gameover' && inRect(pt, PLAY_AGAIN);
  canvas.style.cursor = overButton || overPlay ? 'pointer' : 'default';   // so tempting...
});

/* ======================================================================
 * 15. MAIN LOOP
 * ====================================================================== */
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - lastTime) / 1000);   // clamp to avoid huge jumps
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

initClouds();
newGame(false);
requestAnimationFrame(frame);
</script>
