<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slapshot Squirrels</title>
<!--
  SLAPSHOT SQUIRRELS
  A small two-player, turn-based artillery game (inspired by Worms).
  Two hockey-helmeted squirrels on two islands slap exploding pucks at
  each other. Whatever you do: DO NOT touch the red button.

  Modes: 2 players on one keyboard (hot-seat), or play Red against a
  computer-controlled Blue on Easy, Normal or Hard (see AI_LEVELS).

  FINAL BOSS: from round 8 the Seagull Striker (a seagull built like a
  jet fighter) flies over at the start of every round and drops one blob of
  explosive poop on each island. A puck that hits a poop sets off a giant
  explosion with a big knockback. A squirrel knocked into a poop sets it off
  too. A player whose own island is wiped out loses.

  FINAL FINAL BOSS: beat the computer and the Seagull Striker drops a giant
  Mega Squirrel onto its island (or onto a raft if the island is gone).
  The jet stops dropping poop from then on. Beat the Mega Squirrel to win.

  Single self-contained file: HTML + CSS + JavaScript (Canvas API).
  No external libraries or assets. Open it in any modern desktop browser.
-->
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1620;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #8fd0f5;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>

<script>
'use strict';

/* ======================================================================
 * 1. CONFIGURATION: tweak these values to change how the game plays
 * ====================================================================== */
const CONFIG = {
  // World
  WIDTH: 1280,
  HEIGHT: 720,
  WATER_Y: 620,             // y-coordinate of the water surface

  // Islands
  LEFT_ISLAND_X: 250,       // centre x of Red's island
  RIGHT_ISLAND_X: 1030,     // centre x of Blue's island
  ISLAND_HALF_WIDTH: 200,   // half the width of an island (px)
  ISLAND_HEIGHT: 150,       // peak height of an island above the water (px)

  // Physics
  GRAVITY: 520,             // downward acceleration of the puck (px/s²)
  MAX_SHOT_SPEED: 950,      // puck launch speed at 100% power (px/s)
  WIND_MAX: 120,            // wind acceleration at wind level 10 (px/s²)
  PLAYER_GRAVITY: 900,      // falling acceleration for squirrels (px/s²)

  // Explosions and damage
  CRATER_RADIUS: 40,        // radius of terrain removed by an explosion
  DAMAGE_RADIUS: 65,        // no damage beyond this distance from the blast
  MAX_DAMAGE: 40,           // damage for a direct hit
  START_HEALTH: 100,

  // Movement
  MOVE_DISTANCE: 140,       // pixels a squirrel may walk per turn
  WALK_SPEED: 80,           // walking speed (px/s)
  MAX_STEP_UP: 3,           // max climb per pixel walked (higher = steeper slopes allowed)
  MAX_STEP_DOWN: 5,         // max drop per pixel walked before the squirrel starts falling

  // Aiming
  AIM_SPEED: 60,            // degrees per second while holding Up/Down
  POWER_SPEED: 45,          // percent per second while holding Left/Right

  // The red button (sits on a post in the water between the islands)
  BUTTON_X: 640,
  BUTTON_Y: 340,            // y of the top of the button housing (raised high so shots must arc over it)
  BUTTON_RADIUS: 18,

  // Final boss: the Seagull Striker
  BOSS_AFTER_ROUNDS: 7,     // the boss first appears at the start of round BOSS_AFTER_ROUNDS + 1 (round 8)
  BOSS_EVERY_ROUND: true,   // once it has arrived, it bombs again at the start of every round
  BOSS_SPEED: 520,          // flying speed (px/s)
  POOP_RADIUS: 14,          // hit radius of an explosive poop
  POOP_CRATER_RADIUS: 95,   // hole made when a poop explodes
  POOP_DAMAGE_RADIUS: 130,
  POOP_MAX_DAMAGE: 50,
  ISLAND_GONE_FRACTION: 0.1, // an island is "destroyed" when less than 10% of it is left

  // Final final boss: the Mega Squirrel (vs Computer only, after beating the AI)
  MEGA_HEALTH: 200,
  MEGA_SCALE: 2,            // size compared to a normal squirrel
  MEGA_DAMAGE_MULT: 1.3,    // its pucks hit harder...
  MEGA_CRATER_MULT: 1.3,    // ...and dig bigger holes
  MEGA_RAFT_HALF_WIDTH: 60, // raft used when the AI's island is (nearly) gone

  // Knockback: explosions push squirrels away from the blast centre
  SQUIRREL_LENGTH: 32,      // px counted as "one squirrel"
  KNOCKBACK_MIN: 1,         // squirrels pushed at the edge of the blast
  KNOCKBACK_MAX: 3,         // squirrels pushed by a direct hit
  KNOCKBACK_SPEED: 240,     // px/s while being pushed
  POOP_KNOCKBACK_MIN: 2,    // poop explosions push much harder:
  POOP_KNOCKBACK_MAX: 6,    //   2 squirrels at the edge, 6 right next to it
  HEAL_FOR_MEGA: true,      // the human gets full health back when the Mega Squirrel arrives
};

/*
 * AI difficulty levels (the computer always plays Blue).
 * The AI predicts where shots land using the real puck physics, picks the
 * shot that lands closest to its opponent, then adds human-like mistakes:
 *   windAwareness: how much of the wind the AI accounts for (0 = ignores it, 1 = exact)
 *   angleError / powerError: typical aiming mistake in degrees / percent
 *   maxWalk: the AI walks a random distance up to this (px) before aiming
 *   thinkTime: pause (s) before it starts adjusting its aim
 */
const AI_LEVELS = {
  easy:   { label: 'Easy',   windAwareness: 0.3,  angleError: 6,   powerError: 6,   maxWalk: 30, thinkTime: 1.0 },
  normal: { label: 'Normal', windAwareness: 0.7,  angleError: 2.5, powerError: 2.5, maxWalk: 60, thinkTime: 0.8 },
  hard:   { label: 'Hard',   windAwareness: 1,    angleError: 1.3, powerError: 1.3, maxWalk: 80, thinkTime: 0.6 },
};

const W = CONFIG.WIDTH;
const H = CONFIG.HEIGHT;
const TAU = Math.PI * 2;

// Size of a normal squirrel's hit box (feet are at p.y; the box goes up from there).
// Each player stores its own size (p.halfW, p.height, p.scale) so the Mega Squirrel can be bigger.
const PLAYER_HALF_W = 11;
const PLAYER_HEIGHT = 38;
const PUCK_RADIUS = 5;

// Hockey-stick swing timings (seconds)
const STICK_REST = 0.55;    // stick angle (radians from straight down) when idle
const SWING_TIME = 0.45;    // full swing animation length
const SWING_IMPACT = 0.29;  // moment the stick hits the puck

const TEAMS = [
  { name: 'Red',  color: '#e0393a', dark: '#97191b', light: '#ff9a9a' },
  { name: 'Blue', color: '#2f6fe0', dark: '#173f91', light: '#9cc0ff' },
];

/* ======================================================================
 * 2. SMALL HELPERS
 * ====================================================================== */
const rand = (min, max) => min + Math.random() * (max - min);
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

/** Draws a rounded-rectangle path (fill/stroke it afterwards). */
function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ======================================================================
 * 3. CANVAS SETUP: fixed 1280x720 game, scaled to fit the window
 * ====================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = `${W * scale}px`;
  canvas.style.height = `${H * scale}px`;
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

/** Converts a mouse event into game (canvas) coordinates. */
function toGameCoords(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (W / r.width),
    y: (e.clientY - r.top) * (H / r.height),
  };
}

/* ======================================================================
 * 4. DESTRUCTIBLE TERRAIN
 *    The islands are drawn once into an off-screen canvas (for looks)
 *    and mirrored in a per-pixel "solid" array (for collisions).
 *    Explosions erase circles from both.
 * ====================================================================== */
const terrainCanvas = document.createElement('canvas');
terrainCanvas.width = W;
terrainCanvas.height = H;
const tctx = terrainCanvas.getContext('2d', { willReadFrequently: true });
const solid = new Uint8Array(W * H);

/** True if the pixel at (x, y) is ground. */
function isSolid(x, y) {
  x = Math.floor(x);
  y = Math.floor(y);
  if (x < 0 || x >= W || y < 0 || y >= H) return false;
  return solid[y * W + x] === 1;
}

/** Builds two fresh random islands and the collision map. */
function generateTerrain() {
  tctx.clearRect(0, 0, W, H);
  drawIsland(CONFIG.LEFT_ISLAND_X);
  drawIsland(CONFIG.RIGHT_ISLAND_X);

  // Copy the alpha channel into the collision map
  const data = tctx.getImageData(0, 0, W, H).data;
  for (let i = 0; i < W * H; i++) solid[i] = data[i * 4 + 3] > 127 ? 1 : 0;
  islandBaseArea[0] = islandArea(0);
  islandBaseArea[1] = islandArea(1);
}

/** Draws one island centred on cx: a bumpy hill with grass on top. */
function drawIsland(cx) {
  const hw = CONFIG.ISLAND_HALF_WIDTH;
  const phase = [rand(0, TAU), rand(0, TAU), rand(0, TAU)];

  // Surface outline: tall in the middle, dipping under water at the edges
  const top = [];
  for (let x = cx - hw; x <= cx + hw; x += 2) {
    const t = (x - cx) / hw;                                        // -1..1
    const base = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(t), 4)), 0.6);
    const bumps = 14 * Math.sin(t * 3 + phase[0])
                + 7 * Math.sin(t * 7 + phase[1])
                + 3 * Math.sin(t * 13 + phase[2]);
    const heightAboveWater = (CONFIG.ISLAND_HEIGHT + bumps) * base - 30 * (1 - base);
    top.push([x, CONFIG.WATER_Y - heightAboveWater]);
  }

  // Body: earth that turns sandy near the waterline
  const g = tctx.createLinearGradient(0, CONFIG.WATER_Y - CONFIG.ISLAND_HEIGHT - 20, 0, CONFIG.WATER_Y + 30);
  g.addColorStop(0, '#8b5a33');
  g.addColorStop(0.65, '#6c4325');
  g.addColorStop(0.88, '#d8bf86');
  g.addColorStop(1, '#c4a56b');
  tctx.fillStyle = g;
  tctx.beginPath();
  tctx.moveTo(top[0][0], H);
  for (const [x, y] of top) tctx.lineTo(x, y);
  tctx.lineTo(top[top.length - 1][0], H);
  tctx.closePath();
  tctx.fill();

  // Pebbles (drawn only on top of the island thanks to 'source-atop')
  tctx.save();
  tctx.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 160; i++) {
    tctx.fillStyle = Math.random() < 0.5 ? 'rgba(60,35,18,0.45)' : 'rgba(190,150,100,0.35)';
    tctx.beginPath();
    tctx.arc(cx + rand(-hw, hw), rand(CONFIG.WATER_Y - CONFIG.ISLAND_HEIGHT, CONFIG.WATER_Y), rand(1.5, 4), 0, TAU);
    tctx.fill();
  }
  tctx.restore();

  // Grass along the top edge (only the part above water)
  const grassPath = () => {
    tctx.beginPath();
    let drawing = false;
    for (const [x, y] of top) {
      if (y < CONFIG.WATER_Y - 8) {
        if (!drawing) tctx.moveTo(x, y); else tctx.lineTo(x, y);
        drawing = true;
      } else {
        drawing = false;
      }
    }
  };
  tctx.lineJoin = 'round';
  tctx.lineCap = 'round';
  tctx.strokeStyle = '#3f9a35';
  tctx.lineWidth = 8;
  grassPath();
  tctx.stroke();
  tctx.strokeStyle = '#72cf55';
  tctx.lineWidth = 3;
  tctx.save();
  tctx.translate(0, -2);
  grassPath();
  tctx.stroke();
  tctx.restore();
}

/** Removes a circle of ground (explosion crater) and scorches its rim. */
function carveCrater(cx, cy, r) {
  tctx.save();
  tctx.globalCompositeOperation = 'destination-out';
  tctx.beginPath();
  tctx.arc(cx, cy, r, 0, TAU);
  tctx.fill();
  tctx.globalCompositeOperation = 'source-atop';      // only darkens existing ground
  tctx.strokeStyle = 'rgba(35,20,8,0.55)';
  tctx.lineWidth = 7;
  tctx.beginPath();
  tctx.arc(cx, cy, r + 2, 0, TAU);
  tctx.stroke();
  tctx.restore();

  const r2 = r * r;
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx * dx + dy * dy <= r2) solid[y * W + x] = 0;
    }
  }
}

/** Which island (0 = left, 1 = right) an x position belongs to. */
const islandIndexAt = x => (x < W / 2 ? 0 : 1);

/** Counts the ground pixels of an island that are above the water. */
function islandArea(index) {
  const cx = index === 0 ? CONFIG.LEFT_ISLAND_X : CONFIG.RIGHT_ISLAND_X;
  const x0 = Math.max(0, cx - CONFIG.ISLAND_HALF_WIDTH), x1 = Math.min(W - 1, cx + CONFIG.ISLAND_HALF_WIDTH);
  let count = 0;
  for (let y = 0; y < CONFIG.WATER_Y; y++) {
    const row = y * W;
    for (let x = x0; x <= x1; x++) count += solid[row + x];
  }
  return count;
}

/** Predicted share of an island left after a crater at (x, y) with radius r. */
function islandRemainingAfter(index, x, y, r) {
  let lost = 0;
  for (let yy = Math.max(0, Math.floor(y - r)); yy <= Math.min(CONFIG.WATER_Y - 1, Math.ceil(y + r)); yy++) {
    for (let xx = Math.max(0, Math.floor(x - r)); xx <= Math.min(W - 1, Math.ceil(x + r)); xx++) {
      const dx = xx + 0.5 - x, dy = yy + 0.5 - y;
      if (dx * dx + dy * dy <= r * r) lost += solid[yy * W + xx];
    }
  }
  return (islandArea(index) - lost) / Math.max(1, islandBaseArea[index]);
}

/** Share (0..1) of an island that is still left. */
const islandRemaining = index => islandArea(index) / Math.max(1, islandBaseArea[index]);

/** Returns the y just above the first ground pixel in column x. */
function surfaceY(x) {
  for (let y = 0; y < H; y++) if (isSolid(x, y)) return y - 1;
  return H;
}

/* ======================================================================
 * 5. GAME STATE
 * ====================================================================== */
// state is one of: 'title', 'move', 'aim', 'swing', 'flight', 'settle', 'button', 'gameover'
let state = 'title';
let players = [];
let current = 0;          // index of the active player
let turnNumber = 0;       // counts turns; every 2 turns is a new round
let round = 1;
let windLevel = 0;        // -10..10 (negative = blowing left)
let wind = 0;             // horizontal acceleration applied to the puck
let moveLeft = 0;         // movement budget remaining this turn (px)
let walkAccum = 0;        // sub-pixel walking accumulator
let puck = null;
let settleTimer = 0;
let buttonEvent = null;   // { loser, how: 'puck' | 'click', t }
let result = null;        // game-over info
let gameOverTimer = 0;

let time = 0;             // total elapsed time (for animations)
let shake = 0;            // screen-shake strength
let particles = [];
let flashes = [];         // explosion fireballs
let floatTexts = [];      // "-32" damage pop-ups
let banner = null;        // big centred message, e.g. "Blue's turn"
let clouds = [];
let boss = null;          // the Seagull Striker while it is on screen
let megaStage = false;    // true once the final final boss (Mega Squirrel) has been called in
let megaOnRaft = false;   // the Mega Squirrel stands on a raft because its island was gone
let megaDelivery = null;  // the jet carrying the Mega Squirrel in
let poops = [];           // explosive poop: { x, y, vy, grounded } (falling or resting on an island)
const islandBaseArea = [0, 0];   // ground pixels above water per island at the start of a game

const keys = {};
const mouse = { x: -100, y: -100 };

// Game modes offered on the title screen
const MENU = [
  { label: '2 Players (same keyboard)', ai: false },
  { label: 'vs Computer: Easy',   ai: true, difficulty: 'easy' },
  { label: 'vs Computer: Normal', ai: true, difficulty: 'normal' },
  { label: 'vs Computer: Hard',   ai: true, difficulty: 'hard' },
  { label: '← Back to main menu', href: 'index.html' },   // returns to the game package's hub
];
let menuIndex = 0;
let gameMode = MENU[0];

// The AI's plan for the current turn
const ai = { wait: 0, dir: 1, walkLeft: 0, targetAim: 45, targetPower: 50, aimed: false };

const active = () => players[current];
const isAI = p => gameMode.ai && p.index === 1;
const displayName = p => (p.mega ? p.name : isAI(p) ? `${p.name} (AI)` : p.name);

/* ======================================================================
 * 6. GAME FLOW
 * ====================================================================== */
function createPlayer(index, x) {
  const p = {
    index,
    ...TEAMS[index],
    x: Math.round(x),
    y: 0,
    vy: 0,
    grounded: true,
    inWater: false,
    health: CONFIG.START_HEALTH,
    maxHealth: CONFIG.START_HEALTH,
    scale: 1,               // drawing size (the Mega Squirrel is bigger)
    halfW: PLAYER_HALF_W,   // hit box
    height: PLAYER_HEIGHT,
    mega: false,
    carried: false,         // true while the Mega Squirrel hangs under the jet
    defeat: null,           // null | 'health' | 'water' | 'button' | 'island'
    aim: 45,                // degrees; 0 = flat toward the opponent, 90 = straight up, 180 = flat away
    power: 60,              // percent
    facing: index === 0 ? 1 : -1,
    swingT: -1,             // swing animation clock (-1 = not swinging)
    walking: false,
    walkPhase: 0,
    hurtT: 0,
    knock: 0,               // knockback distance still to travel (px)
    knockDir: 0,            // -1 = left, 1 = right
    knocked: false,         // true until a knocked-back squirrel has come to rest (it can set off poop)
  };
  p.y = surfaceY(p.x);
  return p;
}

/** Resets everything. If startNow is false the title screen is shown. */
function newGame(startNow) {
  generateTerrain();
  players = [
    createPlayer(0, CONFIG.LEFT_ISLAND_X + rand(-40, 20)),
    createPlayer(1, CONFIG.RIGHT_ISLAND_X + rand(-20, 40)),
  ];
  current = 0;
  turnNumber = 0;
  round = 1;
  puck = null;
  particles = [];
  flashes = [];
  floatTexts = [];
  boss = null;
  poops = [];
  megaStage = false;
  megaOnRaft = false;
  megaDelivery = null;
  buttonEvent = null;
  result = null;
  randomizeWind();
  if (startNow) beginTurn();
  else state = 'title';
}

function randomizeWind() {
  windLevel = randInt(-10, 10);
  wind = (windLevel / 10) * CONFIG.WIND_MAX;
}

/** Starts the movement phase for the active player. */
function beginTurn() {
  state = 'move';
  moveLeft = CONFIG.MOVE_DISTANCE;
  walkAccum = 0;
  for (const p of players) p.swingT = -1;
  const p = active();
  // First turn of a round: also announce how long until the final boss arrives
  const firstTurnOfRound = turnNumber % 2 === 0;
  showBanner(`${displayName(p)}'s turn`, p.color, firstTurnOfRound && !megaStage ? bossCountdownText() : null);
  if (isAI(p)) aiBeginTurn(p);
}

/** Rounds left before the boss's first appearance (0 once it has arrived). */
const roundsUntilBoss = () => Math.max(0, CONFIG.BOSS_AFTER_ROUNDS + 1 - round);

function bossCountdownText() {
  const n = roundsUntilBoss();
  if (n === 0) return null;
  return n === 1 ? '1 round until the final boss appears!' : `${n} rounds until the final boss appears`;
}

/** Title-screen menu choice: start a game in that mode. */
function startMode(index) {
  menuIndex = index;
  if (MENU[index].href) {             // "Back to main menu": leave the game
    window.location.href = MENU[index].href;
    return;
  }
  gameMode = MENU[index];
  newGame(true);
}

function nextTurn() {
  current = 1 - current;
  turnNumber++;
  if (turnNumber % 2 === 0) {          // both players have shot: new round
    round++;
    randomizeWind();
    const bossRound = round - CONFIG.BOSS_AFTER_ROUNDS;   // 1 = the boss's first round
    // (Once the Mega Squirrel has arrived, the jet stops dropping poop.)
    if (!megaStage && (bossRound === 1 || (bossRound > 1 && CONFIG.BOSS_EVERY_ROUND))) {
      startBossRun(bossRound === 1);
      return;                          // beginTurn() runs when the boss has flown past
    }
  }
  beginTurn();
}

/** Movement phase -> aiming phase. */
function startAiming() {
  state = 'aim';
  updateFacingFromAim(active());
  if (isAI(active())) aiPlanShot(active());
}

/** Space pressed: begin the swing. The puck is launched mid-swing. */
function shoot() {
  state = 'swing';
  active().swingT = 0;
}

/** Waits for explosions, falling squirrels etc. before the next turn. */
function enterSettle() {
  state = 'settle';
  settleTimer = 0;
}

/** The red button was hit or clicked. The given player loses. */
function triggerButton(loser, how) {
  loser.defeat = 'button';
  buttonEvent = { loser, how, t: 0 };
  puck = null;
  state = 'button';
  shake = 14;
  for (let i = 0; i < 40; i++) {
    const a = rand(0, TAU), s = rand(80, 320);
    particles.push({ x: CONFIG.BUTTON_X, y: CONFIG.BUTTON_Y - 8, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      g: 300, life: rand(0.5, 1.1), max: 1.1, size: rand(2, 4), color: i % 2 ? '#ffe14d' : '#ff3030', glow: true });
  }
}

/** Decides the winner and shows the game-over screen. */
function showGameOver() {
  for (const p of players) if (!p.defeat && p.health <= 0) p.defeat = 'health';
  // Losing your whole island overrides everything else
  const islandless = players.filter(p => p.defeat === 'island');
  const losers = islandless.length ? islandless : players.filter(p => p.defeat);

  // The human beat the computer: here comes the final final boss
  const human = players[0];
  if (gameMode.ai && !megaStage && losers.length === 1 && losers[0] === players[1] && !human.inWater) {
    startMegaStage();
    return;
  }
  result = losers.length >= 2
    ? { winner: null, losers }
    : { winner: players.find(p => !losers.includes(p)), losers };
  state = 'gameover';
  gameOverTimer = 0;
}

function defeatMessage(p) {
  switch (p.defeat) {
    case 'button':
      if (buttonEvent && buttonEvent.how === 'click') {
        return gameMode.ai
          ? `${displayName(p)} clicked the red button!`
          : `${p.name} clicked the red button during their own turn!`;
      }
      return `${displayName(p)} hit the red button with a puck!`;
    case 'island':
      return `${displayName(p)}'s island was blown to bits by explosive bird poop!`;
    case 'water':
      return `${displayName(p)} fell into the water.`;
    default:
      return `${displayName(p)} ran out of health.`;
  }
}

/* ======================================================================
 * 7. SQUIRREL MOVEMENT AND PHYSICS
 * ====================================================================== */

/**
 * Moves a grounded squirrel one pixel left/right, following the slope.
 * Returns false if blocked by a cliff, overhang or the screen edge.
 */
function stepPlayer(p, dir) {
  const nx = p.x + dir;
  if (nx < 4 || nx > W - 4) return false;

  // Climb: how far up do we need to go for our feet to be free?
  let climb = 0;
  while (isSolid(nx, p.y - climb) && climb <= CONFIG.MAX_STEP_UP) climb++;
  if (climb > CONFIG.MAX_STEP_UP) return false;          // too steep
  const ny = p.y - climb;
  if (isSolid(nx, ny - p.height + 6)) return false;     // head would hit ground

  p.x = nx;
  p.y = ny;

  // Walking downhill: snap down to the ground if it's close, else start falling
  if (!isSolid(p.x, p.y + 1)) {
    let drop = 1;
    while (drop <= CONFIG.MAX_STEP_DOWN && !isSolid(p.x, p.y + 1 + drop)) drop++;
    if (drop <= CONFIG.MAX_STEP_DOWN) p.y += drop;
    else { p.grounded = false; p.vy = 0; }
  }
  return true;
}

/** Gravity for squirrels: falling when the ground disappears, drowning in water. */
function updatePlayerPhysics(p, dt) {
  if (p.carried) return;                         // hanging under the jet
  if (p.knock > 0 && !p.inWater) updateKnockback(p, dt);
  checkKnockbackPoop(p);
  if (p.knocked && p.knock === 0 && p.grounded) p.knocked = false;   // came to rest
  if (p.grounded && !isSolid(p.x, p.y + 1)) {
    p.grounded = false;
    p.vy = 0;
  }
  if (p.grounded) return;

  p.vy = Math.min(p.vy + CONFIG.PLAYER_GRAVITY * dt, p.inWater ? 60 : 900);
  if (p.vy < 0) {                                // rising (knockback hop)
    if (isSolid(p.x, p.y - p.height + p.vy * dt)) p.vy = 0;   // bumped its head
    else p.y += p.vy * dt;
    return;
  }
  let dist = p.vy * dt;
  while (dist > 0) {
    const s = Math.min(1, dist);
    if (!p.inWater && isSolid(p.x, Math.floor(p.y) + 1)) {   // landed
      p.y = Math.floor(p.y);
      p.grounded = true;
      if (p.mega && p.vy > 300) megaLandingThud(p);
      p.vy = 0;
      return;
    }
    p.y += s;
    dist -= s;
  }

  // Into the water: instant loss
  if (!p.inWater && p.y > CONFIG.WATER_Y + 4) {
    p.inWater = true;
    if (!p.defeat) p.defeat = 'water';
    spawnSplash(p.x, CONFIG.WATER_Y, 30);
    showBanner('SPLASH!', '#ffffff');
  }
}

/**
 * Pushes a squirrel away from an explosion: from KNOCKBACK_MIN squirrel lengths at the
 * edge of the blast up to KNOCKBACK_MAX for a direct hit (the Mega Squirrel, being
 * bigger, moves half as far). It hops a little and can be knocked off a ledge.
 */
function applyKnockback(p, blastX, closeness, big = false) {
  const min = big ? CONFIG.POOP_KNOCKBACK_MIN : CONFIG.KNOCKBACK_MIN;
  const max = big ? CONFIG.POOP_KNOCKBACK_MAX : CONFIG.KNOCKBACK_MAX;
  const squirrels = lerp(min, max, clamp(closeness, 0, 1));
  p.knock = Math.round(squirrels * CONFIG.SQUIRREL_LENGTH / p.scale);
  const dx = p.x - blastX;
  p.knockDir = Math.abs(dx) >= 1 ? Math.sign(dx) : -p.facing;   // dead-centre hit: pushed backwards
  p.grounded = false;
  p.knocked = true;
  const hop = big ? 260 + 200 * closeness : 120 + 120 * closeness;
  p.vy = -hop / Math.sqrt(p.scale);                            // hop (a big one for poop blasts)
}

/** A knocked-back squirrel that bumps into explosive poop sets it off. */
function checkKnockbackPoop(p) {
  if (!p.knocked || p.inWater) return;
  const pp = poops.find(o => o.grounded && distanceToBody(p, o.x, o.y - 6) < CONFIG.POOP_RADIUS);
  if (!pp) return;
  floatTexts.push({ x: pp.x, y: pp.y - 40, text: 'BUMP!', color: '#ffffff', life: 1.0 });
  poopExplosion(pp);
}

/** Moves a knocked-back squirrel sideways, climbing small bumps and stopping at walls. */
function updateKnockback(p, dt) {
  p.knockAcc = (p.knockAcc || 0) + CONFIG.KNOCKBACK_SPEED * dt;
  while (p.knockAcc >= 1 && p.knock > 0) {
    p.knockAcc -= 1;
    const nx = p.x + p.knockDir;
    let climb = 0;
    while (isSolid(nx, p.y - climb) && climb <= CONFIG.MAX_STEP_UP + 2) climb++;
    if (nx < 4 || nx > W - 4 || climb > CONFIG.MAX_STEP_UP + 2 || isSolid(nx, p.y - climb - p.height + 6)) {
      p.knock = 0;                                 // hit a wall or the screen edge
      break;
    }
    p.x = nx;
    p.y -= climb;
    p.knock--;
  }
  if (p.knock <= 0) p.knockAcc = 0;
}

/** Movement phase: walk with Left/Right while there is movement left. */
function updateMovePhase(dt) {
  const p = active();
  p.walking = false;
  if (!p.grounded || p.defeat) return;

  const dir = isAI(p)
    ? aiMoveDirection(p, dt)
    : (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  if (dir === 0 || moveLeft <= 0) { walkAccum = 0; return; }

  p.facing = dir;
  p.walking = true;
  p.walkPhase += dt * 14;
  walkAccum += CONFIG.WALK_SPEED * dt;
  while (walkAccum >= 1 && moveLeft > 0) {
    walkAccum -= 1;
    if (isAI(p)) {                     // the AI never walks off a ledge
      if (ai.walkLeft <= 0 || !safeToStep(p, dir)) { ai.walkLeft = 0; break; }
      ai.walkLeft--;
    }
    if (!stepPlayer(p, dir)) { walkAccum = 0; p.walking = false; break; }
    moveLeft -= 1;
    if (!p.grounded) break;           // walked off a ledge
  }
}

/* ======================================================================
 * 8. AIMING, SHOOTING AND THE PUCK
 * ====================================================================== */

/** Unit vector of an aim angle (measured toward the opponent); defaults to the player's aim. */
function aimVector(p, aim = p.aim) {
  const opp = players[1 - p.index];
  const toward = Math.sign(opp.x - p.x) || (p.index === 0 ? 1 : -1);
  const a = aim * Math.PI / 180;
  return { x: Math.cos(a) * toward, y: -Math.sin(a) };
}

function updateFacingFromAim(p) {
  const d = aimVector(p);
  if (Math.abs(d.x) > 0.02) p.facing = Math.sign(d.x);
}

function updateAimPhase(dt) {
  const p = active();
  if (isAI(p)) { aiAim(p, dt); return; }
  const angleDir = (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0);
  const powerDir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  p.aim = clamp(p.aim + angleDir * CONFIG.AIM_SPEED * dt, 0, 180);
  p.power = clamp(p.power + powerDir * CONFIG.POWER_SPEED * dt, 5, 100);
  updateFacingFromAim(p);
}

/** Swing phase: release the puck at the moment of impact. */
function updateSwingPhase() {
  const p = active();
  if (p.swingT >= SWING_IMPACT) launchPuck(p);
}

// The puck moves in fixed time steps (max ~2 px each) so it never tunnels
// through anything, and so the AI's predictions match real shots exactly.
const PUCK_STEP = 1 / 480;

/** Start position and velocity of a puck shot with the given aim and power. */
function launchState(p, aim, power) {
  const d = aimVector(p, aim);
  const speed = CONFIG.MAX_SHOT_SPEED * power / 100;
  const k = p.scale;
  return { x: p.x + d.x * 20 * k, y: p.y - 18 * k + d.y * 20 * k, vx: d.x * speed, vy: d.y * speed, age: 0 };
}

/** Advances a puck (or a simulated one) by one fixed step. */
function stepPuckPhysics(b, windAccel) {
  b.vx += windAccel * PUCK_STEP;
  b.vy += CONFIG.GRAVITY * PUCK_STEP;
  b.x += b.vx * PUCK_STEP;
  b.y += b.vy * PUCK_STEP;
  b.age += PUCK_STEP;
}

function launchPuck(p) {
  const s = launchState(p, p.aim, p.power);
  const d = aimVector(p);
  puck = {
    ...s,
    rot: 0,
    spin: (d.x >= 0 ? 1 : -1) * (6 + Math.hypot(s.vx, s.vy) / 60),
    owner: p,
    timeAcc: 0,
    trail: [],
  };
  state = 'flight';
  // A few sparks off the stick
  for (let i = 0; i < 8; i++) {
    particles.push({ x: puck.x, y: puck.y, vx: rand(-80, 80) + d.x * 60, vy: rand(-80, 40), g: 200,
      life: rand(0.2, 0.4), max: 0.4, size: 2, color: '#ffffff', glow: false });
  }
}

/** Moves the puck through this frame's fixed steps, stopping at the first hit. */
function updatePuck(dt) {
  if (!puck) return;
  puck.timeAcc += dt;
  while (puck.timeAcc >= PUCK_STEP) {
    puck.timeAcc -= PUCK_STEP;
    stepPuckPhysics(puck, wind);
    const hit = puckHitTest(puck.x, puck.y, puck.owner, puck.age);
    if (hit) { resolvePuckHit(hit); return; }
  }
  puck.rot += puck.spin * dt;
  puck.trail.push({ x: puck.x, y: puck.y });
  if (puck.trail.length > 14) puck.trail.shift();
}

/** Geometry of the red button (housing + dome) and its post. */
const BUTTON = {
  housingX0: CONFIG.BUTTON_X - 26,
  housingX1: CONFIG.BUTTON_X + 26,
  housingY0: CONFIG.BUTTON_Y,
  housingY1: CONFIG.BUTTON_Y + 16,
  postX0: CONFIG.BUTTON_X - 6,
  postX1: CONFIG.BUTTON_X + 6,
};

/** True if a circle of radius r at (x, y) touches the button itself. */
function touchesButton(x, y, r) {
  const dx = x - CONFIG.BUTTON_X, dy = y - CONFIG.BUTTON_Y;
  const onDome = dy <= 2 && Math.hypot(dx, dy) < CONFIG.BUTTON_RADIUS + r;
  const onHousing = x > BUTTON.housingX0 - r && x < BUTTON.housingX1 + r
                 && y > BUTTON.housingY0 - r && y < BUTTON.housingY1 + r;
  return onDome || onHousing;
}

/**
 * What would a puck at (x, y) hit? Has no side effects, so the AI can use it too.
 * Returns 'button' | 'post' | 'player' | 'terrain' | 'water' | 'out' | null.
 */
function puckHitTest(x, y, owner, age) {
  // The red button itself (a direct hit means the shooter loses)
  if (touchesButton(x, y, PUCK_RADIUS)) return 'button';
  // Explosive bird poop (only poop resting on an island counts)
  if (poopAt(x, y)) return 'poop';
  // The button's post: an ordinary obstacle
  if (x > BUTTON.postX0 - PUCK_RADIUS && x < BUTTON.postX1 + PUCK_RADIUS && y > BUTTON.housingY1) return 'post';
  // Squirrels (the shooter is ignored for a moment so the puck can leave the stick)
  for (const p of players) {
    if (p.inWater) continue;
    if (p === owner && age < 0.2) continue;
    if (p.carried) continue;
    if (x > p.x - p.halfW - PUCK_RADIUS && x < p.x + p.halfW + PUCK_RADIUS &&
        y > p.y - p.height - PUCK_RADIUS && y < p.y + PUCK_RADIUS) return 'player';
  }
  if (isSolid(x, y) || isSolid(x + 4, y) || isSolid(x - 4, y) || isSolid(x, y + 4) || isSolid(x, y - 4)) return 'terrain';
  if (y >= CONFIG.WATER_Y) return 'water';
  if (x < -400 || x > W + 400) return 'out';
  return null;
}

/** Ends the real puck's flight according to what it hit. */
function resolvePuckHit(hit) {
  const { x, y, owner } = puck;
  switch (hit) {
    case 'button':
      triggerButton(owner, 'puck');
      break;
    case 'water':                       // harmless splash
      spawnSplash(x, CONFIG.WATER_Y, 22);
      floatTexts.push({ x, y: CONFIG.WATER_Y - 30, text: 'Splash!', color: '#ffffff', life: 1.2 });
      puck = null;
      enterSettle();
      break;
    case 'out':                         // flew far off the side of the screen
      puck = null;
      enterSettle();
      break;
    case 'poop':                        // giant explosion
      poopExplosion(poopAt(x, y));
      break;
    default:                            // post, player or terrain
      explode(x, y, owner);
  }
}

/** Distance from (x, y) to the closest point of a squirrel's body. */
function distanceToBody(p, x, y) {
  const cx = clamp(x, p.x - p.halfW, p.x + p.halfW);
  const cy = clamp(y, p.y - p.height, p.y);
  return Math.hypot(x - cx, y - cy);
}

/** Explosion: crater, distance-based damage, effects. The Mega Squirrel's pucks are stronger. */
function explode(x, y, shooter = null) {
  const mega = shooter && shooter.mega;
  const damageMult = mega ? CONFIG.MEGA_DAMAGE_MULT : 1;
  puck = null;
  carveCrater(x, y, CONFIG.CRATER_RADIUS * (mega ? CONFIG.MEGA_CRATER_MULT : 1));

  for (const p of players) {
    if (p.inWater) continue;
    const d = distanceToBody(p, x, y);
    if (d >= CONFIG.DAMAGE_RADIUS) continue;
    const dmg = Math.round(CONFIG.MAX_DAMAGE * damageMult * (1 - d / CONFIG.DAMAGE_RADIUS));
    if (dmg <= 0) continue;
    p.health = Math.max(0, p.health - dmg);
    p.hurtT = 0.7;
    applyKnockback(p, x, 1 - d / CONFIG.DAMAGE_RADIUS);
    floatTexts.push({ x: p.x, y: p.y - p.height - 17, text: `-${dmg}`, color: p.color, life: 1.4 });
  }

  spawnExplosion(x, y);
  shake = 10;
  enterSettle();
}

/* ======================================================================
 * 8b. AI OPPONENT
 *    Moves a little, then tries every angle/power combination with the
 *    real puck physics, keeps the shot that lands nearest the opponent
 *    (never one that hits the red button or lands next to itself),
 *    adds mistakes based on difficulty, and turns its aim toward it.
 * ====================================================================== */

/** Roughly normally distributed random number (mean 0, std dev ~1). */
function gaussian() {
  return (Math.random() + Math.random() + Math.random() - 1.5) * 2;
}

/** Moves a value toward a target by at most maxStep. */
function approach(value, target, maxStep) {
  return Math.abs(target - value) <= maxStep ? target : value + Math.sign(target - value) * maxStep;
}

/** True if walking a few pixels in this direction keeps the squirrel safely on the ground. */
function safeToStep(p, dir) {
  const probe = { x: p.x, y: p.y, grounded: true, vy: 0, height: p.height };
  for (let i = 0; i < 14; i++) {          // look a little ahead for ledges
    if (!stepPlayer(probe, dir) || !probe.grounded) return false;
  }
  return probe.y < CONFIG.WATER_Y - 20;
}

function aiBeginTurn(p) {
  const level = AI_LEVELS[gameMode.difficulty];
  ai.wait = 0.7;
  ai.dir = Math.random() < 0.5 ? -1 : 1;
  if (!safeToStep(p, ai.dir)) ai.dir = -ai.dir;
  ai.walkLeft = p.mega ? 0 : randInt(0, level.maxWalk);   // the Mega Squirrel is too big to walk
}

/** Movement phase for the AI: returns the direction to walk (0 = standing still). */
function aiMoveDirection(p, dt) {
  if (ai.wait > 0) { ai.wait -= dt; return 0; }
  if (ai.walkLeft > 0 && moveLeft > 0 && safeToStep(p, ai.dir)) return ai.dir;
  startAiming();
  return 0;
}

/** Predicts where a shot lands. Returns { type, x, y } like puckHitTest. */
function simulateShot(p, aim, power, windAccel) {
  const b = launchState(p, aim, power);
  for (let i = 0; i < 8 / PUCK_STEP; i++) {
    stepPuckPhysics(b, windAccel);
    const hit = puckHitTest(b.x, b.y, p, b.age);
    if (hit) return { type: hit, x: b.x, y: b.y };
  }
  return { type: 'out', x: b.x, y: b.y };
}

/** Chooses the AI's target angle and power for this turn. */
function aiPlanShot(p) {
  const level = AI_LEVELS[gameMode.difficulty];
  const opp = players[1 - p.index];
  const believedWind = wind * level.windAwareness;
  const candidates = [];             // every useful shot, scored (lower = better)
  let best = null;                   // (kept so each candidate check below stays simple)

  for (let aim = 8; aim <= 86; aim += 2) {
    for (let power = 16; power <= 100; power += 2) {
      const r = simulateShot(p, aim, power, believedWind);
      if (r.type === 'button') continue;                                       // never on purpose!
      if (r.type === 'poop') {
        // Poop explosions are huge. Wiping out the opponent's island wins;
        // wiping out (or nearly wiping out) its own island is never worth it.
        const poop = poopAt(r.x, r.y);
        const island = islandIndexAt(poop.x);
        const left = islandRemainingAfter(island, poop.x, poop.y - 6, CONFIG.POOP_CRATER_RADIUS);
        if (distanceToBody(p, poop.x, poop.y) < CONFIG.POOP_DAMAGE_RADIUS + 20) continue;
        if (island === p.index && left < CONFIG.ISLAND_GONE_FRACTION + 0.2) continue;
        const score = island === opp.index && left < CONFIG.ISLAND_GONE_FRACTION
          ? -1000                                        // winning shot
          : distanceToBody(opp, poop.x, poop.y) - 60;
        candidates.push({ aim, power, score });
        continue;
      }
      if (distanceToBody(p, r.x, r.y) < CONFIG.DAMAGE_RADIUS + 10) continue;   // don't blow itself up
      let score = distanceToBody(opp, r.x, r.y);
      if (r.type === 'water' || r.type === 'out' || r.type === 'post') score += 300;   // harmless shots
      candidates.push({ aim, power, score });
    }
  }

  // Take the best shot that stays clear of the red button even if the AI's
  // aim or its guess of the wind is a bit off (the button sits high, so many
  // good shots skim just over it).
  candidates.sort((a, b) => a.score - b.score);
  const aimMargin = Math.max(1.5, level.angleError * 1.5);
  const powerMargin = Math.max(1.5, level.powerError * 1.5);
  const windDoubt = CONFIG.WIND_MAX * 0.6 * (1 - level.windAwareness) + 10;
  // Checks a grid of possible mistakes (aim x power x wind), since the button
  // can sit between two outcomes that both miss it.
  const safeFromButton = c => {
    for (const fw of [-1, -2 / 3, -1 / 3, 0, 1 / 3, 2 / 3, 1]) {
      for (const fa of [-1, -0.5, 0, 0.5, 1]) {
        for (const fp of [-1, 0, 1]) {
          const r = simulateShot(p, c.aim + fa * aimMargin, c.power + fp * powerMargin, believedWind + fw * windDoubt);
          if (r.type === 'button') return false;
        }
      }
    }
    return true;
  };
  best = candidates.slice(0, 300).find(safeFromButton) || candidates[0] || { aim: 60, power: 70 };

  // Mistakes are capped at the safety margin above, so they never reach the button
  ai.targetAim = clamp(best.aim + clamp(gaussian(), -1.5, 1.5) * level.angleError, 0, 180);
  ai.targetPower = clamp(best.power + clamp(gaussian(), -1.5, 1.5) * level.powerError, 5, 100);
  ai.wait = level.thinkTime;
  ai.aimed = false;
}

/** Aiming phase for the AI: turn the aim toward the target, pause, shoot. */
function aiAim(p, dt) {
  if (ai.wait > 0) { ai.wait -= dt; return; }
  if (ai.aimed) { shoot(); return; }
  p.aim = approach(p.aim, ai.targetAim, CONFIG.AIM_SPEED * dt);
  p.power = approach(p.power, ai.targetPower, CONFIG.POWER_SPEED * dt);
  updateFacingFromAim(p);
  if (p.aim === ai.targetAim && p.power === ai.targetPower) {
    ai.aimed = true;
    ai.wait = 0.35;                       // short pause before the slap
  }
}

/* ======================================================================
 * 8c. FINAL BOSS: THE SEAGULL STRIKER
 *    A seagull built like a jet fighter. From round BOSS_AFTER_ROUNDS + 1
 *    it flies across the screen at the start of each round and drops one
 *    blob of explosive poop on each island. A puck that hits a poop sets off
 *    a giant explosion. A player whose island is wiped out loses.
 * ====================================================================== */

/** Picks a spot on an island's surface for a poop (not right on top of a squirrel). */
function pickPoopSpot(islandIndex) {
  const cx = islandIndex === 0 ? CONFIG.LEFT_ISLAND_X : CONFIG.RIGHT_ISLAND_X;
  const hw = CONFIG.ISLAND_HALF_WIDTH;
  for (let tries = 0; tries < 40; tries++) {
    const x = Math.round(cx + rand(-hw + 40, hw - 40));
    if (surfaceY(x) >= CONFIG.WATER_Y - 12) continue;                          // no ground there
    if (players.some(p => !p.inWater && Math.abs(p.x - x) < 45)) continue;    // too close to a squirrel
    if (poops.some(pp => Math.abs(pp.x - x) < 30)) continue;                  // already pooped on
    return x;
  }
  return null;                                                                // island is (nearly) gone
}

/** Starts a bombing run. Normal turns continue once the boss has flown past. */
function startBossRun(firstTime) {
  state = 'boss';
  const dir = Math.random() < 0.5 ? 1 : -1;
  boss = { x: dir > 0 ? -400 : W + 400, y: 150, dir, t: 0, targets: [] };
  for (const i of [0, 1]) {
    const x = pickPoopSpot(i);
    if (x !== null) boss.targets.push({ x, dropped: false });
  }
  if (firstTime) {
    showBanner('FINAL BOSS: THE SEAGULL STRIKER!', '#ffffff',
      'It bombs both islands with explosive poop. Hit the poop with a puck for a giant blast!');
  } else {
    showBanner('The Seagull Striker is back!', '#ffffff', 'More explosive poop incoming!');
  }
}

function updateBoss(dt) {
  boss.t += dt;
  boss.x += boss.dir * CONFIG.BOSS_SPEED * dt;

  // Drop the poop when flying over each target spot
  for (const tg of boss.targets) {
    if (!tg.dropped && (boss.dir > 0 ? boss.x >= tg.x : boss.x <= tg.x)) {
      tg.dropped = true;
      poops.push({ x: tg.x, y: boss.y + 18, vy: 60, grounded: false, fresh: true });
    }
  }

  // Jet contrail
  if (boss.x > -100 && boss.x < W + 100) {
    particles.push({ x: boss.x - boss.dir * 75, y: boss.y + rand(-3, 3), vx: -boss.dir * 40, vy: 0, g: 0,
      life: 0.6, max: 0.6, size: rand(4, 7), color: '#ffffff', smoke: true });
  }

  // Gone and all poop has landed: back to the game
  const offscreen = boss.dir > 0 ? boss.x > W + 200 : boss.x < -200;
  if (offscreen && poops.every(pp => pp.grounded)) {
    boss = null;
    beginTurn();
  }
}

/** Poop falls like everything else: when dropped, and when the ground under it is blown away. */
function updatePoops(dt) {
  for (const pp of poops) {
    if (pp.grounded) {
      if (isSolid(pp.x, pp.y + 1)) continue;
      pp.grounded = false;
      pp.vy = 0;
    }
    pp.vy = Math.min(pp.vy + 700 * dt, 700);
    let dist = pp.vy * dt;
    while (dist > 0) {
      const s = Math.min(1, dist);
      if (isSolid(pp.x, Math.floor(pp.y) + 1)) {          // landed
        pp.y = Math.floor(pp.y);
        pp.grounded = true;
        if (pp.fresh) {
          pp.fresh = false;
          floatTexts.push({ x: pp.x, y: pp.y - 30, text: 'SPLAT!', color: '#f4f2e6', life: 1.0 });
          for (let i = 0; i < 10; i++) {
            particles.push({ x: pp.x, y: pp.y - 3, vx: rand(-90, 90), vy: rand(-160, -40), g: 600,
              life: rand(0.3, 0.6), max: 0.6, size: rand(1.5, 3), color: '#f4f2e6' });
          }
        }
        break;
      }
      pp.y += s;
      dist -= s;
    }
    if (!pp.grounded && pp.y > CONFIG.WATER_Y) {          // fizzles out in the sea
      pp.gone = true;
      spawnSplash(pp.x, CONFIG.WATER_Y, 10);
    }
  }
  poops = poops.filter(pp => !pp.gone);
}

/** The poop (resting on the ground) touched by a puck at (x, y), or null. */
function poopAt(x, y) {
  return poops.find(pp => pp.grounded && Math.hypot(x - pp.x, y - (pp.y - 6)) < CONFIG.POOP_RADIUS + PUCK_RADIUS) || null;
}

/** A puck hit a poop: giant explosion, giant hole. The owner of a wiped-out island loses. */
function poopExplosion(pp) {
  puck = null;
  poops = poops.filter(o => o !== pp);
  const x = pp.x, y = pp.y - 6;
  const island = islandIndexAt(x);
  carveCrater(x, y, CONFIG.POOP_CRATER_RADIUS);

  for (const p of players) {
    if (p.inWater) continue;
    const d = distanceToBody(p, x, y);
    if (d >= CONFIG.POOP_DAMAGE_RADIUS) continue;
    const dmg = Math.round(CONFIG.POOP_MAX_DAMAGE * (1 - d / CONFIG.POOP_DAMAGE_RADIUS));
    if (dmg <= 0) continue;
    p.health = Math.max(0, p.health - dmg);
    p.hurtT = 0.9;
    applyKnockback(p, x, 1 - d / CONFIG.POOP_DAMAGE_RADIUS, true);
    floatTexts.push({ x: p.x, y: p.y - 55, text: `-${dmg}`, color: p.color, life: 1.6 });
  }

  for (let i = 0; i < 3; i++) spawnExplosion(x + rand(-35, 35), y + rand(-30, 20));
  flashes.push({ x, y, t: 0, scale: 2.6 });
  floatTexts.push({ x, y: y - 70, text: 'KA-BOOM!', color: '#ffd23b', life: 1.6 });
  shake = 24;

  // Island 0 belongs to Red (player 0), island 1 to Blue (player 1)
  if (islandRemaining(island) < CONFIG.ISLAND_GONE_FRACTION && !(players[island].mega && megaOnRaft)) {
    players[island].defeat = 'island';
    showBanner(`${players[island].name}'s island is destroyed!`, '#ff5a3a');
  }
  enterSettle();
}

/** The Seagull Striker: a seagull shaped like a jet fighter (drawn facing right, mirrored when flying left). */
function drawBoss() {
  if (!boss) return;
  const poly = (pts, fill, stroke) => {
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
  };

  ctx.save();
  ctx.translate(boss.x, boss.y + Math.sin(boss.t * 6) * 3);
  ctx.scale(boss.dir, 1);

  // Afterburner flame
  const flame = 24 + Math.random() * 16;
  poly([[-60, -7], [-60 - flame, 0], [-60, 7]], '#ff7a1f');
  poly([[-60, -4], [-60 - flame * 0.6, 0], [-60, 4]], '#ffe14d');

  // Far wing, tail fin
  poly([[-4, -3], [-36, -26], [-50, -26], [-30, -3]], '#b8c0c8', '#8d969f');
  poly([[-40, -6], [-60, -34], [-49, -34], [-28, -6]], '#d3d9df', '#8d969f');
  poly([[-56, -29], [-60, -34], [-49, -34], [-47, -29]], '#222');            // black seagull tip

  // Fuselage (the gull's body) with a grey back
  ctx.fillStyle = '#f5f6f7';
  ctx.strokeStyle = '#8d969f';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(0, 0, 62, 12, 0, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#c4ccd4';
  ctx.beginPath();
  ctx.ellipse(-10, -6, 44, 4.5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#4a4f55';
  ctx.fillRect(-63, -5, 6, 10);                                               // jet nozzle

  // Cockpit canopy
  ctx.fillStyle = 'rgba(110,185,240,0.95)';
  ctx.beginPath();
  ctx.ellipse(20, -9, 13, 5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillRect(16, -12, 6, 1.5);

  // Bomb pods (full of poop) under the body
  ctx.fillStyle = '#e8e6d8';
  ctx.beginPath();
  ctx.ellipse(-6, 13, 9, 3.5, 0, 0, TAU);
  ctx.ellipse(-26, 12, 8, 3, 0, 0, TAU);
  ctx.fill();

  // Near wing: swept delta with black seagull wing tips
  poly([[14, 2], [-26, 34], [-48, 34], [-22, 3]], '#e3e7eb', '#8d969f');
  poly([[-30, 28], [-26, 34], [-48, 34], [-44, 28]], '#222');
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-38, 31.5, 1.6, 0, TAU);
  ctx.fill();

  // Seagull head on the nose: angry eye and a yellow beak with the red spot
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#8d969f';
  ctx.beginPath();
  ctx.arc(56, -3, 12, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff6c8';
  ctx.beginPath();
  ctx.arc(60, -6, 3.4, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(61, -6, 1.7, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(54, -13);
  ctx.lineTo(66, -8);
  ctx.stroke();
  poly([[65, -4], [93, 1], [65, 6]], '#f2c200', '#b38f00');
  ctx.fillStyle = '#e0321c';
  ctx.beginPath();
  ctx.arc(84, 2.5, 2.2, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/** Explosive bird poop: falling drops and splats on the ground. */
function drawPoops() {
  for (const pp of poops) {
    ctx.save();
    ctx.translate(pp.x, pp.y);
    if (!pp.grounded && pp.fresh) {
      // Falling drop
      ctx.fillStyle = '#f7f6ec';
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.quadraticCurveTo(7, -6, 0, -2);
      ctx.quadraticCurveTo(-7, -6, 0, -20);
      ctx.fill();
    } else {
      // Splat with a sizzling spark (it's explosive!)
      ctx.fillStyle = '#f4f2e6';
      ctx.strokeStyle = '#b9b7a0';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(0, -3, 16, 5, 0, 0, TAU);
      ctx.arc(-6, -7, 5.5, 0, TAU);
      ctx.arc(5, -8, 6.5, 0, TAU);
      ctx.arc(0, -13, 5, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#9bb36a';
      ctx.beginPath();
      ctx.arc(-4, -6, 1.6, 0, TAU);
      ctx.arc(6, -9, 1.4, 0, TAU);
      ctx.arc(2, -3, 1.2, 0, TAU);
      ctx.fill();
      const flicker = 2 + Math.random() * 2.5;
      ctx.fillStyle = Math.floor(time * 8 + pp.x) % 2 ? '#ffd23b' : '#ff5a1f';
      ctx.beginPath();
      ctx.arc(0, -18, flicker, 0, TAU);
      ctx.fill();

/** Small HUD line under the wind: boss countdown or boss warning. */
function drawBossStatus(cx, cy) {
  const n = roundsUntilBoss();
  panel(cx - 120, cy - 13, 240, 26);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 13px system-ui, sans-serif';

    ctx.fillStyle = '#d6a8ff';
