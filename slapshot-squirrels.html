/* ======================================================================
 * 8d. FINAL FINAL BOSS: THE MEGA SQUIRREL
 *    vs Computer only. When the human beats the AI, the Seagull Striker
 *    flies in carrying a giant squirrel and drops it onto the AI's island,
 *    or onto a raft if the island is (nearly) gone. From then on the jet
 *    drops no more poop. The Mega Squirrel has more health, hits harder and
 *    is too big to walk. It aims like the AI at the chosen difficulty.
 * ====================================================================== */

/** A spot on the AI's island with room for the Mega Squirrel, or null if there is none. */
function findMegaSpot() {
  if (islandRemaining(1) < 0.15) return null;
  const cx = CONFIG.RIGHT_ISLAND_X;
  const megaHeight = PLAYER_HEIGHT * CONFIG.MEGA_SCALE;
  for (let off = 0; off <= CONFIG.ISLAND_HALF_WIDTH - 40; off += 4) {
    for (const x of [cx + off, cx - off]) {
      const y = surfaceY(x);
      if (y >= CONFIG.WATER_Y - 20) continue;                                  // no ground here
      if (isSolid(x, y - megaHeight)) continue;                                // no head room
      if (surfaceY(x - 15) >= CONFIG.WATER_Y - 10 || surfaceY(x + 15) >= CONFIG.WATER_Y - 10) continue;  // too narrow
      return x;
    }
  }
  return null;
}

/** Builds a wooden raft (as terrain, so it can be blown up) floating at x. */
function buildRaft(cx) {
  const hw = CONFIG.MEGA_RAFT_HALF_WIDTH;
  const top = CONFIG.WATER_Y - 10, bottom = CONFIG.WATER_Y + 8;
  for (let x = cx - hw, i = 0; x < cx + hw; x += 12, i++) {
    tctx.fillStyle = i % 2 ? '#9a6a3a' : '#87582c';
    tctx.fillRect(x, top, 11, bottom - top);
  }
  tctx.fillStyle = '#5c3a1c';                       // cross beams
  tctx.fillRect(cx - hw, top + 2, hw * 2, 3);
  tctx.fillRect(cx - hw, bottom - 7, hw * 2, 3);
  for (let y = top; y < bottom; y++) {
    for (let x = cx - hw; x < cx + hw; x++) solid[y * W + x] = 1;
  }
}

/** The human beat the AI: the jet brings in the Mega Squirrel. */
function startMegaStage() {
  megaStage = true;
  buttonEvent = null;
  puck = null;

  let dropX = findMegaSpot();
  megaOnRaft = dropX === null;
  if (megaOnRaft) {
    dropX = CONFIG.RIGHT_ISLAND_X;
    buildRaft(dropX);
  }

  // Replace the defeated AI with the boss
  const k = CONFIG.MEGA_SCALE;
  const mega = createPlayer(1, dropX);
  Object.assign(mega, {
    name: 'Mega Squirrel', color: '#8e44ec', dark: '#4b1d8f', light: '#d6a8ff', helmet: '#f2c200',
    mega: true, scale: k, halfW: PLAYER_HALF_W * k, height: PLAYER_HEIGHT * k,
    health: CONFIG.MEGA_HEALTH, maxHealth: CONFIG.MEGA_HEALTH,
    carried: true, grounded: false, facing: -1,
  });
  players[1] = mega;

  if (CONFIG.HEAL_FOR_MEGA) players[0].health = players[0].maxHealth;

  // The Seagull Striker carries it in (no poop this time)
  const dir = Math.random() < 0.5 ? 1 : -1;
  boss = { x: dir > 0 ? -400 : W + 400, y: 140, dir, t: 0, targets: [] };
  megaDelivery = { dropX, dropped: false };
  state = 'mega';
  showBanner('FINAL FINAL BOSS!', '#d6a8ff',
    `The Seagull Striker drops in the MEGA SQUIRREL${megaOnRaft ? ' (on a raft!)' : ''}!` +
    (CONFIG.HEAL_FOR_MEGA ? ' Your health is restored.' : ''));
}

function updateMegaDelivery(dt) {
  const m = players[1];
  boss.t += dt;
  boss.x += boss.dir * CONFIG.BOSS_SPEED * 0.8 * dt;

  if (!megaDelivery.dropped) {
    m.x = Math.round(boss.x);
    m.y = boss.y + 70;
    if (boss.dir > 0 ? boss.x >= megaDelivery.dropX : boss.x <= megaDelivery.dropX) {
      megaDelivery.dropped = true;
      m.carried = false;
      m.x = megaDelivery.dropX;
      m.grounded = false;
      m.vy = 0;
    }
  }

  if (boss.x > -100 && boss.x < W + 100) {         // contrail
    particles.push({ x: boss.x - boss.dir * 75, y: boss.y + rand(-3, 3), vx: -boss.dir * 40, vy: 0, g: 0,
      life: 0.6, max: 0.6, size: rand(4, 7), color: '#ffffff', smoke: true });
  }

  // Jet gone and the boss has landed: the fight starts, human first
  const offscreen = boss.dir > 0 ? boss.x > W + 200 : boss.x < -200;
  if (offscreen && megaDelivery.dropped && (m.grounded || m.inWater)) {
    boss = null;
    megaDelivery = null;
    if (turnNumber % 2 === 1) turnNumber++;           // keep "player 0 on even turns"
    round++;
    randomizeWind();
    current = 0;
    beginTurn();
  }
}

/** Big landing: screen shake and a cloud of dust. */
function megaLandingThud(p) {
  shake = 18;
  floatTexts.push({ x: p.x, y: p.y - p.height - 30, text: 'THUD!', color: '#d6a8ff', life: 1.4 });
  for (let i = 0; i < 24; i++) {
    particles.push({ x: p.x + rand(-30, 30), y: p.y - 2, vx: rand(-160, 160), vy: rand(-120, -20), g: 200,
      life: rand(0.5, 1.0), max: 1.0, size: rand(6, 12), color: '#b9a58a', smoke: true });
  }
}

/** The Mega Squirrel hanging under the jet on a cable. */
function drawMegaDelivery() {
  if (!megaDelivery || megaDelivery.dropped || !boss) return;
  const m = players[1];
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(boss.x, boss.y + 12);
  ctx.lineTo(m.x, m.y - m.height + 4);
  ctx.stroke();
  drawSquirrel(m);
}

/* ======================================================================
 * 9. PARTICLES AND EFFECTS
 * ====================================================================== */
function spawnExplosion(x, y) {
  flashes.push({ x, y, t: 0 });
  for (let i = 0; i < 28; i++) {                  // dirt debris
    const a = rand(Math.PI * 1.05, Math.PI * 1.95), s = rand(120, 380);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 750,
      life: rand(0.7, 1.3), max: 1.3, size: rand(2, 4.5), color: Math.random() < 0.5 ? '#6c4325' : '#8b5a33', glow: false });
  }
  for (let i = 0; i < 16; i++) {                  // fire
    const a = rand(0, TAU), s = rand(30, 160);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: -60,
      life: rand(0.25, 0.6), max: 0.6, size: rand(6, 12), color: Math.random() < 0.5 ? '#ffb02e' : '#ff5a1f', glow: true });
  }
  for (let i = 0; i < 10; i++) {                  // smoke
    const a = rand(0, TAU), s = rand(10, 60);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, g: -40,
      life: rand(1, 1.8), max: 1.8, size: rand(10, 18), color: '#6b6b6b', smoke: true });
  }
}

function spawnSplash(x, y, count) {
  for (let i = 0; i < count; i++) {
    particles.push({ x: x + rand(-8, 8), y, vx: rand(-130, 130), vy: rand(-460, -180), g: 900,
      life: rand(0.6, 1.0), max: 1.0, size: rand(2, 4), color: Math.random() < 0.5 ? '#d8f1ff' : '#5fb0f0', water: true });
  }
}

function updateEffects(dt) {
  for (const pt of particles) {
    pt.vy += pt.g * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.smoke) pt.size += 12 * dt;
    // Debris and drops vanish when they reach the water
    if (!pt.glow && !pt.smoke && pt.y > CONFIG.WATER_Y + 4) pt.life = 0;
  }
  particles = particles.filter(pt => pt.life > 0);

  for (const f of flashes) f.t += dt;
  flashes = flashes.filter(f => f.t < 0.35);

  for (const t of floatTexts) { t.y -= 30 * dt; t.life -= dt; }
  floatTexts = floatTexts.filter(t => t.life > 0);

  if (banner) { banner.t += dt; if (banner.t > banner.duration) banner = null; }
  shake = Math.max(0, shake - 30 * dt);

  // Clouds drift with the wind
  for (const c of clouds) {
    c.x += (windLevel * 6 + 4) * dt * c.depth;
    if (c.x > W + 120) c.x = -120;
    if (c.x < -120) c.x = W + 120;
  }
}

/** Big centred message with an optional second line (shown longer). */
function showBanner(text, color, sub = null) {
  banner = { text, color, sub, t: 0, duration: sub ? 2.8 : 1.6 };
}

/* ======================================================================
 * 10. MAIN UPDATE
 * ====================================================================== */
function update(dt) {
  time += dt;
  updateEffects(dt);

  if (state !== 'title') {
    updatePoops(dt);
    for (const p of players) {
      updatePlayerPhysics(p, dt);
      if (p.hurtT > 0) p.hurtT -= dt;
      if (p.swingT >= 0) p.swingT += dt;
      if (p !== active() || state !== 'move') p.walking = false;
    }
  }

  switch (state) {
    case 'move':   updateMovePhase(dt); break;
    case 'aim':    updateAimPhase(dt); break;
    case 'swing':  updateSwingPhase(); break;
    case 'flight': updatePuck(dt); break;
    case 'settle': {
      settleTimer += dt;
      const calm = players.every(p => (p.grounded && !p.knocked) || p.inWater) && poops.every(pp => pp.grounded);
      if ((settleTimer > 1.0 && calm && particles.length < 10) || settleTimer > 4) {
        if (players.some(p => p.defeat || p.health <= 0)) showGameOver();
        else nextTurn();
      }
      break;
    }
    case 'boss':   updateBoss(dt); break;
    case 'mega':   updateMegaDelivery(dt); break;
    case 'button':
      buttonEvent.t += dt;
      if (buttonEvent.t > 2.4) showGameOver();
      break;
    case 'gameover':
      gameOverTimer += dt;
      break;
  }

  // Someone walked or fell into the water outside of a shot: end the game
  if ((state === 'move' || state === 'aim') && players.some(p => p.defeat)) enterSettle();
}

/* ======================================================================
 * 11. RENDERING: WORLD
 * ====================================================================== */
function initClouds() {
  clouds = [];
  for (let i = 0; i < 7; i++) {
    clouds.push({ x: rand(0, W), y: rand(40, 260), scale: rand(0.6, 1.3), depth: rand(0.5, 1.2) });
  }
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, CONFIG.WATER_Y);
  g.addColorStop(0, '#5fb3ea');
  g.addColorStop(1, '#d6efff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Sun
  const sun = ctx.createRadialGradient(1130, 95, 10, 1130, 95, 90);
  sun.addColorStop(0, 'rgba(255,248,200,1)');
  sun.addColorStop(0.35, 'rgba(255,235,150,0.9)');
  sun.addColorStop(1, 'rgba(255,235,150,0)');
  ctx.fillStyle = sun;
  ctx.beginPath();
  ctx.arc(1130, 95, 90, 0, TAU);
  ctx.fill();

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, TAU);
    ctx.arc(28, -10, 30, 0, TAU);
    ctx.arc(58, 0, 24, 0, TAU);
    ctx.arc(30, 10, 24, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawWater() {
  const g = ctx.createLinearGradient(0, CONFIG.WATER_Y, 0, H);
  g.addColorStop(0, 'rgba(40,125,205,0.82)');
  g.addColorStop(1, 'rgba(14,52,115,0.96)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 16) ctx.lineTo(x, waveY(x));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 16) {
    if (x === 0) ctx.moveTo(x, waveY(x)); else ctx.lineTo(x, waveY(x));
  }
  ctx.stroke();
}

function waveY(x) {
  return CONFIG.WATER_Y + Math.sin(x * 0.025 + time * 1.8) * 3 + Math.sin(x * 0.06 - time * 1.1) * 1.5;
}

/** The big red button on its post, plus a warning label. */
function drawButton() {
  const bx = CONFIG.BUTTON_X, by = CONFIG.BUTTON_Y, r = CONFIG.BUTTON_RADIUS;
  const triggered = state === 'button' || (state === 'gameover' && buttonEvent);
  const flashOn = triggered && Math.floor((buttonEvent.t || time) * 10) % 2 === 0;

  // Glow and shock rings when triggered
  if (triggered) {
    const glow = ctx.createRadialGradient(bx, by, 5, bx, by, 160);
    glow.addColorStop(0, flashOn ? 'rgba(255,255,255,0.9)' : 'rgba(255,40,40,0.8)');
    glow.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(bx, by, 160, 0, TAU);
    ctx.fill();
    if (state === 'button') {
      for (let i = 0; i < 3; i++) {
        const rr = ((buttonEvent.t * 220) + i * 80) % 260;
        ctx.strokeStyle = `rgba(255,60,60,${1 - rr / 260})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(bx, by, rr, 0, TAU);
        ctx.stroke();
      }
    }
  }

  // Post (metal pole going into the water)
  ctx.fillStyle = '#7f8792';
  ctx.fillRect(BUTTON.postX0, BUTTON.housingY1, BUTTON.postX1 - BUTTON.postX0, H - BUTTON.housingY1);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(BUTTON.postX0 + 2, BUTTON.housingY1, 3, H - BUTTON.housingY1);

  // Housing with hazard stripes
  ctx.save();
  roundRectPath(ctx, BUTTON.housingX0, BUTTON.housingY0, 52, 16, 4);
  ctx.fillStyle = '#ffcc1a';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#222';
  for (let x = BUTTON.housingX0 - 20; x < BUTTON.housingX1 + 20; x += 12) {
    ctx.beginPath();
    ctx.moveTo(x, BUTTON.housingY1);
    ctx.lineTo(x + 6, BUTTON.housingY1);
    ctx.lineTo(x + 22, BUTTON.housingY0);
    ctx.lineTo(x + 16, BUTTON.housingY0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;
  roundRectPath(ctx, BUTTON.housingX0, BUTTON.housingY0, 52, 16, 4);
  ctx.stroke();

  // Dome
  ctx.fillStyle = triggered ? (flashOn ? '#ffffff' : '#ff2020') : '#d61a1a';
  ctx.beginPath();
  ctx.ellipse(bx, by + 1, r, r * 0.85, 0, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#7a0b0b';
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(bx - 6, by - 8, 5, 3, -0.5, 0, TAU);
  ctx.fill();

  // Floating warning label
  if (!triggered) {
    const ly = by - 46 + Math.sin(time * 3) * 3;
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    roundRectPath(ctx, bx - 52, ly - 11, 104, 22, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
    ctx.fillStyle = '#c01515';
    ctx.fillText('DO NOT PRESS', bx, ly + 1);
    ctx.beginPath();
    ctx.moveTo(bx - 6, ly + 11);
    ctx.lineTo(bx + 6, ly + 11);
    ctx.lineTo(bx, ly + 18);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
  }
}

/** Current stick angle for a squirrel (radians from straight down, + = forward). */
function stickAngle(p) {
  if (p.swingT < 0) return STICK_REST;
  const t = Math.min(p.swingT, SWING_TIME);
  if (t < 0.22) return lerp(STICK_REST, -2.3, easeOutCubic(t / 0.22));   // wind-up
  if (t < 0.32) return lerp(-2.3, 1.2, (t - 0.22) / 0.1);                 // slap!
  return lerp(1.2, 1.9, easeOutCubic((t - 0.32) / (SWING_TIME - 0.32))); // follow-through
}

/**
 * Draws a squirrel in a hockey helmet holding a stick.
 * Drawn facing right in local coordinates (origin at the feet), mirrored when facing left.
 */
function drawSquirrel(p) {
  if (p.inWater && p.y > H + 40) return;
  const fur = '#a8672f', furDark = '#73421d', furLight = '#ecc89c';

  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.hurtT > 0 && Math.floor(p.hurtT * 20) % 2 === 0) ctx.globalAlpha = 0.45;
  ctx.scale(p.facing * p.scale, p.scale);
  const bob = p.walking ? Math.abs(Math.sin(p.walkPhase)) * 2 : 0;
  ctx.translate(0, -bob);

  // Bushy tail
  ctx.fillStyle = fur;
  ctx.strokeStyle = furDark;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-6, -10);
  ctx.bezierCurveTo(-32, -8, -36, -40, -21, -52);
  ctx.bezierCurveTo(-10, -60, 3, -53, -4, -45);
  ctx.bezierCurveTo(-14, -37, -14, -23, -2, -17);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(236,200,156,0.7)';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-10, -14);
  ctx.quadraticCurveTo(-28, -26, -19, -47);
  ctx.stroke();

  // Feet
  const step = p.walking ? Math.sin(p.walkPhase) * 3 : 0;
  ctx.fillStyle = furDark;
  ctx.beginPath();
  ctx.ellipse(-4 + step, -2, 5, 2.5, 0, 0, TAU);
  ctx.ellipse(5 - step, -2, 5, 2.5, 0, 0, TAU);
  ctx.fill();

  // Body in a team-coloured jersey with a white stripe
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, -15, 9, 11.5, 0, 0, TAU);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-10, -12, 20, 3);
  ctx.restore();
  ctx.strokeStyle = p.dark;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(0, -15, 9, 11.5, 0, 0, TAU);
  ctx.stroke();

  // Ear poking out behind the helmet
  ctx.fillStyle = fur;
  ctx.beginPath();
  ctx.moveTo(-4, -37);
  ctx.lineTo(-7, -47);
  ctx.lineTo(1, -40);
  ctx.closePath();
  ctx.fill();

  // Head, muzzle, nose, eye
  ctx.fillStyle = fur;
  ctx.beginPath();
  ctx.arc(4, -31, 8.5, 0, TAU);
  ctx.fill();
  ctx.fillStyle = furLight;
  ctx.beginPath();
  ctx.ellipse(10, -27.5, 5, 3.8, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(14.5, -29, 1.7, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(8, -32.5, 2.7, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(9, -32.5, 1.4, 0, TAU);
  ctx.fill();

  // Angry eyebrow for the boss
  if (p.mega) {
    ctx.strokeStyle = '#2a1607';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(5, -36.5);
    ctx.lineTo(11.5, -34);
    ctx.stroke();
  }

  // Hockey helmet: dome, stripe, face cage
  ctx.fillStyle = p.helmet || p.color;
  ctx.strokeStyle = p.dark;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(3, -32, 10.5, Math.PI * 0.95, Math.PI * 2.03);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(3, -32, 7.5, Math.PI * 1.2, Math.PI * 1.75);
  ctx.stroke();
  ctx.strokeStyle = '#c9ced6';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(13, -33);
  ctx.quadraticCurveTo(18, -28, 13, -22);
  ctx.moveTo(9, -33);
  ctx.quadraticCurveTo(14, -27, 9, -22);
  ctx.moveTo(8, -28);
  ctx.lineTo(17, -28);
  ctx.stroke();

  // Hockey stick (angle depends on the swing animation)
  const th = stickAngle(p);
  const px = 3, py = -18, len = 20;
  const sx = Math.sin(th), sy = Math.cos(th);
  const ex = px + sx * len, ey = py + sy * len;
  const bladeA = STICK_REST - th;                // blade is horizontal at rest
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#6b4320';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(px - sx * 6, py - sy * 6);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.strokeStyle = '#151515';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex + Math.cos(bladeA) * 10, ey + Math.sin(bladeA) * 10);
  ctx.stroke();
  // Gloves
  ctx.fillStyle = p.dark;
  ctx.beginPath();
  ctx.arc(px, py, 3.2, 0, TAU);
  ctx.arc(px + sx * 8, py + sy * 8, 3.2, 0, TAU);
  ctx.fill();

  // Puck waiting on the ice... er, grass, in front of the blade while aiming
  if (p === active() && (state === 'aim' || (state === 'swing' && p.swingT < SWING_IMPACT))) {
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(22, -3, 6, 2.5, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/** Bouncing arrow above the active squirrel. */
function drawActiveMarker(p) {
  const y = p.y - p.height - 28 + Math.sin(time * 5) * 4;
  ctx.fillStyle = p.color;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(p.x - 9, y - 10);
  ctx.lineTo(p.x + 9, y - 10);
  ctx.lineTo(p.x, y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

/** Dashed aim line whose length shows the power. */
function drawAimGuide(p) {
  const d = aimVector(p);
  const ox = p.x, oy = p.y - 18 * p.scale;
  const len = 40 + p.power * 0.9;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(ox + d.x * 22, oy + d.y * 22);
  ctx.lineTo(ox + d.x * len, oy + d.y * len);
  ctx.stroke();
  ctx.setLineDash([]);
  const tx = ox + d.x * len, ty = oy + d.y * len, a = Math.atan2(d.y, d.x);
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.moveTo(tx + Math.cos(a) * 10, ty + Math.sin(a) * 10);
  ctx.lineTo(tx + Math.cos(a + 2.5) * 10, ty + Math.sin(a + 2.5) * 10);
  ctx.lineTo(tx + Math.cos(a - 2.5) * 10, ty + Math.sin(a - 2.5) * 10);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/** The spinning exploding puck, its trail, and an arrow if it leaves the top of the screen. */
function drawPuck() {
  if (!puck) return;
  puck.trail.forEach((t, i) => {
    ctx.fillStyle = `rgba(255,255,255,${(i / puck.trail.length) * 0.5})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 2 + i * 0.15, 0, TAU);
    ctx.fill();
  });

  ctx.save();
  ctx.translate(puck.x, puck.y);
  ctx.rotate(puck.rot);
  roundRectPath(ctx, -7, -3, 14, 6, 2.5);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(-6, -3, 12, 1.5);
  ctx.fillStyle = Math.floor(time * 12) % 2 ? '#ff3b3b' : '#ffd23b';   // blinking "fuse" light
  ctx.beginPath();
  ctx.arc(0, 0, 1.8, 0, TAU);
  ctx.fill();
  ctx.restore();

  if (puck.y < 0) {
    const x = clamp(puck.x, 20, W - 20);
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(x, 6);
    ctx.lineTo(x - 8, 20);
    ctx.lineTo(x + 8, 20);
    ctx.closePath();
    ctx.fill();
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${Math.round(-puck.y)} px`, x, 34);
  }
}

function drawEffects() {
  for (const f of flashes) {
    const k = f.t / 0.35;
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, (20 + k * 60) * (f.scale || 1));
    g.addColorStop(0, `rgba(255,250,210,${1 - k})`);
    g.addColorStop(0.5, `rgba(255,160,40,${0.8 * (1 - k)})`);
    g.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(f.x, f.y, (20 + k * 60) * (f.scale || 1), 0, TAU);
    ctx.fill();
  }
  for (const pt of particles) {
    const a = clamp(pt.life / pt.max, 0, 1);
    ctx.globalAlpha = pt.smoke ? a * 0.5 : a;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.glow ? pt.size * (0.4 + a * 0.6) : pt.size, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of floatTexts) {
    ctx.globalAlpha = clamp(t.life, 0, 1);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

/* ======================================================================
 * 12. RENDERING: HUD AND SCREENS
 * ====================================================================== */
function panel(x, y, w, h) {
  roundRectPath(ctx, x, y, w, h, 10);
  ctx.fillStyle = 'rgba(10,20,35,0.6)';
  ctx.fill();
}

function drawHealthPanel(p, x) {
  const isActive = p === active() && state !== 'title' && state !== 'gameover';
  panel(x, 14, 270, 62);
  if (isActive) {
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3;
    roundRectPath(ctx, x, 14, 270, 62, 10);
    ctx.stroke();
  }
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.fillStyle = p.light;
  const label = p.mega ? p.name
    : isAI(p) ? `${p.name} · AI ${AI_LEVELS[gameMode.difficulty].label}` : `${p.name} Squirrel`;
  ctx.fillText(label, x + 14, 32);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.fillText(`${Math.ceil(p.health)} HP`, x + 256, 32);

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x + 14, 48, 242, 14);
  ctx.fillStyle = p.color;
  ctx.fillRect(x + 14, 48, 242 * (p.health / p.maxHealth), 14);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 14.5, 48.5, 241, 13);
}

function drawWind(cx, cy) {
  panel(cx - 90, cy - 26, 180, 52);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('WIND', cx, cy - 13);
  if (windLevel === 0) {
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('Calm (0)', cx, cy + 8);
    return;
  }
  const dir = Math.sign(windLevel);
  const len = 14 + Math.abs(windLevel) * 5;
  const ax = cx - 20;                    // arrow centre (number goes to the right)
  ctx.strokeStyle = '#9fe0ff';
  ctx.fillStyle = '#9fe0ff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(ax - dir * len / 2, cy + 8);
  ctx.lineTo(ax + dir * len / 2, cy + 8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ax + dir * (len / 2 + 9), cy + 8);
  ctx.lineTo(ax + dir * (len / 2 - 2), cy + 1);
  ctx.lineTo(ax + dir * (len / 2 - 2), cy + 15);
  ctx.closePath();
  ctx.fill();
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(String(Math.abs(windLevel)), cx + 48, cy + 9);
}

function drawHUD() {
  drawHealthPanel(players[0], 14);
  drawHealthPanel(players[1], W - 284);

  // Turn info + wind in the top centre
  const p = active();
  panel(W / 2 - 150, 14, 300, 34);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  const phaseName = { move: 'Move', aim: 'Aim', swing: 'Shoot!', flight: 'Puck in the air', settle: '...', boss: 'Incoming!', mega: 'BOSS INCOMING!', button: '!!!', gameover: '' }[state] || '';
  // "Round N · <Name> · <Phase>", with the name in team colour, centred as a whole
  const parts = [
    [`Round ${round} · `, '#fff'],
    [displayName(p), p.light],
    [phaseName ? ` · ${phaseName}` : '', '#fff'],
  ];
  const total = parts.reduce((sum, [text]) => sum + ctx.measureText(text).width, 0);
  let tx = W / 2 - total / 2;
  ctx.textAlign = 'left';
  for (const [text, color] of parts) {
    ctx.fillStyle = color;
    ctx.fillText(text, tx, 31);
    tx += ctx.measureText(text).width;
  }
  drawWind(W / 2, 86);
  drawBossStatus(W / 2, 132);

  // Bottom panel: movement bar or angle/power
  const bx = W / 2 - 220, by = H - 74;
  if (state === 'move') {
    panel(bx, by, 440, 60);
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Movement left: ${Math.round(moveLeft)}`, bx + 16, by + 18);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(bx + 16, by + 32, 200, 14);
    ctx.fillStyle = '#7ddc5a';
    ctx.fillRect(bx + 16, by + 32, 200 * (moveLeft / CONFIG.MOVE_DISTANCE), 14);
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    if (isAI(p)) {
      ctx.fillText('The computer is moving…', bx + 236, by + 31);
    } else {
      ctx.fillText('← / → walk', bx + 236, by + 20);
      ctx.fillText('Enter: done moving', bx + 236, by + 42);
    }
  } else if (state === 'aim') {
    const elevation = p.aim <= 90 ? p.aim : 180 - p.aim;
    const arrow = aimVector(p).x >= 0 ? '→' : '←';
    panel(bx, by, 440, 60);
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Angle: ${Math.round(elevation)}° ${arrow}`, bx + 16, by + 18);
    ctx.fillText(`Power: ${Math.round(p.power)}%`, bx + 130, by + 18);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(bx + 16, by + 32, 200, 14);
    const pg = ctx.createLinearGradient(bx + 16, 0, bx + 216, 0);
    pg.addColorStop(0, '#ffe14d');
    pg.addColorStop(1, '#ff3b2f');
    ctx.fillStyle = pg;
    ctx.fillRect(bx + 16, by + 32, 200 * (p.power / 100), 14);
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    if (isAI(p)) {
      ctx.fillText('The computer is aiming…', bx + 236, by + 31);
    } else {
      ctx.fillText('↑ / ↓ angle   ← / → power', bx + 236, by + 20);
      ctx.fillText('Space: SHOOT', bx + 236, by + 42);
    }
  }

  // Turn banner
  if (banner) {
    const a = banner.t < banner.duration - 0.4 ? 1 : (banner.duration - banner.t) / 0.4;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = 'bold 44px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.strokeText(banner.text, W / 2, 200);
    ctx.fillStyle = banner.color;
    ctx.fillText(banner.text, W / 2, 200);
    if (banner.sub) {
      ctx.font = 'bold 26px system-ui, sans-serif';
      ctx.lineWidth = 5;
      ctx.strokeText(banner.sub, W / 2, 248);
      ctx.fillStyle = '#ffd23b';
      ctx.fillText(banner.sub, W / 2, 248);
    }
    ctx.globalAlpha = 1;
  }
}

/** Big flashing alert while the red button "goes off". */
function drawButtonAlarm() {
  const t = buttonEvent.t;
  ctx.fillStyle = `rgba(255,0,0,${0.15 + 0.15 * Math.sin(t * 20)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 54px system-ui, sans-serif';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#000';
  const text = 'THE RED BUTTON WAS PRESSED!';
  ctx.strokeText(text, W / 2, 250);
  ctx.fillStyle = Math.floor(t * 8) % 2 ? '#ffffff' : '#ff3030';
  ctx.fillText(text, W / 2, 250);
}

function drawTitle() {
  ctx.fillStyle = 'rgba(8,16,30,0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 64px system-ui, sans-serif';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#000';
  ctx.strokeText('SLAPSHOT SQUIRRELS', W / 2, 110);
  ctx.fillStyle = '#ffd23b';
  ctx.fillText('SLAPSHOT SQUIRRELS', W / 2, 110);

  ctx.font = '20px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('Two squirrels. Two islands. Exploding hockey pucks.', W / 2, 160);

  const lines = [
    ['Move phase', '← / → walk along the island, Enter to finish moving'],
    ['Aim phase', '↑ / ↓ change angle, ← / → change power, Space to shoot'],
    ['Win by', 'reducing the other squirrel to 0 HP or knocking them into the water'],
    ['Never', 'hit the red button with a puck, or click it. You lose instantly.'],
    [`Round ${CONFIG.BOSS_AFTER_ROUNDS + 1}`, 'a final boss bombs the islands with explosive poop. Lose your whole island and you lose!'],
    ['Beat the AI', 'and the final final boss drops in: the giant Mega Squirrel!'],
  ];
  ctx.font = '17px system-ui, sans-serif';
  lines.forEach(([k, v], i) => {
    const y = 196 + i * 30;
    ctx.textAlign = 'right';
    ctx.fillStyle = i === 3 ? '#ff6b6b' : '#9fe0ff';
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillText(k, W / 2 - 200, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = '17px system-ui, sans-serif';
    ctx.fillText(v, W / 2 - 180, y);
  });

  // Game mode menu
  ctx.textAlign = 'center';
  MENU.forEach((item, i) => {
    const r = menuRect(i);
    const selected = i === menuIndex;
    roundRectPath(ctx, r.x, r.y, r.w, r.h, 10);
    ctx.fillStyle = selected ? '#ffd23b' : (item.href ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.12)');
    ctx.fill();
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillStyle = selected ? '#2a2000' : '#fff';
    ctx.fillText(item.label, W / 2, r.y + r.h / 2 + 1);
  });

  ctx.font = '16px system-ui, sans-serif';
  ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.4 * Math.sin(time * 4)})`;
  ctx.fillText('↑ / ↓ choose a mode, ENTER or click to start   ·   vs Computer: you play Red', W / 2, 668);
}

/** Rectangle of the i-th game mode button on the title screen. */
function menuRect(i) {
  return { x: W / 2 - 180, y: 372 + i * 50 + (MENU[i].href ? 12 : 0), w: 360, h: 42 };
}

/** Buttons on the game-over screen. */
const PLAY_AGAIN = { x: W / 2 - 230, y: 430, w: 220, h: 56 };
const MAIN_MENU = { x: W / 2 + 10, y: 430, w: 220, h: 56 };

function drawGameOver() {
  ctx.fillStyle = `rgba(8,16,30,${Math.min(0.7, gameOverTimer * 1.5)})`;
  ctx.fillRect(0, 0, W, H);
  panel(W / 2 - 330, 170, 660, 350);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 56px system-ui, sans-serif';
  if (result.winner && result.losers.some(p => p.mega)) {
    ctx.fillStyle = '#ffd23b';
    ctx.font = 'bold 44px system-ui, sans-serif';
    ctx.fillText('YOU BEAT THE FINAL FINAL BOSS!', W / 2, 240);
  } else if (result.winner) {
    ctx.fillStyle = result.winner.color;
    ctx.fillText(`${displayName(result.winner)} wins!`, W / 2, 240);
  } else {
    ctx.fillStyle = '#fff';
    ctx.fillText("It's a draw!", W / 2, 240);
  }
  ctx.font = '22px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  result.losers.forEach((p, i) => ctx.fillText(defeatMessage(p), W / 2, 310 + i * 34));
  if (result.losers.some(p => p.defeat === 'button')) {
    ctx.font = 'italic 17px system-ui, sans-serif';
    ctx.fillStyle = '#ff9a9a';
    ctx.fillText('It said DO NOT PRESS.', W / 2, 385);
  }

  drawScreenButton(PLAY_AGAIN, 'Play again', true);
  drawScreenButton(MAIN_MENU, 'Main menu', false);
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Enter: play again   ·   Esc: main menu', W / 2, PLAY_AGAIN.y + PLAY_AGAIN.h + 20);
}

function drawScreenButton(r, label, primary) {
  const hover = inRect(mouse, r);
  roundRectPath(ctx, r.x, r.y, r.w, r.h, 12);
  ctx.fillStyle = primary ? (hover ? '#ffe270' : '#ffd23b') : (hover ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.18)');
  ctx.fill();
  ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = primary ? '#2a2000' : '#fff';
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
}

function inRect(pt, r) {
  return pt.x >= r.x && pt.x <= r.x + r.w && pt.y >= r.y && pt.y <= r.y + r.h;
}

/* ======================================================================
 * 13. MAIN RENDER
 * ====================================================================== */
function render() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  drawSky();
  ctx.drawImage(terrainCanvas, 0, 0);
  drawButton();
  drawPoops();
  for (const p of players) if (!p.carried) drawSquirrel(p);
  if (state === 'aim') drawAimGuide(active());
  if (['move', 'aim', 'swing'].includes(state)) drawActiveMarker(active());
  drawPuck();
  drawWater();
  drawEffects();
  drawBoss();
  drawMegaDelivery();
  ctx.restore();

  if (state === 'title') {
    drawTitle();
    return;
  }
  drawHUD();
  if (state === 'button') drawButtonAlarm();
  if (state === 'gameover') drawGameOver();
}

/* ======================================================================
 * 14. INPUT
 * ====================================================================== */
const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'NumpadEnter'];

window.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  keys[e.code] = true;

  // Title screen: choose a game mode
  if (state === 'title') {
    if (e.code === 'ArrowUp') menuIndex = (menuIndex + MENU.length - 1) % MENU.length;
    if (e.code === 'ArrowDown') menuIndex = (menuIndex + 1) % MENU.length;
  }
  if (e.repeat) return;

  const enter = e.code === 'Enter' || e.code === 'NumpadEnter';
  const humanTurn = players.length > 0 && !isAI(active());
  if (enter) {
    if (state === 'title') startMode(menuIndex);
    else if (state === 'gameover' && gameOverTimer > 0.5) newGame(true);
    else if (state === 'move' && humanTurn && active().grounded) startAiming();
  }
  if (e.code === 'Space' && state === 'aim' && humanTurn) shoot();
  if (e.code === 'Escape' && state === 'gameover') newGame(false);
});

window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// States in which a turn is in progress (clicking the red button loses)
const TURN_STATES = ['move', 'aim', 'swing', 'flight', 'settle'];

canvas.addEventListener('mousedown', e => {
  const pt = toGameCoords(e);
  if (state === 'title') {
    MENU.forEach((_, i) => { if (inRect(pt, menuRect(i))) startMode(i); });
    return;
  }
  if (state === 'gameover') {
    if (gameOverTimer > 0.5 && inRect(pt, PLAY_AGAIN)) newGame(true);
    else if (gameOverTimer > 0.5 && inRect(pt, MAIN_MENU)) newGame(false);
    return;
  }
  if (TURN_STATES.includes(state) && touchesButton(pt.x, pt.y, 4)) {
    // Hot-seat: the player whose turn it is loses. Against the computer only
    // the human can click, so the human loses (even during the AI's turn).
    triggerButton(gameMode.ai ? players[0] : active(), 'click');
  }
});

canvas.addEventListener('mousemove', e => {
  const pt = toGameCoords(e);
  mouse.x = pt.x;
  mouse.y = pt.y;
  const overButton = TURN_STATES.includes(state) && touchesButton(pt.x, pt.y, 4);
  const overPlay = state === 'gameover' && (inRect(pt, PLAY_AGAIN) || inRect(pt, MAIN_MENU));
  let overMenu = false;
  if (state === 'title') {
    MENU.forEach((_, i) => { if (inRect(pt, menuRect(i))) { menuIndex = i; overMenu = true; } });
  }
  canvas.style.cursor = overButton || overPlay || overMenu ? 'pointer' : 'default';   // so tempting...
});

/* ======================================================================
 * 15. MAIN LOOP
 * ====================================================================== */
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - lastTime) / 1000);   // clamp to avoid huge jumps
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

initClouds();
newGame(false);
requestAnimationFrame(frame);
</script>
</body>
