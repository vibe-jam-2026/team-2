<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hop Hop Hill</title>
<!--
  HOP HOP HILL
  A simple side-scrolling platformer. Run, jump, grab coins, stomp the
  enemies, avoid the spikes, beat the boss at the end of each level and
  reach the flag. Three levels.

  Controls: ← → / A D to run, Space / ↑ / W to jump (hold for a higher
  jump), R to restart the level, M to mute, Esc to go back to the hub.
  Sound effects are synthesized in the browser (Web Audio API).
  On touch screens, on-screen buttons appear.

  Single self-contained file: HTML + CSS + JavaScript (Canvas API).
  No external libraries or assets.

  Levels are plain text maps in LEVELS below. Legend:
    #  ground block          =  one-way platform (jump up through it)
    ^  spikes                o  coin
    s  slime   (walks, stomp it)
    j  hopper  (jumps at you, stomp it)
    b  bat     (flies back and forth, stomp it)
    k  spiky beetle (walks, can NOT be stomped: jump over it)
    m  moving platform (slides left/right)
    B  the level's boss      G  gate that opens when the boss is beaten
    P  player start          F  goal flag
    X  the red button. Never jump on it: you explode and lose all your lives.
-->
<style>
  html, body { margin: 0; height: 100%; background: #10172a; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,.5); }
  #back { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,.35); padding: 6px 12px;
          border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
  .pad { position: fixed; bottom: 18px; display: none; gap: 14px; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6);
                background: rgba(0,0,0,.3); color: #fff; font-size: 28px; touch-action: none; user-select: none; }
  #padL { left: 18px; } #padR { right: 18px; }
  @media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<a id="back" href="index.html">← Hub</a>
<canvas id="game" width="960" height="540"></canvas>
<div class="pad" id="padL"><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="pad" id="padR"><button data-k="jump">⤒</button></div>
<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, T = 32;

/* ---------------------------------------------------------------- levels */
const LEVELS = [
  { name: 'Green Meadow', sky: ['#7fd3ff', '#d9f3ff'], boss: 'king',
    bg: { sun: '#fff6c8', far: '#a9c8e8', near: '#7fa6cf', snow: '#ffffff', hill: '#8fd07a', trees: ['#3f9a4a', '#2f7d3c', '#5bb85a'], trunk: '#6b4428' }, map: [
    '                                                                                                            ',
    '                                                                                                            ',
    '                                                                                                            ',
    '                          b                                                                          GG     ',
    '                                                                b                                    GG     ',
    '                                                                                                     GG     ',
    '                        o o o                                                                        GG     ',
    '           o o         ======                                  o o                                   GG     ',
    '          =====                           o o          s      =====                                  GG     ',
    '                  ##                                #######                                          GG     ',
    ' P      s         ##          s     ^^         j  #########  ^^^^^^   s    j                   B     GG XF  ',
    '##########################################   ###############################################################',
    '##########################################   ###############################################################',
    '##########################################   ###############################################################',
  ]},
  { name: 'Spiky Caves', sky: ['#3b2a5c', '#8a5a9a'], boss: 'beetle',
    bg: { sun: '#e8e0ff', far: '#5a4580', near: '#47366a', snow: '#c9b8ec', hill: '#3a2c58', trees: ['#2a2046', '#231a3c', '#33285a'], trunk: '#1c1530' }, map: [
    '                                                                                                                      ',
    '                                                                                                                      ',
    '                                                                                                               GG     ',
    '                                                                                                               GG     ',
    '                          b                     b                      b                                       GG     ',
    '                                                                                                               GG     ',
    '                         o  o                                         o                                        GG     ',
    '               o o                     o       oo      o o                                                     GG     ',
    '              =====  m                ###     ====    =====      m                                             GG     ',
    ' P              s  k              s   ###  k         j      s  k                s   j  k                  B    GG XF  ',
    '#######^^^^##########^^^^^^^^^^##############^^^^^^##############^^^^^^^^^^###########################################',
    '######################################################################################################################',
    '######################################################################################################################',
    '######################################################################################################################',
  ]},
  { name: 'Cloud Top', sky: ['#ff9a6b', '#ffe0a8'], boss: 'queen',
    bg: { sun: '#fff1b0', far: '#f0a98a', near: '#d9826e', snow: '#fff4e8', hill: '#c56a5c', trees: ['#8a3f4a', '#6e2f3c', '#a24f56'], trunk: '#4a2228' }, map: [
    '                                                                                                                      GG      ',
    '                                                                                                                      GG      ',
    '                                                                     b          b                                     GG      ',
    '                                    b             b                                                                   GG      ',
    '                 b                                                                                                    GG      ',
    '                                                o                oo                o                                  GG      ',
    '                                oo                        k     ====              ===      j s                B       GG XF   ',
    '                          s    ====         m          ######          m                ######################################',
    '         oo   m         ####          ====             ######                           ######################################',
    ' P      ====            ####                           ######                           ######################################',
    '#####^^^^^^^^^^^^^^^^^^^####^^^^^^^^^^^^^^^^^^^^^^^^^^^######^^^^^^^^^^^^^^^^^^^^^^^^^^^######################################',
    '##############################################################################################################################',
    '##############################################################################################################################',
    '##############################################################################################################################',
  ]},
];

/* Boss settings per type. Stomp the boss on the head to hurt it. */
const BOSSES = {
  king:   { name: 'King Slime',  hp: 3, w: 84, h: 66, color: '#4fcf5a' },  // walks after you and jumps
  beetle: { name: 'Cave Beetle', hp: 3, w: 92, h: 52, color: '#5b3f8c' },  // charges; stomp it only while it is dizzy
  queen:  { name: 'Slime Queen', hp: 4, w: 88, h: 74, color: '#e255b8' },  // hops after you and spits fireballs
};

/* ---------------------------------------------------------------- sound
   All effects are synthesized with the Web Audio API (no sound files).
   Browsers only allow audio after the player has pressed something, so the
   audio context is created on the first input. M toggles mute. */
const Sound = {
  ac: null, master: null, noiseBuf: null, muted: false,
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.35;
    this.master.connect(this.ac.destination);
    const len = this.ac.sampleRate;                // 1 second of white noise, reused
    this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.35;
  },
  ok() { return this.ac && !this.muted; },
  // a tone that slides from f0 to f1 Hz
  tone(f0, f1, dur, type = 'square', vol = 0.3, delay = 0) {
    if (!this.ok()) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  // filtered noise: thuds, crashes and whooshes
  noise(dur, vol = 0.3, freq = 1200, delay = 0, type = 'lowpass') {
    if (!this.ok()) return;
    const t = this.ac.currentTime + delay, src = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    src.buffer = this.noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t); src.stop(t + dur + 0.02);
  },
  notes(list, step, type = 'square', vol = 0.22, len = 0.14) {
    list.forEach((f, i) => this.tone(f, f, len, type, vol, i * step));
  },
};
const SFX = {
  jump:      () => Sound.tone(280, 620, 0.14, 'square', 0.16),
  coin:      () => { Sound.tone(988, 988, 0.07, 'square', 0.14); Sound.tone(1319, 1319, 0.18, 'square', 0.14, 0.07); },
  stomp:     () => { Sound.tone(420, 110, 0.14, 'triangle', 0.4); Sound.noise(0.08, 0.15, 900); },
  hop:       () => Sound.tone(180, 360, 0.1, 'sine', 0.12),
  die:       () => { Sound.tone(660, 70, 0.55, 'square', 0.2); Sound.noise(0.25, 0.2, 600); },
  bossWake:  () => { Sound.tone(110, 55, 0.7, 'sawtooth', 0.25); Sound.noise(0.6, 0.25, 300); },
  bossLand:  () => Sound.noise(0.25, 0.35, 220),
  bossHit:   () => { Sound.tone(300, 60, 0.3, 'sawtooth', 0.28); Sound.noise(0.2, 0.3, 1500); },
  crash:     () => { Sound.noise(0.4, 0.45, 400); Sound.tone(140, 50, 0.3, 'triangle', 0.4); },
  spit:      () => { Sound.noise(0.25, 0.2, 2500, 0, 'bandpass'); Sound.tone(500, 200, 0.2, 'sawtooth', 0.08); },
  bossDown:  () => { Sound.noise(0.9, 0.5, 500); Sound.tone(200, 40, 0.8, 'sawtooth', 0.3);
                     Sound.notes([523, 659, 784, 1047], 0.1, 'square', 0.18, 0.16); },
  gate:      () => Sound.tone(70, 45, 1.1, 'sawtooth', 0.15, 0.4),
  clear:     () => Sound.notes([523, 659, 784, 1047, 784, 1047], 0.11, 'square', 0.18, 0.18),
  boom:      () => { Sound.noise(1.6, 0.7, 900); Sound.noise(1.2, 0.5, 150); Sound.tone(160, 30, 1.2, 'sawtooth', 0.35);
                     Sound.tone(900, 900, 0.08, 'square', 0.12); },
  click:     () => Sound.tone(1500, 1500, 0.04, 'square', 0.2),
  gameover:  () => Sound.notes([392, 330, 262, 196], 0.28, 'triangle', 0.3, 0.3),
  won:       () => Sound.notes([523, 523, 659, 784, 659, 784, 1047, 1047], 0.13, 'triangle', 0.3, 0.22),
  start:     () => Sound.notes([392, 523], 0.08, 'square', 0.15, 0.1),
};

/* ---------------------------------------------------------------- input */
const keys = { left: false, right: false, jump: false };
let jumpPressedAt = -1;           // time of last jump press (for jump buffering)
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
                 Space: 'jump', ArrowUp: 'jump', KeyW: 'jump' };
function press(k, down) {
  if (k === 'jump' && down && !keys.jump) jumpPressedAt = now;
  keys[k] = down;
}
addEventListener('keydown', e => {
  Sound.unlock();
  if (e.code === 'KeyM' && !e.repeat) return Sound.toggleMute();
  if (KEYMAP[e.code]) { e.preventDefault(); press(KEYMAP[e.code], true); if (state !== 'play') advance(); }
  else if (e.code === 'KeyR' && state !== 'title') loadLevel(levelIndex);
  else if (e.code === 'Escape') location.href = 'index.html';
  else if (e.code === 'Enter' && state !== 'play') advance();
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) press(KEYMAP[e.code], false); });
document.querySelectorAll('.pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); press(k, true); if (state !== 'play') advance(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => press(k, false)));
});
canvas.addEventListener('pointerdown', () => { Sound.unlock(); if (state !== 'play') advance(); });

/* ---------------------------------------------------------------- world */
let grid, cols, rows, coins, enemies, player, flag, cam, boss;
let movers = [], particles = [], shots = [];
let levelIndex = 0, state = 'title', now = 0, levelTime = 0, totalCoins = 0, deaths = 0, stateAt = 0, shake = 0;
let gateClosed = true;
const START_LIVES = 3;
let lives = START_LIVES, gameOverReason = '';

const PW = 34, PH = 56;            // player hitbox (the player sprite is drawn 2x)
const PLAYER_SCALE = 2, ENEMY_SCALE = 1.4, BOSS_SCALE = 1.25;   // how big things are drawn

function makeEnemy(type, x, y) {
  const S = { slime: [28, 24], hopper: [26, 24], bat: [30, 18], beetle: [32, 24] }[type];   // sprite size before scaling
  const w = S[0] * ENEMY_SCALE, h = S[1] * ENEMY_SCALE;
  return { type, x: x + (T - w) / 2, y: y + T - h, w, h, w0: S[0], h0: S[1], vx: type === 'beetle' ? -70 : -55, vy: 0,
           ox: x, oy: y + 6, t: Math.random() * 3, dead: 0, face: -1 };
}

function loadLevel(i) {
  levelIndex = i;
  const L = LEVELS[i];
  rows = L.map.length; cols = Math.max(...L.map.map(r => r.length));
  buttonPressedAt = -9; boomAt = null;
  grid = []; coins = []; enemies = []; movers = []; particles = []; shots = []; boss = null; gateClosed = true;
  for (let y = 0; y < rows; y++) {
    grid.push([]);
    for (let x = 0; x < cols; x++) {
      const c = L.map[y][x] || ' ', px = x * T, py = y * T;
      let cell = ' ';
      if ('#=^GX'.includes(c)) cell = c;
      else if (c === 'o') coins.push({ x: px + T / 2, y: py + T / 2, taken: false });
      else if (c === 's') enemies.push(makeEnemy('slime', px, py));
      else if (c === 'j') enemies.push(makeEnemy('hopper', px, py));
      else if (c === 'b') enemies.push(makeEnemy('bat', px, py));
      else if (c === 'k') enemies.push(makeEnemy('beetle', px, py));
      else if (c === 'm') movers.push({ x: px, y: py, w: T * 3, h: 12, ox: px, range: T * 4, t: Math.random() * 6, dx: 0 });
      else if (c === 'P') player = { x: px + 3, y: py + T - PH, w: PW, h: PH, vx: 0, vy: 0, onGround: false, lastGround: -1, face: 1, coins: 0, ride: null };
      else if (c === 'F') flag = { x: px + 8, y: py - T * 2, w: 16, h: T * 3 };
      else if (c === 'B') boss = makeBoss(L.boss, px, py);
      grid[y].push(cell);
    }
  }
  if (boss) {   // the arena runs from 13 tiles left of the boss to the gate
    let gx = boss.x; while (gx < cols * T && tileAt(gx, boss.y + boss.h - 4) !== 'G') gx += T;
    boss.maxX = Math.floor(gx / T) * T; boss.minX = boss.maxX - 20 * T;
  }
  cam = { x: 0, y: rows * T - H };
  levelTime = 0;
  state = 'play';
}

function makeBoss(type, px, py) {
  const d = BOSSES[type];
  const w = d.w * BOSS_SCALE, h = d.h * BOSS_SCALE;
  return { type, name: d.name, color: d.color, hp: d.hp, maxHp: d.hp, w, h, w0: d.w, h0: d.h,
           x: px + T / 2 - w / 2, y: py + T - h, vx: 0, vy: 0, face: -1, onGround: false,
           mode: 'sleep', t: 0, inv: 0, dead: 0, hops: 0 };
}

const tileAt = (px, py) => {
  const x = Math.floor(px / T), y = Math.floor(py / T);
  if (x < 0 || x >= cols) return '#';
  if (y < 0 || y >= rows) return ' ';
  return grid[y][x];
};
const solid = c => c === '#' || c === 'X' || (c === 'G' && gateClosed);   // X = the red button (solid, you can stand on it... once)

/* Moves a box along each axis and resolves tile collisions. */
function moveBox(b, dx, dy) {
  b.hitWall = false;
  b.x += dx;
  if (dx !== 0) {
    const edge = dx > 0 ? b.x + b.w : b.x;
    for (let yy = b.y + 1; yy < b.y + b.h - 1; yy += T / 2) {
      if (solid(tileAt(edge, yy)) || solid(tileAt(edge, b.y + b.h - 1))) {
        b.x = dx > 0 ? Math.floor(edge / T) * T - b.w - 0.01 : Math.floor(edge / T + 1) * T + 0.01;
        b.vx = 0; b.hitWall = true; break;
      }
    }
  }
  const prevBottom = b.y + b.h;
  b.y += dy;
  b.onGround = false;
  const xs = []; for (let xx = b.x + 2; xx < b.x + b.w - 2; xx += T / 2) xs.push(xx); xs.push(b.x + b.w - 2);
  if (dy > 0) {
    const bottom = b.y + b.h;
    for (const xx of xs) {
      const c = tileAt(xx, bottom);
      const top = Math.floor(bottom / T) * T;
      if (solid(c) || (c === '=' && prevBottom <= top + 0.5)) {
        b.y = top - b.h; b.vy = 0; b.onGround = true; break;
      }
    }
  } else if (dy < 0) {
    for (const xx of xs) {
      if (solid(tileAt(xx, b.y))) { b.y = Math.floor(b.y / T + 1) * T; b.vy = 0; break; }
    }
  }
}

const overlap = (a, b, pad = 0) => a.x + pad < b.x + b.w && a.x + a.w - pad > b.x && a.y + pad < b.y + b.h && a.y + a.h - pad > b.y;

function burst(x, y, color, n = 10, speed = 140) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * speed;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.6, color });
  }
}

function die() {
  if (state !== 'play') return;
  deaths++; lives--;
  burst(player.x + player.w / 2, player.y + player.h / 2, '#ff5a5a', 28);
  shake = 0.3; SFX.die();
  if (lives <= 0) gameOverReason = 'You ran out of lives.';
  state = 'dead'; stateAt = now;
}

/* The red button. Whatever you do, don't jump on it. */
function pressRedButton() {
  if (state !== 'play') return;
  deaths++; lives = 0;
  gameOverReason = 'You jumped on the red button. Boom.';
  buttonPressedAt = now;
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
  boomAt = { x: cx, y: cy };
  burst(cx, cy, '#ff3b2f', 60, 420); burst(cx, cy, '#ffb01f', 50, 340); burst(cx, cy, '#ffe066', 30, 260); burst(cx, cy, '#555', 30, 200);
  shake = 1.2; SFX.click(); SFX.boom();
  state = 'dead'; stateAt = now;
}
let buttonPressedAt = -9, boomAt = null;

/* ---------------------------------------------------------------- update */
const GRAVITY = 1800, RUN = 240, ACCEL = 1900, FRICTION = 2000, JUMP = 660, COYOTE = 0.1, BUFFER = 0.12;

function update(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += GRAVITY * 0.5 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt);
  for (const m of movers) {
    m.t += dt;
    const nx = m.ox + (Math.sin(m.t * 1.1) * 0.5 + 0.5) * m.range;
    m.dx = nx - m.x; m.x = nx;
  }
  if (state === 'dead' && now - stateAt > (lives > 0 ? 1.1 : 1.8)) {
    if (lives > 0) loadLevel(levelIndex);
    else { state = 'gameover'; stateAt = now; SFX.gameover(); }
  }
  if (state !== 'play') return;
  levelTime += dt;
  const p = player;

  // horizontal
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir) { p.vx += dir * ACCEL * dt; p.face = dir; }
  else { const f = FRICTION * dt; p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f; }
  p.vx = Math.max(-RUN, Math.min(RUN, p.vx));

  // jump with coyote time + input buffer, variable height
  if (p.onGround || p.ride) p.lastGround = now;
  if (now - jumpPressedAt < BUFFER && now - p.lastGround < COYOTE) {
    p.vy = -JUMP; jumpPressedAt = -1; p.lastGround = -1; p.ride = null; SFX.jump();
  }
  if (!keys.jump && p.vy < -220) p.vy = -220;
  p.vy = Math.min(p.vy + GRAVITY * dt, 900);

  // ride moving platform
  const carry = p.ride ? p.ride.dx : 0;
  const prevBottom = p.y + p.h;
  moveBox(p, p.vx * dt + carry, p.vy * dt);
  p.ride = null;
  if (p.vy >= 0) for (const m of movers) {
    if (p.x + p.w > m.x && p.x < m.x + m.w && prevBottom <= m.y + 1 && p.y + p.h >= m.y) {
      p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.ride = m;
    }
  }

  // hazards
  if (p.y > rows * T + 40) return die();
  const feet = p.y + p.h - 2;          // spikes hurt in the lower half of their tile
  for (const xx of [p.x + 5, p.x + p.w - 5])
    if (tileAt(xx, feet) === '^' && feet - Math.floor(feet / T) * T > 14) return die();

  // coins
  for (const c of coins) if (!c.taken && Math.abs(c.x - (p.x + p.w / 2)) < p.w / 2 + 10 && Math.abs(c.y - (p.y + p.h / 2)) < p.h / 2 + 8) {
    c.taken = true; p.coins++; SFX.coin(); burst(c.x, c.y, '#ffd84a', 8);
  }

  // stomp: falling onto the top part of something
  const stomps = e => p.vy > 0 && prevBottom <= e.y + Math.max(12, e.h * 0.35);
  const bounce = () => { p.vy = keys.jump ? -JUMP * 0.95 : -JUMP * 0.6; };

  // enemies
  for (const e of enemies) {
    if (e.dead) { e.dead += dt; continue; }
    updateEnemy(e, dt);
    if (overlap(p, e, 3)) {
      if (e.type !== 'beetle' && stomps(e)) {
        e.dead = 0.001; bounce(); SFX.stomp();
        burst(e.x + e.w / 2, e.y + e.h / 2, e.type === 'bat' ? '#b48cff' : '#7ee07a', 14);
      } else return die();
    }
  }
  enemies = enemies.filter(e => (!e.dead || e.dead < 0.4) && e.y < rows * T + 100);

  // boss + its fireballs
  if (boss && !boss.dead) {
    updateBoss(boss, dt);
    if (boss.inv <= 0 && overlap(p, boss, 6)) {
      const canHurt = boss.type !== 'beetle' || boss.mode === 'dizzy';
      if (canHurt && stomps(boss)) hitBoss();
      else return die();
    }
  } else if (boss && boss.dead) boss.dead += dt;
  for (const s of shots) {
    s.vy += GRAVITY * 0.55 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (solid(tileAt(s.x, s.y)) || s.life <= 0) { s.life = 0; burst(s.x, s.y, '#ff9a3c', 5, 60); }
    else if (Math.abs(s.x - (p.x + p.w / 2)) < p.w / 2 + 5 && Math.abs(s.y - (p.y + p.h / 2)) < p.h / 2 + 5) return die();
  }
  shots = shots.filter(s => s.life > 0);

  // landed on the red button?
  if (p.onGround) for (const xx of [p.x + 4, p.x + p.w / 2, p.x + p.w - 4])
    if (tileAt(xx, p.y + p.h + 2) === 'X') return pressRedButton();

  // goal (behind the gate, so only after the boss is beaten)
  if (!gateClosed && overlap(p, flag)) {
    totalCoins += p.coins;
    state = levelIndex === LEVELS.length - 1 ? 'won' : 'clear';
    stateAt = now; state === 'won' ? SFX.won() : SFX.clear();
    burst(flag.x, flag.y + 10, '#ffffff', 30);
  }

  // camera
  const tx = Math.max(0, Math.min(cols * T - W, p.x + p.w / 2 - W / 2));
  // levels shorter than the screen sit on its bottom edge, with sky above
  const ty = rows * T <= H ? rows * T - H : Math.max(0, Math.min(rows * T - H, p.y + p.h / 2 - H / 2));
  cam.x += (tx - cam.x) * Math.min(1, dt * 8);
  cam.y += (ty - cam.y) * Math.min(1, dt * 8);
}

function updateEnemy(e, dt) {
  e.t += dt;
  if (e.type === 'bat') {                       // flies in a wave, ignores walls
    const s = Math.sin(e.t * 1.3);
    e.face = Math.cos(e.t * 1.3) > 0 ? 1 : -1;
    e.x = e.ox + s * T * 2.5; e.y = e.oy + Math.sin(e.t * 4) * 12;
    return;
  }
  e.vy = Math.min(e.vy + GRAVITY * dt, 900);
  if (e.type === 'hopper') {                    // sits still, then jumps toward the player
    if (e.onGround) {
      e.vx = 0;
      if (e.t > 1.3 && Math.abs(player.x - e.x) < 8 * T) {
        e.t = 0; e.vy = -560; e.face = player.x < e.x ? -1 : 1; e.vx = e.face * 110;
        if (Math.abs(e.x - cam.x - W / 2) < W / 2) SFX.hop();   // only when on screen
      }
    }
    moveBox(e, e.vx * dt, e.vy * dt);
    return;
  }
  // slime / beetle: walk, turn at walls and ledges
  moveBox(e, e.vx * dt, e.vy * dt);
  const sp = e.type === 'beetle' ? 70 : 55;
  if (e.vx === 0) e.vx = -e.face * sp;          // was stopped by a wall: turn
  e.face = Math.sign(e.vx);
  const ahead = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
  const ground = tileAt(ahead, e.y + e.h + 4);
  if (e.onGround && ground !== '#' && ground !== '=') { e.vx = -e.vx; e.face = -e.face; }
}

function updateBoss(b, dt) {
  const p = player;
  b.inv = Math.max(0, b.inv - dt);
  b.t += dt;
  const toward = p.x + p.w / 2 < b.x + b.w / 2 ? -1 : 1;
  const rage = b.maxHp - b.hp;                  // gets faster as it gets hurt
  if (b.mode === 'sleep') {
    if (p.x > b.minX - T) { b.mode = b.type === 'beetle' ? 'aim' : 'walk'; b.t = 0; shake = 0.4; SFX.bossWake(); }
  } else if (b.type === 'king') {
    if (b.onGround) {
      b.face = toward; b.vx = toward * (70 + rage * 30);
      if (b.t > 2.1 - rage * 0.35) { b.t = 0; b.vy = -620; b.vx = toward * 170; }
    }
  } else if (b.type === 'beetle') {
    if (b.mode === 'aim') {                     // shakes, then charges
      b.vx = 0; b.face = toward;
      if (b.t > 0.9 - rage * 0.2) { b.mode = 'charge'; b.t = 0; }
    } else if (b.mode === 'charge') {
      b.vx = b.face * (330 + rage * 50);
    } else if (b.mode === 'dizzy') {            // flipped on its back: stomp it now!
      b.vx = 0;
      if (b.t > 2.2 - rage * 0.3) { b.mode = 'aim'; b.t = 0; }
    }
  } else if (b.type === 'queen') {
    if (b.onGround) {
      b.vx = 0; b.face = toward;
      if (b.t > 1.2 - rage * 0.15) {
        b.t = 0; b.hops++;
        if (b.hops % 3 === 0) spit(b, toward, 3 + Math.min(2, rage));
        else { b.vy = -600; b.vx = toward * (150 + rage * 30); }
      }
    }
  }
  b.vy = Math.min(b.vy + GRAVITY * dt, 900);
  const wasAir = !b.onGround;
  moveBox(b, b.vx * dt, b.vy * dt);
  if (wasAir && b.onGround && b.type !== 'beetle') { shake = 0.15; SFX.bossLand(); burst(b.x + b.w / 2, b.y + b.h, '#ffffff', 6, 60); }
  // stay inside the arena; the beetle gets dizzy when it hits a wall
  let hit = b.hitWall;
  if (b.x < b.minX) { b.x = b.minX; hit = true; }
  if (b.x + b.w > b.maxX) { b.x = b.maxX - b.w; hit = true; }
  if (hit && b.type === 'beetle' && b.mode === 'charge') {
    b.mode = 'dizzy'; b.t = 0; shake = 0.35; SFX.crash(); burst(b.x + (b.face > 0 ? b.w : 0), b.y + b.h / 2, '#ffe066', 12);
  }
}

function spit(b, dir, n) {
  SFX.spit();
  for (let i = 0; i < n; i++) {
    shots.push({ x: b.x + b.w / 2 + dir * b.w * 0.4, y: b.y + b.h * 0.35,
                 vx: dir * (140 + i * 75), vy: -380 - i * 40, life: 3 });
  }
  shake = 0.1;
}

function hitBoss() {
  const b = boss;
  b.hp--; b.inv = 1.0; shake = 0.3; SFX.bossHit();
  player.vy = -JUMP * 0.85;
  burst(b.x + b.w / 2, b.y + 10, '#ffffff', 18);
  if (b.type === 'beetle') { b.mode = 'aim'; b.t = -0.4; }
  else { b.vx = -b.face * 220; b.vy = -250; }
  if (b.hp <= 0) {
    b.dead = 0.001; gateClosed = false; shots = []; shake = 0.6; SFX.bossDown(); SFX.gate();
    burst(b.x + b.w / 2, b.y + b.h / 2, b.color, 50, 260);
    burst(b.x + b.w / 2, b.y + b.h / 2, '#ffd84a', 30, 220);
  }
}

function advance() {
  if (now - stateAt < 0.4) return;
  if (state === 'title') { totalCoins = 0; deaths = 0; lives = START_LIVES; loadLevel(0); SFX.start(); }
  else if (state === 'clear') loadLevel(levelIndex + 1);
  else if (state === 'won' || state === 'gameover') { state = 'title'; stateAt = now; }
}

/* ---------------------------------------------------------------- draw */
function draw() {
  const L = LEVELS[state === 'title' ? 0 : levelIndex];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  drawBackground(L.bg, L.sky[1], cam ? cam.x : now * 40);

  if (state === 'title') return drawTitle();

  ctx.save();
  const sx = shake > 0 ? (Math.random() - 0.5) * 12 * shake / 0.3 : 0, sy = shake > 0 ? (Math.random() - 0.5) * 12 * shake / 0.3 : 0;
  ctx.translate(-Math.round(cam.x + sx), -Math.round(cam.y + sy));
  const x0 = Math.max(0, Math.floor(cam.x / T) - 1), x1 = Math.min(cols, Math.ceil((cam.x + W) / T) + 1);
  for (let y = 0; y < rows; y++) for (let x = x0; x < x1; x++) {
    const c = grid[y][x], px = x * T, py = y * T;
    if (c === '#') {
      const top = y === 0 || grid[y - 1][x] !== '#';
      ctx.fillStyle = '#8a5a34'; ctx.fillRect(px, py, T, T);
      ctx.fillStyle = '#74492a'; ctx.fillRect(px + 4, py + 12, 6, 6); ctx.fillRect(px + 20, py + 22, 5, 5);
      if (top) { ctx.fillStyle = '#4fbf4a'; ctx.fillRect(px, py, T, 9); ctx.fillStyle = '#3ea03a'; ctx.fillRect(px, py + 7, T, 3); }
    } else if (c === '=') {
      ctx.fillStyle = '#c98b4e'; ctx.fillRect(px, py, T, 10);
      ctx.fillStyle = '#9c6534'; ctx.fillRect(px, py + 8, T, 3); ctx.fillRect(px + 3, py + 10, 4, 6); ctx.fillRect(px + T - 7, py + 10, 4, 6);
    } else if (c === '^') {
      ctx.fillStyle = '#d6dde6';
      for (let k = 0; k < 4; k++) {
        ctx.beginPath(); ctx.moveTo(px + k * 8, py + T); ctx.lineTo(px + k * 8 + 4, py + 16); ctx.lineTo(px + k * 8 + 8, py + T); ctx.fill();
      }
    } else if (c === 'X') {
      // the red button on a metal base; it is pushed in once it has been pressed
      const pressed = buttonPressedAt > 0;
      ctx.fillStyle = '#5b6170'; ctx.fillRect(px - 2, py + 12, T + 4, 20);
      ctx.fillStyle = '#8a92a6'; ctx.fillRect(px - 2, py + 12, T + 4, 4);
      ctx.fillStyle = '#ffd84a';                    // warning stripes
      for (let k = 0; k < 4; k++) ctx.fillRect(px + k * 9, py + 22, 5, 6);
      const top = pressed ? py + 8 : py - 10 + Math.sin(now * 5) * 1.5;
      ctx.fillStyle = '#b3141b'; ctx.beginPath(); ctx.ellipse(px + T / 2, py + 12, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e8262e'; ctx.beginPath(); ctx.moveTo(px, py + 12);
      ctx.quadraticCurveTo(px + T / 2, top - 8, px + T, py + 12); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(px + 10, (top + py + 12) / 2, 4, 2.5, -0.5, 0, Math.PI * 2); ctx.fill();
    } else if (c === 'G') {
      // the gate slides into the ground once the boss is beaten
      const open = boss && boss.dead ? Math.min(1, boss.dead / 1.2) : 0;
      if (open < 1) {
        ctx.save(); ctx.beginPath(); ctx.rect(px, py, T, T); ctx.clip();
        const oy = open * T * 8;
        ctx.fillStyle = '#4a5368'; ctx.fillRect(px, py + oy, T, T);
        ctx.fillStyle = '#7b879f'; ctx.fillRect(px + 4, py + oy, 6, T); ctx.fillRect(px + 20, py + oy, 6, T);
        ctx.restore();
      }
    }
  }
  for (const m of movers) {
    ctx.fillStyle = '#6d7fa8'; ctx.fillRect(m.x, m.y, m.w, m.h);
    ctx.fillStyle = '#a9b8da'; ctx.fillRect(m.x, m.y, m.w, 4);
  }
  // coins
  for (const c of coins) if (!c.taken) {
    const cw = Math.abs(Math.cos(now * 4 + c.x * 0.05)) * 9 + 1;
    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.ellipse(c.x, c.y + Math.sin(now * 3 + c.x) * 2, cw, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8a91e'; ctx.fillRect(c.x - 1, c.y - 5, 2, 10);
  }
  // flag
  ctx.fillStyle = '#eee'; ctx.fillRect(flag.x, flag.y, 4, flag.h);
  ctx.fillStyle = '#ff4f6d';
  ctx.beginPath(); ctx.moveTo(flag.x + 4, flag.y + 2);
  ctx.lineTo(flag.x + 34 + Math.sin(now * 6) * 3, flag.y + 14); ctx.lineTo(flag.x + 4, flag.y + 26); ctx.fill();

  for (const e of enemies) drawEnemy(e);
  if (boss && (!boss.dead || boss.dead < 0.5)) drawBoss(boss);
  for (const s of shots) {
    ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(s.x, s.y, 4.5, 0, Math.PI * 2); ctx.fill();
  }
  if (state !== 'dead' && state !== 'gameover') drawPlayer(player);
  // red button explosion: fireball and shock wave
  const boomT = now - buttonPressedAt;
  if (boomAt && boomT < 1.2) {
    ctx.globalAlpha = Math.max(0, 1 - boomT / 1.2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 10 * (1 - boomT / 1.2) + 2;
    ctx.beginPath(); ctx.arc(boomAt.x, boomAt.y, 30 + boomT * 520, 0, Math.PI * 2); ctx.stroke();
    if (boomT < 0.5) {
      const r = 40 + boomT * 220;
      const fg = ctx.createRadialGradient(boomAt.x, boomAt.y, 0, boomAt.x, boomAt.y, r);
      fg.addColorStop(0, '#fff7c2'); fg.addColorStop(0.4, '#ffb01f'); fg.addColorStop(1, 'rgba(255,59,47,0)');
      ctx.globalAlpha = 1 - boomT / 0.5; ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(boomAt.x, boomAt.y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / 0.6); ctx.fillStyle = p.color; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(W - 340, 10, 330, 34);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`${levelIndex + 1}. ${L.name}`, W - 330, 27);
  ctx.textAlign = 'right';
  ctx.fillText(`● ${player.coins}/${coins.length}   ${levelTime.toFixed(1)}s`, W - 20, 27);
  // lives
  for (let i = 0; i < START_LIVES; i++) heart(W - 30 - i * 30, 62, i < lives);
  if (boss && boss.mode !== 'sleep' && !boss.dead) drawBossBar(boss);
  if (boss && boss.dead && boss.dead < 2.5) {
    ctx.textAlign = 'center'; ctx.font = 'bold 34px system-ui'; ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 5;
    ctx.strokeText(`${boss.name} defeated! The gate is open`, W / 2, 110); ctx.fillText(`${boss.name} defeated! The gate is open`, W / 2, 110);
  }

  // white flash right after the red button
  if (boomAt && now - buttonPressedAt < 0.25) { ctx.fillStyle = `rgba(255,255,255,${0.8 * (1 - (now - buttonPressedAt) / 0.25)})`; ctx.fillRect(0, 0, W, H); }

  // sound indicator
  ctx.textAlign = 'right'; ctx.font = 'bold 13px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(Sound.muted ? 'Sound off · M' : 'Sound on · M', W - 14, H - 14);

  if (state === 'clear') banner('Level clear!', `${player.coins}/${coins.length} coins · ${levelTime.toFixed(1)}s`, 'Press Space for the next level');
  if (state === 'gameover') banner('GAME OVER', gameOverReason, 'Press Space to try again');
  if (state === 'won') banner('You made it to the top! 🏁', `${totalCoins} coins in total · ${deaths} falls`, 'Press Space to play again');
}

/* ---------------------------------------------------------------- background
   Parallax layers, far to near: sun, two mountain ranges with snow caps,
   rolling hills, and two rows of trees. Shapes come from a fixed hash of
   their index, so the scenery is the same every time you pass it. */
const rnd = (i, seed) => { const v = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453; return v - Math.floor(v); };
const BASE = H - 92;                       // where the ground starts on screen

function drawBackground(bg, hazeColor, camX) {
  // a thin layer of haze between ranges makes far things look far away
  const haze = a => { ctx.fillStyle = hazeColor; ctx.globalAlpha = a; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; };
  // sun
  ctx.fillStyle = bg.sun; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.arc(W * 0.78, 110, 42, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(W * 0.78, 110, 62, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  mountains(camX * 0.08, 300, 1, bg.far, bg.snow, 170, 110, 0.75);
  haze(0.2);
  mountains(camX * 0.16, 230, 2, bg.near, bg.snow, 130, 80, 0.85);
  haze(0.15);
  hills(camX * 0.28, bg.hill);
  trees(camX * 0.4, 70, 3, bg.trees, bg.trunk, 0.65, BASE - 34);
  haze(0.15);
  trees(camX * 0.6, 95, 4, bg.trees, bg.trunk, 1, BASE + 4);
  haze(0.18);                              // keeps the playfield in front easy to read
}

function mountains(off, seg, seed, color, snow, minH, varH, snowAlpha) {
  const first = Math.floor(off / seg) - 1;
  for (let i = first; i < first + W / seg + 3; i++) {
    const x = i * seg - off + rnd(i, seed) * seg * 0.4;
    const h = minH + rnd(i, seed + 9) * varH, w = seg * (0.75 + rnd(i, seed + 5) * 0.4);
    const top = BASE - h;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(x - w, BASE + 10); ctx.lineTo(x - w * 0.12, top + 6); ctx.lineTo(x, top);
    ctx.lineTo(x + w * 0.15, top + 8); ctx.lineTo(x + w, BASE + 10); ctx.fill();
    // snow cap with a jagged lower edge
    const sh = h * 0.26, k = sh / h;
    ctx.fillStyle = snow; ctx.globalAlpha = snowAlpha;
    ctx.beginPath(); ctx.moveTo(x - w * 0.12 * (1 + k * 6) , top + sh); ctx.lineTo(x - w * 0.12, top + 6); ctx.lineTo(x, top);
    ctx.lineTo(x + w * 0.15, top + 8); ctx.lineTo(x + w * k * 1.2, top + sh);
    ctx.lineTo(x + w * k * 0.4, top + sh * 0.7); ctx.lineTo(x - w * k * 0.2, top + sh * 1.05); ctx.lineTo(x - w * k * 0.8, top + sh * 0.75);
    ctx.fill(); ctx.globalAlpha = 1;
  }
}

function hills(off, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) {
    const wx = x + off;
    ctx.lineTo(x, BASE - 40 - Math.sin(wx * 0.006) * 22 - Math.sin(wx * 0.017 + 1) * 10);
  }
  ctx.lineTo(W, H); ctx.fill();
}

function trees(off, spacing, seed, colors, trunk, scale, base) {
  const first = Math.floor(off / spacing) - 1;
  for (let i = first; i < first + W / spacing + 3; i++) {
    const x = i * spacing - off + (rnd(i, seed) - 0.5) * spacing * 0.6;
    const s = scale * (0.75 + rnd(i, seed + 2) * 0.55);
    const c = colors[Math.floor(rnd(i, seed + 7) * colors.length)];
    ctx.fillStyle = trunk; ctx.fillRect(x - 3 * s, base - 16 * s, 6 * s, 16 * s);
    ctx.fillStyle = c;
    if (rnd(i, seed + 4) < 0.6) {                // pine: three stacked triangles
      for (let k = 0; k < 3; k++) {
        const y = base - 14 * s - k * 18 * s, hw = (24 - k * 5) * s;
        ctx.beginPath(); ctx.moveTo(x - hw, y); ctx.lineTo(x, y - 30 * s); ctx.lineTo(x + hw, y); ctx.fill();
      }
    } else {                                     // round leafy tree
      ctx.beginPath(); ctx.arc(x, base - 38 * s, 22 * s, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x - 13 * s, base - 26 * s, 14 * s, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 13 * s, base - 26 * s, 14 * s, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawBossBar(b) {
  const bw = 360, bx = W / 2 - bw / 2, by = 62;
  ctx.textAlign = 'center'; ctx.font = 'bold 18px system-ui'; ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 4;
  ctx.strokeText(b.name, W / 2, by - 14); ctx.fillText(b.name, W / 2, by - 14);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(bx - 3, by - 3, bw + 6, 20);
  for (let i = 0; i < b.maxHp; i++) {
    const seg = bw / b.maxHp;
    ctx.fillStyle = i < b.hp ? '#ff4f6d' : 'rgba(255,255,255,.15)';
    ctx.fillRect(bx + i * seg + 2, by, seg - 4, 14);
  }
}

/* Enemies and bosses are drawn at their unscaled sprite size around their
   bottom centre, then scaled up to fill their (bigger) hitbox. */
function drawScaled(e, scale, drawFn) {
  ctx.save();
  ctx.translate(e.x + e.w / 2, e.y + e.h);
  ctx.scale(scale, scale);
  drawFn({ ...e, x: -e.w0 / 2, y: -e.h0, w: e.w0, h: e.h0 });
  ctx.restore();
}
const drawEnemy = e => drawScaled(e, ENEMY_SCALE, drawEnemySprite);
const drawBoss = b => drawScaled(b, BOSS_SCALE, drawBossSprite);

function drawEnemySprite(e) {
  const squash = e.dead ? 0.3 : 1;
  ctx.save();
  if (e.dead) ctx.globalAlpha = 1 - e.dead / 0.4;
  if (e.type === 'slime' || e.type === 'hopper') {
    const wob = e.dead ? 0 : Math.sin(now * 10 + e.ox) * 0.08;
    const h = e.h * (squash + wob), y = e.y + e.h - h;
    ctx.fillStyle = e.type === 'slime' ? '#6fd36a' : '#3fb8e0';
    ctx.beginPath(); ctx.roundRect(e.x, y, e.w, h, [12, 12, 3, 3]); ctx.fill();
    if (e.type === 'hopper') { ctx.fillStyle = '#2a8fb5'; ctx.fillRect(e.x - 2, e.y + e.h - 6, 8, 6); ctx.fillRect(e.x + e.w - 6, e.y + e.h - 6, 8, 6); }
    if (!e.dead) eyes(e.x + e.w / 2, y + 9, e.face);
  } else if (e.type === 'bat') {
    const flap = Math.sin(now * 18 + e.ox) * 8;
    ctx.fillStyle = '#6b4ea8';
    ctx.beginPath(); ctx.moveTo(e.x + e.w / 2, e.y + 8); ctx.lineTo(e.x - 8, e.y + flap); ctx.lineTo(e.x + 4, e.y + 14); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.x + e.w / 2, e.y + 8); ctx.lineTo(e.x + e.w + 8, e.y + flap); ctx.lineTo(e.x + e.w - 4, e.y + 14); ctx.fill();
    ctx.fillStyle = '#8a6cc8'; ctx.beginPath(); ctx.ellipse(e.x + e.w / 2, e.y + e.h / 2, 11, e.h / 2 * squash, 0, 0, Math.PI * 2); ctx.fill();
    if (!e.dead) eyes(e.x + e.w / 2, e.y + 6, e.face, '#ffe066');
  } else if (e.type === 'beetle') {
    const cxm = e.x + e.w / 2, base = e.y + e.h;
    ctx.fillStyle = '#c23b3b';
    for (let k = 0; k < 4; k++) {           // spikes on the shell: don't stomp!
      const sx = e.x + 4 + k * 8;
      ctx.beginPath(); ctx.moveTo(sx, base - 14); ctx.lineTo(sx + 4, e.y - 6); ctx.lineTo(sx + 8, base - 14); ctx.fill();
    }
    ctx.fillStyle = '#7a2b4a'; ctx.beginPath(); ctx.ellipse(cxm, base - 8, e.w / 2, 14, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(e.x, base - 8, e.w, 4);
    ctx.fillStyle = '#2b1a24'; ctx.fillRect(e.x + 4 + Math.sin(now * 16) * 2, base - 4, 5, 4); ctx.fillRect(e.x + e.w - 9 - Math.sin(now * 16) * 2, base - 4, 5, 4);
    eyes(cxm + e.face * 10, base - 12, e.face);
  }
  ctx.restore();
}

function eyes(x, y, face, white = '#fff') {
  const ex = face * 3;
  ctx.fillStyle = white; ctx.fillRect(x - 8 + ex, y - 4, 6, 7); ctx.fillRect(x + 2 + ex, y - 4, 6, 7);
  ctx.fillStyle = '#123'; ctx.fillRect(x - 6 + ex + face, y - 2, 3, 4); ctx.fillRect(x + 4 + ex + face, y - 2, 3, 4);
}

function drawBossSprite(b) {
  ctx.save();
  if (b.dead) ctx.globalAlpha = 1 - b.dead / 0.5;
  if (b.inv > 0 && Math.floor(now * 16) % 2) ctx.globalAlpha = 0.35;
  const cx = b.x + b.w / 2, base = b.y + b.h;
  if (b.type === 'king' || b.type === 'queen') {
    const wob = Math.sin(now * 6) * 0.05 + (b.onGround ? 0 : -0.08);
    const h = b.h * (1 + wob), w = b.w * (1 - wob);
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.roundRect(cx - w / 2, base - h, w, h, [36, 36, 8, 8]); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(cx - w * 0.22, base - h * 0.72, 9, 14, -0.4, 0, Math.PI * 2); ctx.fill();
    // face
    const ex = b.face * 8, ey = base - h * 0.55;
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - 22 + ex, ey - 9, 14, 16); ctx.fillRect(cx + 8 + ex, ey - 9, 14, 16);
    ctx.fillStyle = '#1a1030'; ctx.fillRect(cx - 17 + ex + b.face * 2, ey - 4, 7, 9); ctx.fillRect(cx + 13 + ex + b.face * 2, ey - 4, 7, 9);
    ctx.fillStyle = '#1a1030'; ctx.fillRect(cx - 24 + ex, ey - 14, 16, 4); ctx.fillRect(cx + 8 + ex, ey - 14, 16, 4); // angry brows
    ctx.fillStyle = '#2a1030'; ctx.fillRect(cx - 10 + ex, ey + 14, 20, 5);
    // crown / tiara
    const top = base - h - 2;
    ctx.fillStyle = '#ffd84a';
    ctx.beginPath(); ctx.moveTo(cx - 24, top + 6); ctx.lineTo(cx - 24, top - 16); ctx.lineTo(cx - 12, top - 4); ctx.lineTo(cx, top - 20);
    ctx.lineTo(cx + 12, top - 4); ctx.lineTo(cx + 24, top - 16); ctx.lineTo(cx + 24, top + 6); ctx.fill();
    ctx.fillStyle = b.type === 'queen' ? '#5ad1ff' : '#ff4f6d'; ctx.beginPath(); ctx.arc(cx, top - 4, 4, 0, Math.PI * 2); ctx.fill();
  } else if (b.type === 'beetle') {
    const dizzy = b.mode === 'dizzy';
    const shakeX = b.mode === 'aim' ? Math.sin(now * 60) * 2 : 0;
    ctx.translate(cx + shakeX, base - b.h / 2 - (dizzy ? 12 : 0));
    if (dizzy) ctx.scale(1, -1);                 // flipped on its back
    ctx.scale(b.face, 1);
    // spikes (only dangerous when not dizzy)
    ctx.fillStyle = '#c23b3b';
    for (let k = -3; k <= 3; k++) {
      ctx.beginPath(); ctx.moveTo(k * 12 - 6, -b.h / 2 + 12); ctx.lineTo(k * 12, -b.h / 2 - 14); ctx.lineTo(k * 12 + 6, -b.h / 2 + 12); ctx.fill();
    }
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.ellipse(0, 6, b.w / 2, b.h / 2 + 4, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(-b.w / 2, 4, b.w, 8);
    ctx.fillStyle = '#2b1a24';
    for (let k = -1; k <= 1; k++) ctx.fillRect(k * 26 - 4 + Math.sin(now * 20 + k) * (b.mode === 'charge' ? 4 : 1), 12, 8, 12);
    // head with horn
    ctx.fillStyle = '#3d2a5e'; ctx.beginPath(); ctx.arc(b.w / 2 - 6, 2, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8e0c8'; ctx.beginPath(); ctx.moveTo(b.w / 2 + 4, -4); ctx.lineTo(b.w / 2 + 26, -14); ctx.lineTo(b.w / 2 + 8, 6); ctx.fill();
    ctx.fillStyle = b.mode === 'charge' ? '#ff4f4f' : '#fff'; ctx.fillRect(b.w / 2 - 2, -6, 7, 7);
    ctx.restore(); ctx.save();                    // back to world coordinates
    if (dizzy) {                                  // stars over a dizzy beetle
      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center';
      for (let k = 0; k < 3; k++) {
        const a = now * 5 + k * 2.1;
        ctx.fillText('★', cx + Math.cos(a) * 30, b.y - 6 + Math.sin(a) * 8);
      }
    }
  }
  ctx.restore();
}

function drawPlayer(p) {
  const run = Math.abs(p.vx) > 20 && p.onGround ? Math.sin(now * 20) : 0;
  ctx.save();
  ctx.translate(p.x + p.w / 2, p.y + p.h);
  ctx.scale(p.face * PLAYER_SCALE, PLAYER_SCALE);
  // legs
  ctx.fillStyle = '#2b3a67';
  ctx.fillRect(-8 + run * 3, -9, 6, 9); ctx.fillRect(2 - run * 3, -9, 6, 9);
  // body
  ctx.fillStyle = '#ff7a3d'; ctx.beginPath(); ctx.roundRect(-10, -24, 20, 17, 5); ctx.fill();
  // head + eye
  ctx.fillStyle = '#ffd9b3'; ctx.beginPath(); ctx.arc(1, -26, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222'; ctx.fillRect(4, -28, 2.5, 3);
  // cap
  ctx.fillStyle = '#3a7bd5'; ctx.fillRect(-7, -33, 15, 5); ctx.fillRect(2, -30, 9, 3);
  ctx.restore();
}

function banner(title, sub, hint) {
  ctx.fillStyle = 'rgba(10,15,35,.6)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px system-ui'; ctx.fillText(title, W / 2, H / 2 - 40);
  ctx.font = '22px system-ui'; ctx.fillText(sub, W / 2, H / 2 + 10);
  ctx.globalAlpha = 0.6 + Math.sin(now * 4) * 0.4;
  ctx.font = 'bold 18px system-ui'; ctx.fillText(hint, W / 2, H / 2 + 60);
  ctx.globalAlpha = 1;
}

function heart(x, y, full) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = full ? '#ff4f6d' : 'rgba(0,0,0,.3)';
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 9);
  ctx.bezierCurveTo(-14, -1, -8, -12, 0, -4); ctx.bezierCurveTo(8, -12, 14, -1, 0, 9);
  ctx.fill(); ctx.stroke(); ctx.restore();
}

function drawTitle() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1d2b55'; ctx.font = 'bold 72px system-ui'; ctx.fillText('Hop Hop Hill', W / 2, H / 2 - 110);
  ctx.font = '21px system-ui';
  ctx.fillText('Run, jump, grab the coins and stomp the enemies. Jump over the spiky beetles!', W / 2, H / 2 - 40);
  ctx.fillText('Beat the boss to open the gate to the flag. You have 3 lives.', W / 2, H / 2 - 10);
  ctx.fillStyle = '#c1121f'; ctx.font = 'bold 21px system-ui';
  ctx.fillText('Whatever you do: never jump on the red button.', W / 2, H / 2 + 52);
  ctx.fillStyle = '#1d2b55'; ctx.font = '21px system-ui';
  ctx.fillText('← → / A D to run  ·  Space / ↑ to jump (hold to jump higher)  ·  R to restart  ·  M mute', W / 2, H / 2 + 22);
  ctx.globalAlpha = 0.6 + Math.sin(now * 4) * 0.4;
  ctx.font = 'bold 26px system-ui'; ctx.fillText('Press Space or tap to start', W / 2, H / 2 + 100);
  ctx.globalAlpha = 1;
  drawPlayer({ x: W / 2 - PW / 2, y: H / 2 + 190 - PH + Math.min(0, Math.sin(now * 5) * 30), w: PW, h: PH, vx: 0, onGround: false, face: 1 });
}

/* ---------------------------------------------------------------- loop */
let last = performance.now();
function frame(t) {
  const dt = Math.max(0, Math.min(0.033, (t - last) / 1000)); last = t; now += dt;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
