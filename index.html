    const bw = 230, bx = W - bw - 22, by = 40;
    ctx.fillStyle = 'rgba(14,22,44,.7)'; rr(ctx, bx - 10, by - 28, bw + 20, 50, 14); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(ctx, bx, by, bw, 9, 4); ctx.fill();
    ctx.fillStyle = E.p.name ? '#ff3b3b' : E.col.jersey; rr(ctx, bx, by, Math.max(0, bw * E.hp / E.maxHp), 9, 4); ctx.fill();
    ctx.font = `900 13px ${FONT}`; ctx.fillStyle = '#eaf4ff';
    ctx.fillText(`${E.p.name || E.p.label}  ·  KOs ${this.kos}/${ROSTER.length}`, bx + bw / 2, by - 13);
    // your stamina
    const sw = 170, sx = W / 2 - sw / 2, sy = H - 22;
    ctx.fillStyle = 'rgba(14,22,44,.6)'; rr(ctx, sx - 4, sy - 4, sw + 8, 14, 7); ctx.fill();
    ctx.fillStyle = this.stamina < FP.PUNCH_COST ? '#ff5a5a' : '#8ecae6'; rr(ctx, sx, sy, sw * this.stamina / 100, 6, 3); ctx.fill();
    ctx.font = `900 11px ${FONT}`; ctx.fillStyle = '#13223f'; ctx.fillText('STAMINA', W / 2, sy - 12);
    // controls
    if (this.touch) {
      ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#13223f'; ctx.lineWidth = 3;
      for (const s of SIDES) {
        const x = s === 'L' ? 54 : W - 54;
        for (const [y, t] of [[H * 0.42, 'PUNCH'], [H * 0.8, 'BLOCK']]) {
          ctx.beginPath(); ctx.arc(x, y, 38, 0, TAU); ctx.fill(); ctx.stroke();
          ctx.globalAlpha = 0.8; ctx.fillStyle = '#13223f'; ctx.font = `900 12px ${FONT}`; ctx.fillText(t, x, y);
          ctx.globalAlpha = 0.28; ctx.fillStyle = '#ffffff';
        }
      }
      ctx.restore();
    } else {
      ctx.font = `800 13px ${FONT}`; ctx.fillStyle = 'rgba(19,34,63,.75)';
      ctx.fillText('Q punch · A block', 90, H - 16);
      ctx.fillText('D block · E punch', W - 90, H - 16);
    }
  }
  draw(ctx) {
    const { W, H } = this.v;
    ctx.save();
    if (this.fall > 0) { ctx.translate(W / 2, H); ctx.rotate(this.fall * 0.5); ctx.translate(-W / 2, -H + this.fall * 60); }
    if (this.shake > 0) ctx.translate(rand(-1, 1) * this.shake * 9, rand(-1, 1) * this.shake * 6);
    this.drawArena(ctx);
    this.drawRival(ctx);
    this.drawTell(ctx);
    if (this.state !== 'dying' && this.state !== 'done') this.drawHands(ctx);
    ctx.restore();
    if (this.flash > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
      g.addColorStop(0, 'rgba(255,40,40,0)'); g.addColorStop(1, `rgba(255,40,40,${0.5 * this.flash})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (this.fall > 0) { ctx.fillStyle = `rgba(10,14,30,${this.fall * 0.45})`; ctx.fillRect(0, 0, W, H); }
    if (this.state === 'running' || this.state === 'countdown') this.drawUI(ctx);
    if (this.state === 'countdown') {
      const n = Math.max(1, Math.ceil(this.cd)), f = this.cd - Math.floor(this.cd);
      const sc = 1 + (f > 0.7 ? (f - 0.7) / 0.3 * 0.6 : 0);
      ctx.save(); ctx.translate(W / 2, H * 0.34); ctx.scale(sc, sc);
      ctx.font = `900 96px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 10; ctx.strokeStyle = '#13223f'; ctx.strokeText(String(n), 0, 0);
      ctx.fillStyle = '#ffcf4a'; ctx.fillText(String(n), 0, 0);
      ctx.restore();
    }
    drawTexts(ctx, this.texts);
  }
}

/* =====================================================================
   GAME LIST — add Game 3 here later by replacing the locked entry
   ===================================================================== */
const GAMES = [
  {
    id: 'jet', name: 'Jet Escape', icon: '✈️', overTitle: 'Shot down!',
    art: 'linear-gradient(180deg,#5ec4ff 0%,#bfe9ff 55%,#ffd08a 100%)',
    desc: 'Keep your fighter jet in the air and dodge the incoming missiles.',
    howTo: 'Tap to boost your jet upward. Dodge the missiles and stay away from the sea and the top edge.',
    targetTime: 60,
    theme: { hudBg: 'rgba(8,37,77,.5)', hudInk: '#ffffff', panelBg: 'linear-gradient(165deg,#f2faff,#c6e6ff)', panelInk: '#0b2a4a', panelEdge: '#ffffff', accent: '#ff7a45', accentInk: '#ffffff' },
    create: v => new JetEscape(v)
  },
  {
    id: 'brawl', name: 'Ice Brawl', icon: '🏒', overTitle: 'Down on the ice!', meterLabel: 'Balance',
    art: 'linear-gradient(180deg,#1b2440 0%,#2a3456 50%,#dcefff 50%,#f4faff 100%)',
    desc: 'Gloves off, 1v1 on the ice. Duck the punches and stay on your skates.',
    howTo: 'When a red ! appears over your opponent, tap to duck and counter. Tapping at the wrong time makes you wobble and lose balance.',
    targetTime: 60,
    theme: { hudBg: 'rgba(14,22,44,.62)', hudInk: '#eaf4ff', panelBg: 'linear-gradient(165deg,#ffffff,#dcecf8)', panelInk: '#13223f', panelEdge: '#e63946', accent: '#e63946', accentInk: '#ffffff' },
    create: v => new IceBrawl(v)
  },
  {
    // Game 3 is a separate two-player page, so the card just links to it
    // (it is not part of the survival score or "Play all games").
    id: 'squirrels', name: 'Slapshot Squirrels', icon: '🐿️', href: 'slapshot-squirrels.html',
    art: 'linear-gradient(180deg,#5fb3ea 0%,#d6efff 62%,#2f7fcf 62%,#16407a 100%)',
    desc: 'Two-player artillery: slap exploding pucks at your rival across the water. Never touch the red button.'
  },
  {
    id: 'brawlpro', name: 'Ice Brawl Pro', icon: '🥊', overTitle: 'Down on the ice!', meterLabel: 'Balance',
    art: 'linear-gradient(180deg,#2a0f1c 0%,#56202f 50%,#dcefff 50%,#f4faff 100%)',
    desc: 'The real fight. Time your ducks to the last moment, read fakes, counter and knock the bot down.',
    howTo: 'Tap to duck right before a punch lands: yellow ! is a fast jab, red ! a haymaker or a fake. Duck at the last moment for a PERFECT. After a dodge, tap again to counter. Knock the bot down to heal.',
    targetTime: 60,
    theme: { hudBg: 'rgba(40,12,24,.66)', hudInk: '#ffeef2', panelBg: 'linear-gradient(165deg,#ffffff,#f6dde3)', panelInk: '#2a0f1c', panelEdge: '#ffcf4a', accent: '#c1121f', accentInk: '#ffffff' },
    create: v => new IceBrawlPro(v)
  },
  {
    id: 'brawlfp', name: 'Ice Brawl: Face-Off', icon: '👊', overTitle: 'Down on the ice!', meterLabel: 'Balance',
    art: 'radial-gradient(circle at 50% 38%,#e63946 0 22%,transparent 23%),linear-gradient(180deg,#1b2440 0%,#2a3456 55%,#dcefff 55%,#f4faff 100%)',
    desc: 'First-person hockey fight. Punch and block with each hand, knock out your rival, then Trump and Kim Jong Un.',
    howTo: '<b>Q</b>/<b>E</b> punch, hold <b>A</b>/<b>D</b> to block (touch: top half punches, bottom half blocks). Block the side the punch comes from just before it lands for a <b>PERFECT</b> and a free counter. Long blocks get weak. Beat your rival, then the final boss and the final final boss. Each knockout adds <b>+10s</b>.',
    targetTime: 60,
    theme: { hudBg: 'rgba(14,22,44,.62)', hudInk: '#eaf4ff', panelBg: 'linear-gradient(165deg,#ffffff,#dcecf8)', panelInk: '#13223f', panelEdge: '#2f6fe0', accent: '#2f6fe0', accentInk: '#ffffff' },
    create: v => new IceBrawlFP(v)
  },
  {
    // Game 6 is a separate platformer page, linked like Slapshot Squirrels
    id: 'hophop', name: 'Hop Hop Hill', icon: '🏃', href: 'platformer.html', tag: '1 player · Opens the game',
    art: 'linear-gradient(180deg,#7fd3ff 0%,#d9f3ff 60%,#4fbf4a 60%,#8a5a34 100%)',
    desc: 'A simple platformer: run, jump, stomp enemies and beat a boss at the end of each of the three levels.'
  }
];
const available = () => GAMES.filter(g => !g.locked && !g.href);   // games that use the shared survival framework

/* =====================================================================
   FRAMEWORK — hub, shared HUD, overlays, input, scoring
   ===================================================================== */
const $ = id => document.getElementById(id);
const canvas = $('stage'), ctx = canvas.getContext('2d');
const hubEl = $('hub'), resultsEl = $('results'), overlay = $('overlay'), panel = $('panel'), hud = $('hud');
const timerEl = $('timer'), meterEl = $('meter'), meterFill = $('meterFill'), meterLabel = $('meterLabel');
const view = { W: 640, H: 480 };
const best = {};                         // best score per game, kept for this session only
let mode = 'hub', phase = '', cur = null, curDef = null, paused = false, playAll = null, overlayAt = 0;

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), sw = window.innerWidth, sh = window.innerHeight;
  canvas.width = Math.round(sw * dpr); canvas.height = Math.round(sh * dpr);
  const s = Math.min(sw / 640, sh / 480);   // keep at least a 640x480 play area, extend on longer screens
  view.W = sw / s; view.H = sh / s;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
}
window.addEventListener('resize', resize); resize();

const show = el => el.classList.remove('off');
const hide = el => el.classList.add('off');
const runTime = g => g.time + (g.bonus || 0);   // a game may add bonus seconds (Face-Off: knockouts)
const scoreFor = (def, time) => Math.min(100, Math.round(time / def.targetTime * 100));
const overallScore = () => { const g = available(); return Math.round(g.reduce((a, d) => a + (best[d.id] || 0), 0) / g.length); };
const message = s => s >= 90 ? 'Legendary!' : s >= 70 ? 'Impressive!' : s >= 40 ? 'Nice work!' : 'Good start!';
const hint = txt => `<div class="hint">Press <kbd>SPACE</kbd> / Tap ${txt}</div>`;

function fadeTo(fn) {
  const f = $('fade'); f.classList.add('on');
  setTimeout(() => { fn(); requestAnimationFrame(() => f.classList.remove('on')); }, 260);
}
function applyTheme(t) {
  const r = document.documentElement.style;
  r.setProperty('--hud-bg', t.hudBg); r.setProperty('--hud-ink', t.hudInk);
  r.setProperty('--panel-bg', t.panelBg); r.setProperty('--panel-ink', t.panelInk); r.setProperty('--panel-edge', t.panelEdge);
  r.setProperty('--accent', t.accent); r.setProperty('--accent-ink', t.accentInk);
}

function renderHub() {
  const cards = $('cards'); cards.innerHTML = '';
  GAMES.forEach((g, i) => {
    const b = document.createElement('button');
    b.className = 'card' + (g.locked ? ' locked' : '');
    b.style.setProperty('--art', g.art);
    const sc = best[g.id] || 0;
    b.innerHTML = `<div class="art">${g.icon}</div><div class="body"><span class="num">Game ${i + 1}</span><h3>${g.name}</h3><p>${g.desc}</p>` +
      (g.href ? `<div class="best"><span>${g.tag || '2 players · Opens the game'}</span></div>` :
       g.locked ? `<div class="best">Locked</div>` :
        `<div class="best"><span>Best</span><div class="bar"><i style="width:${sc}%"></i></div><span>${sc}/100</span></div>`) + `</div>`;
    if (g.locked) b.setAttribute('aria-disabled', 'true');
    else if (g.href) b.addEventListener('click', () => { window.location.href = g.href; });
    else b.addEventListener('click', () => { playAll = null; startGame(g); });
    cards.appendChild(b);
  });
  const o = overallScore();
  $('hubScore').textContent = o; $('hubRing').style.setProperty('--v', o);
  const played = available().filter(g => best[g.id] !== undefined).length;
  $('hubSub').textContent = played ? `${message(o)} Average of your best runs in ${available().length} games.` : 'Play the games to fill your score up to 100.';
}

function startGame(def) {
  if (document.activeElement) document.activeElement.blur();
  fadeTo(() => {
    curDef = def; cur = def.create(view); applyTheme(def.theme);
    mode = 'game'; paused = false;
    hide(hubEl); hide(resultsEl); show(hud);
    if (def.meterLabel) { meterLabel.textContent = def.meterLabel; show(meterEl); } else hide(meterEl);
    showIntro();
  });
}
function tag() { return playAll ? `<div class="tag">Game ${playAll.idx + 1} of ${playAll.queue.length}</div>` : ''; }
function openOverlay(html) { panel.innerHTML = html; show(overlay); overlayAt = performance.now(); }
function showIntro() {
  phase = 'intro';
  openOverlay(`${tag()}<h2>${curDef.icon} ${curDef.name}</h2><p class="howto">${curDef.howTo}</p>` +
    `<p class="target">Survive ${curDef.targetTime} seconds for a perfect 100.</p>${hint('to play')}`);
}
function showGameOver() {
  phase = 'over';
  const time = runTime(cur), sc = scoreFor(curDef, time), prev = best[curDef.id];
  const isBest = prev === undefined || sc > prev;
  best[curDef.id] = Math.max(prev || 0, sc);
  if (playAll) playAll.results.push({ def: curDef, time, score: sc });
  const last = playAll && playAll.idx === playAll.queue.length - 1;
  const next = playAll ? (last ? 'to see your results' : 'for the next game') : 'to play again';
  openOverlay(`${tag()}<h2>${cur.overTitle || curDef.overTitle}</h2><p class="howto">${cur.overText || `You survived <b>${cur.time.toFixed(1)} seconds</b>${cur.bonus ? ` + <b>${cur.bonus}s</b> knockout bonus` : ''}.`}</p>` +
    `<div class="score">${sc}<span>/100</span></div><p class="target">${isBest && sc > 0 ? 'New best score!' : `Your best: ${best[curDef.id]}/100`}</p>` +
    `${hint(next)}<div class="row"><button class="link-btn" data-act="hub">Back to hub</button></div>`);
}
function setPaused(p) {
  if (phase !== 'play' || paused === p) return;
  paused = p;
  if (p && cur.releaseAll) cur.releaseAll();
  if (p) openOverlay(`<h2>Paused</h2><p class="howto">Take a breather. Your run is waiting.</p>${hint('to resume')}<div class="row"><button class="link-btn" data-act="hub">Back to hub</button></div>`);
  else hide(overlay);
}

/* The one action used by every game */
function handleAction() {
  if (mode !== 'game' || !cur) return;
  if (performance.now() - overlayAt < 350 && phase !== 'play') return;   // avoid accidental double taps
  if (paused) { setPaused(false); return; }
  if (phase === 'intro') { hide(overlay); phase = 'play'; cur.start(); }
  else if (phase === 'play') cur.action();
  else if (phase === 'over') {
    if (playAll) {
      playAll.idx++;
      if (playAll.idx < playAll.queue.length) startGame(playAll.queue[playAll.idx]);
      else showResults();
    } else { cur.reset(); hide(overlay); phase = 'play'; cur.start(); }
  }
}

function goHub() {
  fadeTo(() => {
    mode = 'hub'; cur = null; playAll = null; paused = false; phase = '';
    hide(overlay); hide(hud); hide(resultsEl); renderHub(); show(hubEl);
  });
}
function startPlayAll() { playAll = { queue: available(), idx: 0, results: [] }; startGame(playAll.queue[0]); }
function showResults() {
  const res = playAll.results;
  const total = Math.round(res.reduce((a, r) => a + r.score, 0) / res.length);
  fadeTo(() => {
    mode = 'results'; cur = null; phase = '';
    hide(overlay); hide(hud);
    $('resBox').innerHTML = `<h2>Your survival score</h2><div class="ring" style="--v:${total}"><b>${total}</b></div>` +
      `<div class="msg">${message(total)}</div><div class="res-rows">` +
      res.map(r => `<div class="res-row"><span class="ic">${r.def.icon}</span><span class="nm">${r.def.name}</span><span class="tm">${r.time.toFixed(1)}s</span><span class="sc">${r.score}</span></div>`).join('') +
      `</div><div class="actions"><button class="big-btn" data-r="again">Play all again</button><button class="ghost-btn" data-r="hub">Back to hub</button></div>`;
    show(resultsEl);
  });
}

/* ---------- input wiring ---------- */
const ownInput = () => mode === 'game' && cur && phase === 'play' && !paused;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (ownInput() && cur.pointerDown) {                 // games with several buttons get the position instead
    const r = canvas.getBoundingClientRect();
    cur.pointerDown(e.pointerId, (e.clientX - r.left) / r.width * view.W, (e.clientY - r.top) / r.height * view.H, e.pointerType === 'touch');
  } else handleAction();
});
const pointerUp = e => { if (cur && cur.pointerUp) cur.pointerUp(e.pointerId); };
window.addEventListener('pointerup', pointerUp); window.addEventListener('pointercancel', pointerUp);
overlay.addEventListener('pointerdown', e => { if (e.target.closest('[data-act]')) return; e.preventDefault(); handleAction(); });
overlay.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && b.dataset.act === 'hub') goHub(); });
window.addEventListener('keydown', e => {
  if (ownInput() && cur.keyDown && cur.keyDown(e.code, e.repeat)) { e.preventDefault(); return; }
  if (e.code !== 'Space' && e.key !== ' ') return;
  if (mode !== 'game') return;
  e.preventDefault();
  if (!e.repeat) handleAction();
});
window.addEventListener('keyup', e => { if (mode === 'game' && cur && cur.keyUp) cur.keyUp(e.code); if ((e.code === 'Space' || e.key === ' ') && mode === 'game') e.preventDefault(); });
$('btnHub').addEventListener('click', e => { e.currentTarget.blur(); goHub(); });
$('btnPause').addEventListener('click', e => { e.currentTarget.blur(); setPaused(!paused); });
$('btnPlayAll').addEventListener('click', startPlayAll);
$('resBox').addEventListener('click', e => {
  const b = e.target.closest('[data-r]'); if (!b) return;
  if (b.dataset.r === 'again') startPlayAll(); else goHub();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
window.addEventListener('blur', () => setPaused(true));

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (mode === 'game' && cur) {
    if (!paused) cur.update(dt);
    cur.draw(ctx);
    timerEl.textContent = runTime(cur).toFixed(1) + 's';
    if (curDef.meterLabel && cur.meter !== undefined) {
      const m = clamp(cur.meter, 0, 1);
      meterFill.style.width = (m * 100) + '%';
      meterFill.style.backgroundColor = m > 0.5 ? '#5ee6b0' : m > 0.25 ? '#ffd25a' : '#ff5a5a';
    }
    if (phase === 'play' && cur.state === 'done') showGameOver();
  }
  requestAnimationFrame(frame);
}
renderHub();
requestAnimationFrame(frame);
})();
</script>
