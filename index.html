<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e0f3a">
<title>Survival Hub</title>
<!--
  SURVIVAL HUB — Team 2's main page (published at vibe-jam-2026.github.io/team-2).
  -----------------------------------------------------------------------------
  * Self-contained apart from lib/three.min.js (three.js, used by Jet Escape 3D). Nothing loads from other sites.
  * All JavaScript lives inside one private function scope, so it creates no global variables.
  * Uses no localStorage/cookies; best scores last for the session only.

  GAME 3 (Slapshot Squirrels) is its own page, slapshot-squirrels.html; its card in the GAMES list
  links there (href) and is left out of the survival score and "Play all games".
  GAME 4 (Ice Brawl: Face-Off) is first person with two hands. Games may optionally take their own input
  (keyDown/keyUp/pointerDown/pointerUp/releaseAll). A game marked winOnly has no timer or score: it is won or lost
  (set .won), and it is left out of the overall score and "Play all".
  To add a framework game instead: write a class with the same shape as JetEscape / IceBrawl
  (reset, start, action, update, draw, plus .time and .state) and add it to the GAMES list.
-->
<style>
:root{
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --plum-1:#1e0f3a; --plum-2:#35196b; --ink:#fff6ea; --muted:#c7b8ec;
  --card:#2a1752; --edge:#4c3296; --bulb:#ffd25a; --pink:#ff6fae; --mint:#5ee6b0;
  /* per-game theme, set from JavaScript when a game starts */
  --hud-bg:rgba(0,0,0,.45); --hud-ink:#fff; --panel-bg:#fff; --panel-ink:#111;
  --panel-edge:#fff; --accent:#ffd25a; --accent-ink:#2a1300;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--plum-1);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--bulb);outline-offset:3px}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
#stage3d{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:0}  /* Jet Escape 3D renders here, under the 2D canvas */
.layer{position:fixed;inset:0;transition:opacity .3s ease,visibility .3s}
.off{opacity:0;visibility:hidden;pointer-events:none}

/* ---------- Hub (arcade lobby) ---------- */
#hub,#results{overflow-y:auto;z-index:4;
  background:radial-gradient(70% 50% at 50% 0%,rgba(160,90,255,.42),transparent 70%),
             linear-gradient(180deg,var(--plum-2),var(--plum-1) 75%);
  padding:calc(env(safe-area-inset-top,0px) + 26px) 18px calc(env(safe-area-inset-bottom,0px) + 30px)}
.floor{position:fixed;left:-50%;right:-50%;bottom:-2px;height:40vh;pointer-events:none;
  background-image:linear-gradient(rgba(255,111,174,.4) 2px,transparent 2px),linear-gradient(90deg,rgba(255,111,174,.4) 2px,transparent 2px);
  background-size:64px 64px;transform:perspective(260px) rotateX(62deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%);
  animation:floor 2.6s linear infinite}
@keyframes floor{to{background-position:0 64px,0 0}}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:24px}

/* the one bold element: a marquee sign with light bulbs */
.marquee{position:relative;padding:22px 34px 20px;border-radius:20px;background:#2b1258;
  border:4px solid #ff9f43;box-shadow:0 0 0 6px #2b1258,0 0 40px rgba(255,159,67,.35);text-align:center}
.marquee .bulbs{position:absolute;inset:-4px;border-radius:20px;pointer-events:none;
  background:radial-gradient(circle,var(--bulb) 0 3.5px,transparent 4.5px) 0 0/22px 22px;
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);padding:8px;animation:chase 1.1s steps(2) infinite}
@keyframes chase{50%{background-position:11px 11px}}
.marquee h1{font-size:clamp(2.3rem,7.5vw,4.2rem);font-weight:900;line-height:1;letter-spacing:.02em;color:var(--bulb);
  text-shadow:0 0 16px rgba(255,210,90,.5),0 4px 0 #b4532a}
.marquee p{margin-top:10px;color:var(--muted);font-size:1.05rem}

.overall{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  padding:10px 24px 10px 10px;border-radius:999px}
.ring{--v:0;width:76px;height:76px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--mint) calc(var(--v)*1%),rgba(255,255,255,.12) 0);transition:--v .6s}
.ring b{width:60px;height:60px;border-radius:50%;background:var(--plum-2);display:grid;place-items:center;font-size:1.55rem;font-weight:900}
.overall .lbl{font-size:1.1rem;font-weight:800}
.overall .sub{color:var(--muted);font-size:.9rem;margin-top:2px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;width:100%}
.card{text-align:left;border-radius:22px;overflow:hidden;background:var(--card);border:2px solid var(--edge);
  box-shadow:0 8px 0 rgba(0,0,0,.28);display:flex;flex-direction:column;transition:transform .15s ease,border-color .15s ease}
.card:not(.locked):hover{transform:translateY(-4px);border-color:var(--bulb)}
.card .art{height:118px;display:grid;place-items:center;font-size:3.4rem;background:var(--art)}
/* cards with a real snapshot from the game */
.card .art.shot{height:150px;position:relative;overflow:hidden;display:block}
.card .art.shot img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.card .art.shot::after{content:'';position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,var(--card));pointer-events:none}
.card .art.shot .badge{position:absolute;left:10px;top:10px;z-index:1;font-size:1.25rem;line-height:1;padding:6px 8px;border-radius:12px;background:rgba(20,10,40,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.card:not(.locked):hover .art.shot img{transform:scale(1.07)}
@media (prefers-reduced-motion:reduce){.card .art.shot img{transition:none}}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .num{font-size:.85rem;color:var(--muted);font-weight:700}
.card h3{font-size:1.4rem;font-weight:900}
.card p{color:var(--muted);font-size:.95rem;line-height:1.38;flex:1}
.best{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:800;margin-top:6px}
.best .bar{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.best .bar i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .6s ease}
.card.locked{cursor:default;border-style:dashed;opacity:.62}
.card.locked .art{filter:grayscale(1) brightness(.8)}

.big-btn{background:var(--bulb);color:#2a1300;font-weight:900;font-size:1.2rem;padding:14px 36px;border-radius:999px;
  box-shadow:0 6px 0 #b4532a;transition:transform .08s,box-shadow .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b4532a}
.ghost-btn{font-weight:800;padding:12px 24px;border-radius:999px;border:2px solid rgba(255,255,255,.3)}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:.95rem}
kbd{font:inherit;font-weight:800;font-size:.82rem;padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.14);
  border-bottom:3px solid rgba(0,0,0,.3);color:inherit}

/* ---------- In-game HUD (same layout in every game) ---------- */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
.hud-left{display:flex;gap:8px;pointer-events:auto}
.pill{background:var(--hud-bg);color:var(--hud-ink);border:1px solid rgba(255,255,255,.2);border-radius:999px;
  padding:9px 15px;font-weight:800;font-size:.95rem;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#timerBox{display:flex;flex-direction:column;align-items:center;gap:6px}
#timer{font-size:1.45rem;font-variant-numeric:tabular-nums;min-width:112px;text-align:center}
#meter{display:flex;align-items:center;gap:9px;padding:6px 13px;font-size:.8rem}
#meter .bar{width:120px;height:9px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
#meter i{display:block;height:100%;width:100%;border-radius:9px;background:var(--mint);transition:width .15s,background-color .3s}

/* ---------- Overlay panels (start / game over / pause) ---------- */
#overlay{z-index:6;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.2);cursor:pointer}
.panel{width:min(440px,100%);background:var(--panel-bg);color:var(--panel-ink);border:3px solid var(--panel-edge);
  border-radius:26px;padding:24px 24px 20px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.panel .tag{display:inline-block;font-size:.85rem;font-weight:800;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.08);margin-bottom:10px}
.panel h2{font-size:2rem;font-weight:900;line-height:1.1}
.panel .howto{margin-top:10px;font-size:1.03rem;line-height:1.42;opacity:.88}
.panel .target{margin-top:6px;font-size:.9rem;opacity:.7}
.panel .score{font-size:4.2rem;font-weight:900;line-height:1;margin-top:10px;color:var(--accent)}
.panel .score span{font-size:1.3rem;color:var(--panel-ink);opacity:.55}
.hint{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-weight:800;padding:11px 20px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);animation:breathe 1.5s ease-in-out infinite}
.hint kbd{background:rgba(255,255,255,.35);border-bottom-color:rgba(0,0,0,.2)}
@keyframes breathe{50%{transform:scale(1.05)}}
.panel .row{margin-top:12px}
.link-btn{font-weight:700;text-decoration:underline;text-underline-offset:3px;opacity:.75;padding:8px 12px}

/* ---------- Results ---------- */
#results .wrap{min-height:100%;justify-content:center}
.res{width:min(520px,100%);background:var(--card);border:2px solid var(--edge);border-radius:26px;padding:28px 24px;text-align:center}
.res h2{font-size:1.9rem;font-weight:900}
.res .ring{width:132px;height:132px;margin:18px auto 8px}
.res .ring b{width:106px;height:106px;font-size:2.7rem}
.res .msg{font-size:1.3rem;font-weight:900;color:var(--bulb)}
.res-rows{margin:18px 0 22px;display:flex;flex-direction:column;gap:10px}
.res-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:rgba(255,255,255,.06);
  border-radius:14px;padding:10px 14px;text-align:left}
.res-row .ic{font-size:1.5rem}
.res-row .nm{font-weight:800}
.res-row .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.res-row .sc{font-weight:900;font-size:1.15rem;font-variant-numeric:tabular-nums}
.res .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

#fade{position:fixed;inset:0;background:#000;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s ease}
#fade.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  .floor,.marquee .bulbs,.hint{animation:none}
  .panel{animation:none}
}
</style>
</head>
<body>

<canvas id="stage" aria-label="Game area"></canvas>

<!-- HUD -->
<div id="hud" class="off">
  <div class="hud-left">
    <button class="pill" id="btnHub" aria-label="Back to hub">Hub</button>
    <button class="pill" id="btnPause" aria-label="Pause">❚❚</button>
  </div>
  <div id="timerBox">
    <div class="pill" id="timer">0.0s</div>
    <div class="pill off" id="meter"><span id="meterLabel">Balance</span><div class="bar"><i id="meterFill"></i></div></div>
  </div>
  <div></div>
</div>

<!-- Start / game over / pause overlay -->
<div id="overlay" class="layer off"><div class="panel" id="panel"></div></div>

<!-- Hub -->
<div id="hub" class="layer">
  <div class="floor"></div>
  <div class="wrap">
    <div class="marquee"><span class="bulbs"></span>
      <h1>Survival Hub</h1>
      <p>Five tiny games. Stay alive as long as you can.</p>
    </div>
    <div class="overall">
      <div class="ring" id="hubRing"><b id="hubScore">0</b></div>
      <div><div class="lbl">Overall score</div><div class="sub" id="hubSub">Play the games to fill your score up to 100.</div></div>
    </div>
    <div class="cards" id="cards"></div>
    <button class="big-btn" id="btnPlayAll">Play all games</button>
    <div class="controls">Every game works with <kbd>SPACE</kbd> or click or tap. Jet Escape also flies with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys.</div>
  </div>
</div>

<!-- Results after "Play all" -->
<div id="results" class="layer off">
  <div class="floor"></div>
  <div class="wrap"><div class="res" id="resBox"></div></div>
</div>

<div id="fade"></div>

<script src="lib/three.min.js"></script>
<script>
(() => {
'use strict';

/* =====================================================================
   SMALL HELPERS
   ===================================================================== */
const FONT = 'ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const ease = (cur, target, dt, k) => cur + (target - cur) * Math.min(1, dt * k);
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));   // never negative: canvas throws on a negative radius
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function line(ctx, x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function star(ctx, x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, k = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k);
  }
  ctx.closePath(); ctx.fill();
}

/* Comic pop-up words ("POW!", "POOF!") shared by all games */
function addText(arr, text, x, y, color, size = 34) {
  arr.push({ text, x, y, color, size, life: 0.9, max: 0.9, rot: rand(-0.15, 0.15) });
}
function tickTexts(arr, dt) {
  for (let i = arr.length - 1; i >= 0; i--) { arr[i].life -= dt; if (arr[i].life <= 0) arr.splice(i, 1); }
}
function drawTexts(ctx, arr) {
  for (const p of arr) {
    const a = p.life / p.max, age = 1 - a;
    const sc = age < 0.15 ? lerp(1.5, 1, age / 0.15) : 1;
    ctx.save();
    ctx.translate(p.x, p.y - age * 24); ctx.rotate(p.rot); ctx.scale(sc, sc);
    ctx.globalAlpha = Math.min(1, a * 2.5);
    ctx.font = `900 ${p.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(p.text).width;
    const rx = (w / 2 + p.size * 0.4) / 0.8, ry = p.size;
    ctx.beginPath();
    for (let i = 0; i < 28; i++) {
      const ang = i / 28 * TAU, k = i % 2 ? 0.78 : 1;
      ctx.lineTo(Math.cos(ang) * rx * k, Math.sin(ang) * ry * k);
    }
    ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#1d1630'; ctx.stroke();
    ctx.lineWidth = 6; ctx.strokeText(p.text, 0, 2);
    ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 2);
    ctx.restore();
  }
}

/* =====================================================================
   GAME 1 — JET ESCAPE  (Flappy Bird style, missiles instead of pipes)
   ===================================================================== */
function drawJet(ctx, x, y, ang, flame, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = '#1d2b3a';
  const fl = 10 + flame * 18 + Math.sin(t * 40) * 3;
  ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(-32, -5); ctx.lineTo(-32 - fl, 0); ctx.lineTo(-32, 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.moveTo(-32, -3); ctx.lineTo(-32 - fl * 0.55, 0); ctx.lineTo(-32, 3); ctx.closePath(); ctx.fill();
  // tail fin
  ctx.fillStyle = '#5f7690'; ctx.beginPath(); ctx.moveTo(-14, -6); ctx.lineTo(-30, -24); ctx.lineTo(-22, -24); ctx.lineTo(-2, -6); ctx.closePath(); ctx.fill(); ctx.stroke();
  // fuselage
  ctx.fillStyle = '#8ea5bc'; ctx.beginPath(); ctx.moveTo(40, 1); ctx.quadraticCurveTo(26, -10, -6, -9);
  ctx.lineTo(-32, -6); ctx.lineTo(-32, 7); ctx.lineTo(-4, 9); ctx.quadraticCurveTo(26, 9, 40, 1); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3d4f63'; ctx.beginPath(); ctx.moveTo(40, 1); ctx.quadraticCurveTo(34, -5, 28, -5); ctx.lineTo(28, 7); ctx.quadraticCurveTo(34, 7, 40, 1); ctx.fill();
  ctx.fillStyle = '#ff6b4a'; ctx.fillRect(-22, 0, 22, 4);
  // wing
  ctx.fillStyle = '#6d849c'; ctx.beginPath(); ctx.moveTo(10, 3); ctx.lineTo(-14, 20); ctx.lineTo(-22, 20); ctx.lineTo(-10, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  // canopy
  ctx.fillStyle = '#8ff0ff'; ctx.beginPath(); ctx.ellipse(14, -8, 11, 5.5, -0.08, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(10, -10, 4, 1.6, -0.2, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawMissile(ctx, x, y, t) {
  ctx.save(); ctx.translate(x, y); ctx.lineWidth = 2.5; ctx.strokeStyle = '#2a1f2d'; ctx.lineJoin = 'round';
  const fl = 12 + Math.sin(t * 50 + x) * 4;
  ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(30, -5); ctx.lineTo(30 + fl, 0); ctx.lineTo(30, 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d63a3a';
  ctx.beginPath(); ctx.moveTo(16, -6); ctx.lineTo(30, -15); ctx.lineTo(32, -6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, 6); ctx.lineTo(30, 15); ctx.lineTo(32, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#eef1f5'; rr(ctx, -24, -7, 56, 14, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e4473c'; ctx.fillRect(4, -6, 5, 12);
  ctx.beginPath(); ctx.moveTo(-22, -7); ctx.quadraticCurveTo(-42, -5, -42, 0); ctx.quadraticCurveTo(-42, 5, -22, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawWarning(ctx, x, y, t) {
  const p = 0.8 + 0.2 * Math.sin(t * 16);
  ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
  ctx.fillStyle = '#ff3b3b'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(16, 12); ctx.lineTo(-16, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `900 18px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('!', 0, 3);
  ctx.restore();
}
function drawCloud(ctx, x, y, s, col, a) {
  ctx.globalAlpha = a; ctx.fillStyle = col;
  circle(ctx, x, y, s); circle(ctx, x + s * 0.9, y + s * 0.2, s * 0.72);
  circle(ctx, x - s * 0.9, y + s * 0.22, s * 0.68); circle(ctx, x + s * 0.25, y - s * 0.45, s * 0.7);
  ctx.globalAlpha = 1;
}

/* ---------- Jet Escape scenery: the route across Sweden ----------
   The ground scrolls by "s" (scroll distance). Each city gets one zone of ZONE units: its skyline
   first, then countryside on the way to the next city. Something placed at s enters the right edge
   when this.scroll reaches s; the skyline layer moves at FAR speed so it lingers on screen. */
const ZONE = 4200, CITY_LEN = 2300, FAR = 0.6;
const NIGHT_INK = [22, 26, 64];
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// k = paint kit: k.c(colour) darkens a colour as night falls (more < 0 keeps it bright, e.g. gold).
function paintKit(ctx, night, t) {
  return { ctx, night, t, c: (col, more = 0) => rgb(mix(col, NIGHT_INK, clamp(night * 0.6 + more, 0, 1))) };

/* ---------- the jet and the missiles ---------- */
function jet3() {               // a JAS 39 Gripen: canards, cranked delta wing, side intakes, one engine
  const G = G3, T = G.T, g = new T.Group();
  if (!G.gm) G.gm = {
    body: G.mat(0x87919a),
    wing: new T.MeshLambertMaterial({ color: 0x78838c, side: T.DoubleSide }),
    dark: G.mat(0x4a5158), radome: G.mat(0x6d767e),
    glass: new T.MeshPhongMaterial({ color: 0x86c4e0, shininess: 90, specular: 0xffffff }),
    blue: new T.MeshBasicMaterial({ color: 0x1f5aa8 }), yellow: new T.MeshBasicMaterial({ color: 0xf6c522 }),
    flame: new T.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.9 }),
  };
  const M = G.gm;
  const add = (geo, mat, x, y, z, sx, sy, sz, rx = 0) => {
    const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.x = rx; g.add(m); return m;
  };
  const flatShape = (pts, depth) => {               // a flat panel from (x, z) points, lying in the XZ plane
    const sh = new T.Shape(); sh.moveTo(pts[0][0], pts[0][1]); for (const q of pts.slice(1)) sh.lineTo(q[0], q[1]); sh.closePath();
    const geo = new T.ExtrudeGeometry(sh, { depth, bevelEnabled: false }); geo.rotateX(Math.PI / 2); return geo;
  };
  add(G.geo.taper, M.body, 0, 0, 0.6, 1.0, 6.0, 0.95, -Math.PI / 2);        // fuselage, slimmer towards the tail
  add(G.geo.cone, M.radome, 0, 0, -3.65, 1.0, 2.5, 0.95, -Math.PI / 2);    // long pointed nose
  add(G.geo.cyl, M.dark, 0, 0, -5.15, 0.05, 0.7, 0.05, Math.PI / 2);       // pitot tube
  add(G.geo.sphere, M.glass, 0, 0.42, -2.05, 0.5, 0.45, 1.6);              // bubble canopy
  add(G.geo.box, M.body, 0, 0.42, 0.7, 0.36, 0.26, 3.4);                   // dorsal spine
  for (const sd of [-1, 1]) {
    add(G.geo.box, M.body, sd * 0.56, -0.14, -0.45, 0.34, 0.52, 2.2);       // air intakes beside the cockpit
    add(G.geo.box, M.dark, sd * 0.56, -0.14, -1.56, 0.26, 0.4, 0.04);
  }
  const canard = flatShape([[0.45, -1.35], [1.75, -0.45], [1.75, -0.2], [0.45, -0.25]], 0.07);
  add(canard, M.wing, 0, 0.22, 0, 1, 1, 1); add(canard, M.wing, 0, 0.22, 0, -1, 1, 1);     // canards
  const wing = flatShape([[0, -0.6], [0.5, -0.4], [2.55, 2.65], [2.55, 3.2], [0, 3.2]], 0.12);
  add(wing, M.wing, 0, -0.08, 0, 1, 1, 1); add(wing, M.wing, 0, -0.08, 0, -1, 1, 1);       // cranked delta wing
  const fin = new T.Shape(); fin.moveTo(1.4, 0); fin.lineTo(3.55, 0); fin.lineTo(3.45, 1.95); fin.lineTo(2.85, 1.95); fin.closePath();
  const fg = new T.ExtrudeGeometry(fin, { depth: 0.1, bevelEnabled: false }); fg.translate(0, 0, -0.05); fg.rotateY(-Math.PI / 2);
  add(fg, M.wing, 0, 0.42, 0, 1, 1, 1);                                     // tall swept fin
  add(G.geo.cyl, M.dark, 0, 0, 3.75, 0.72, 0.6, 0.72, Math.PI / 2);        // engine nozzle
  for (const sd of [-1, 1]) {                                               // Swedish roundels on the wings
    add(G.geo.cyl, M.blue, sd * 1.55, 0.06, 2.3, 0.75, 0.02, 0.75);
    add(G.geo.cyl, M.yellow, sd * 1.55, 0.075, 2.3, 0.3, 0.02, 0.3);
  }
  g.userData.glow = add(G.geo.cone, M.flame, 0, 0, 4.4, 0.6, 1.4, 0.6, Math.PI / 2);   // afterburner
  g.scale.setScalar(0.66);
  return g;
}
function missile3() {
  const G = G3, T = G.T, g = new T.Group();
  if (!G.mm) G.mm = {
    body: G.mat(0xeef1f5), red: G.mat(0xe4473c),
    flame: new T.MeshBasicMaterial({ color: 0xffb347 }),
    flare: new T.MeshBasicMaterial({ color: 0xfff0c0, transparent: true, opacity: 0.95, fog: false, depthWrite: false }),
  };
  const add = (geo, mat, x, y, z, sx, sy, sz, rx = 0) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.x = rx; g.add(m); return m; };
  add(G.geo.cyl, G.mm.body, 0, 0, 0, 0.55, 3.2, 0.55, Math.PI / 2);
  add(G.geo.cone, G.mm.red, 0, 0, 2.05, 0.55, 0.9, 0.55, Math.PI / 2);   // nose points at you (+Z)
  add(G.geo.box, G.mm.red, 0, 0, -1.3, 1.6, 0.08, 0.6);
  add(G.geo.box, G.mm.red, 0, 0, -1.3, 0.08, 1.6, 0.6);

  g.scale.setScalar(2);

}

function radTex3() {                  // the radiation trefoil
  return canvasTex3('rad', 128, 128, x => drawTrefoil(x, 64, 64, 62));
}
function drawTrefoil(x, cx, cy, r) {
  x.fillStyle = '#f2c230'; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
  x.fillStyle = '#141414';
  for (let k = 0; k < 3; k++) {
    const a = -Math.PI / 2 + k * TAU / 3;
    x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, r * 0.86, a - Math.PI / 6, a + Math.PI / 6); x.closePath(); x.fill();
  }
  x.fillStyle = '#f2c230'; x.beginPath(); x.arc(cx, cy, r * 0.26, 0, TAU); x.fill();
  x.fillStyle = '#141414'; x.beginPath(); x.arc(cx, cy, r * 0.16, 0, TAU); x.fill();
}
function nuke3() {                     // the final boss: a big, slow, spinning nuke
  const G = G3, T = G.T, g = new T.Group();
  if (!G.nm) G.nm = {
    body: G.mat(0x4d5a2a), band: G.mat(0xf2c230), black: G.mat(0x1e1e1e),
    flame: new T.MeshBasicMaterial({ color: 0xffb347 }),
    flare: new T.MeshBasicMaterial({ color: 0xfff0c0, transparent: true, opacity: 0.95, fog: false, depthWrite: false }),
  };
  const M = G.nm;
  const add = (geo, mat, x, y, z, sx, sy, sz, rx = 0, ry = 0) => {
    const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.set(rx, ry, 0); g.add(m); return m;
  };
  add(G.geo.cyl, M.body, 0, 0, 0, 1.6, 7, 1.6, Math.PI / 2);
  add(G.geo.cone, M.body, 0, 0, 4.8, 1.6, 2.6, 1.6, Math.PI / 2);          // nose points at you (+Z)
  for (const z of [2.4, -1.4]) add(G.geo.cyl, M.band, 0, 0, z, 1.66, 0.55, 1.66, Math.PI / 2);
  add(G.geo.cyl, M.black, 0, 0, 0.5, 1.66, 0.25, 1.66, Math.PI / 2);
  add(G.geo.box, M.black, 0, 0, -3.1, 3.2, 0.16, 1.6); add(G.geo.box, M.black, 0, 0, -3.1, 0.16, 3.2, 1.6);
  const rt = radTex3();
  for (const sd of [-1, 1]) add(G.geo.plane, rt.mat, sd * 0.84, 0, 0.6, 1.3, 1.3, 1, 0, sd * Math.PI / 2);
  add(G.geo.plane, rt.mat, 0, 0.84, 0.6, 1.3, 1.3, 1, -Math.PI / 2);
  add(G.geo.cone, M.flame, 0, 0, -4.2, 1.2, 2.4, 1.2, -Math.PI / 2);
  add(G.geo.sphere, M.flare, 0, 0, -4.4, 2.6, 2.6, 3);
  g.userData.light = add(G.geo.sphere, new T.MeshBasicMaterial({ color: 0xff2020, fog: false }), 0, 0, 6.2, 0.6, 0.6, 0.6);
  g.userData.halo = add(G.geo.sphere, new T.MeshBasicMaterial({ color: 0xffb040, transparent: true, opacity: 0.35, fog: false, depthWrite: false }), 0, 0, 2, 5, 5, 5);   // boss glow
  g.scale.setScalar(2.4);
  return g;
}
function jamTex3() {                   // static noise for the jamming fields
  return canvasTex3('jam', 128, 128, (x, w, h) => {
    x.fillStyle = 'rgba(140,50,220,.55)'; x.fillRect(0, 0, w, h);   // solid base, so the field stays visible from far away
    for (let i = 0; i < 1800; i++) {
      const r = Math.random();
      x.fillStyle = r < 0.25 ? 'rgba(255,255,255,.9)' : r < 0.6 ? 'rgba(220,120,255,.8)' : 'rgba(120,40,200,.5)';
      x.fillRect((Math.random() * w) | 0, (Math.random() * h) | 0, 2, 2);
    }
    x.fillStyle = 'rgba(255,255,255,.35)';
    for (let y = 0; y < h; y += 8) x.fillRect(0, y, w, 1);   // scan lines
  }, { repeat: true });
}

  win() {

  // ----- easter egg: Q fires a missile that flies ahead, makes a flat U-turn and comes back for you -----

  fireSelf() {

  updateSelf(dt) {
    const m = this.selfM;

    const R = 6, prev = m.r.clone();
    m.t += dt;
    if (m.phase === 0) {                                           // 1. straight ahead, rising just above the jet
      m.r.z -= 45 * dt; m.r.y += (1.4 - m.r.y) * Math.min(1, dt * 4);

      }

      m.r.addScaledVector(back.normalize(), 55 * dt);

    if (m.st <= 0) { m.st = 0.025; this.puff(m.g.position.x, m.g.position.y, m.g.position.z, 0.8, 0.7); }
    if (m.phase === 2 && this.state === 'running' && m.r.length() < 2.2) { this.scene.remove(m.g); this.selfM = null; this.crash('self'); return; }
    if (this.state !== 'running' && m.t > 3) { this.scene.remove(m.g); this.selfM = null; }

  // ----- the final boss: a nuke that homes in on you until the last moment -----

    sh.rotation.x = -Math.PI / 2; sh.scale.setScalar(9); sh.position.set(this.px, 0.1, g.position.z); this.scene.add(sh);

  }
  updateNuke(dt) {

  // ----- enemy jamming: no-go fields that block part of the flight path -----
  addJam(k) {

    const kind = ['half', 'band', 'window'][k % 3];                 // they get harder: half, then top or bottom, then a window
    if (kind === 'half') boxes.push(Math.random() < 0.5 ? [-C, 0.5, 0, TOP] : [-0.5, C, 0, TOP]);
    else if (kind === 'band') boxes.push(Math.random() < 0.5 ? [-C, C, 11, TOP] : [-C, C, 0, 9.5]);
    else {
      const wx = rand(-7, 7), wy = rand(7, 15), hw = 5, hh = 4;    // a wall with one window to fly through
      boxes.push([-C, wx - hw, 0, TOP], [wx + hw, C, 0, TOP], [wx - hw, wx + hw, 0, wy - hh], [wx - hw, wx + hw, wy + hh, TOP]);

      G.jamLine = new T.LineBasicMaterial({ color: 0xff5cf0, fog: false });

  jamAhead(dist) { return this.jams.some(j => this.pz - j.z0 > -j.len - 10 && this.pz - j.z0 < dist); }

    for (const j of this.jams) {

  updateJams() {

      const w = ctx.measureText('NUKE INCOMING').width;

      ctx.fillStyle = '#ff3b3b'; ctx.fillText('NUKE INCOMING', W / 2, y);

/* =====================================================================
   GAME 2 — ICE BRAWL  (1v1 hockey fight, survive the bot's punches)
   ===================================================================== */
const TEAM_BLUE = { jersey: '#2f6fe0', stripe: '#ffffff', pants: '#1b2a55', helmet: '#2f6fe0', glove: '#1d3f99', skin: '#f3c9a0' };
const TEAM_RED  = { jersey: '#e63946', stripe: '#ffd166', pants: '#3b1420', helmet: '#e63946', glove: '#9e1f2b', skin: '#e2ad86' };
const REF       = { jersey: '#ffffff', stripe: '#16161c', pants: '#16161c', helmet: '#16161c', glove: '#16161c', skin: '#efc39b', ref: true };
const SKINS = ['#f3c9a0', '#d9a07a', '#a86f4c', '#7a4b31', '#ffe0bd'];
const newPose = () => ({ duck: 0, punch: 0, wind: 0, knock: 0, fall: 0, cheer: 0, wobble: false, wave: false });
const OUT = '#14172a';

function drawArm(ctx, sx, sy, f, col, gloved) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = 14; line(ctx, sx, sy, f.x, f.y);
  ctx.strokeStyle = col.jersey; ctx.lineWidth = 10; line(ctx, sx, sy, f.x, f.y);
  ctx.lineWidth = 2.5; ctx.strokeStyle = OUT;
  if (gloved) { ctx.fillStyle = col.glove; rr(ctx, f.x - 10, f.y - 9, 21, 18, 6); ctx.fill(); ctx.stroke(); }
  else { ctx.fillStyle = col.skin; ctx.beginPath(); ctx.arc(f.x, f.y, 7.5, 0, TAU); ctx.fill(); ctx.stroke(); }
}
function drawSkater(ctx, x, y, dir, col, pose, gloved, t) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(30,60,100,.18)';
  ctx.beginPath(); ctx.ellipse(-dir * 55 * pose.fall, 4, 40 + pose.fall * 34, 7, 0, 0, TAU); ctx.fill();
  ctx.scale(dir, 1);
  if (pose.fall) ctx.rotate(-pose.fall * 1.35);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // legs + skates
  for (const [hx, fx] of [[-9, -12], [9, 13]]) {
    ctx.strokeStyle = OUT; ctx.lineWidth = 16; line(ctx, hx, -52, fx, -12);
    ctx.strokeStyle = col.pants; ctx.lineWidth = 12; line(ctx, hx, -52, fx, -12);
    ctx.fillStyle = '#22252f'; rr(ctx, fx - 9, -16, 22, 11, 4); ctx.fill();
    ctx.strokeStyle = '#c9d3de'; ctx.lineWidth = 3; line(ctx, fx - 11, -2, fx + 15, -2);
    ctx.strokeStyle = '#22252f'; ctx.lineWidth = 2; line(ctx, fx - 4, -5, fx - 4, -2); line(ctx, fx + 8, -5, fx + 8, -2);
  }
  // upper body
  const wob = pose.wobble ? Math.sin(t * 16) * 0.16 : 0;
  ctx.save();
  ctx.translate(0, -50 + pose.duck * 16);
  ctx.rotate(wob + pose.punch * 0.2 - pose.knock * 0.32 - pose.wind * 0.14 - pose.duck * 0.12);
  // guard arm (behind torso)
  let guard = { x: lerp(26, 20, pose.duck), y: lerp(-52, -72, pose.duck) };
  if (pose.cheer) guard = { x: lerp(guard.x, 14, pose.cheer), y: lerp(guard.y, -112, pose.cheer) };
  if (pose.wave) guard = { x: 20 + Math.sin(t * 10) * 10, y: -108 };
  drawArm(ctx, 10, -48, guard, col, gloved);
  // torso
  ctx.fillStyle = col.jersey; rr(ctx, -21, -62, 42, 64, 12); ctx.fill();
  if (col.ref) {
    ctx.save(); rr(ctx, -21, -62, 42, 64, 12); ctx.clip(); ctx.fillStyle = col.stripe;
    for (let sx = -19; sx < 21; sx += 10) ctx.fillRect(sx, -62, 5, 64);
    ctx.restore();
  } else {
    ctx.fillStyle = col.stripe; ctx.fillRect(-21, -24, 42, 7); ctx.fillRect(-21, -50, 42, 4);
  }
  ctx.strokeStyle = OUT; ctx.lineWidth = 3; rr(ctx, -21, -62, 42, 64, 12); ctx.stroke();
  // head + helmet
  ctx.fillStyle = col.skin; ctx.beginPath(); ctx.arc(4, -78, 15, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col.helmet; ctx.beginPath(); ctx.arc(4, -80, 16.5, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillRect(6, -84, 16, 4);
  const dazed = pose.knock > 0.5 || pose.fall > 0.3;
  ctx.strokeStyle = OUT; ctx.lineWidth = 2.2;
  if (dazed) { line(ctx, 9, -78, 14, -73); line(ctx, 14, -78, 9, -73); }
  else { ctx.fillStyle = OUT; circle(ctx, 12, -76, 2.3); }
  line(ctx, 10, -68, 15, dazed ? -67 : -69);
  // punching arm
  const rest = { x: 24, y: -44 }, wind = { x: -24, y: -40 }, hit = { x: 90, y: -66 };
  let f = {
    x: rest.x + (wind.x - rest.x) * pose.wind + (hit.x - rest.x) * pose.punch,
    y: rest.y + (wind.y - rest.y) * pose.wind + (hit.y - rest.y) * pose.punch
  };
  if (pose.wave) f = { x: -8 + Math.cos(t * 10) * 8, y: -110 };
  drawArm(ctx, -2, -48, f, col, gloved);
  ctx.restore();
  ctx.restore();
}

class IceBrawl {
  constructor(view) { this.v = view; this.reset(); }
  get iceY() { return this.v.H * 0.62; }
  get feetY() { return this.iceY + (this.v.H - this.iceY) * 0.42; }
  get px() { return this.v.W / 2 - 58; }
  get bx() { return this.v.W / 2 + 58; }
  get meter() { return this.balance / 100; }   // shown in the shared HUD
  reset() {
    this.state = 'idle'; this.time = 0; this.t = 0; this.cd = 0; this.balance = 100; this.endT = 0;
    this.p = { mode: 'ready', modeT: 0, pose: newPose() };
    this.b = { mode: 'idle', modeT: 0, tellMax: 1, fake: false, combo: 0, pose: newPose() };
    this.gloves = []; this.texts = []; this.cheer = 0; this.shake = 0; this.ref = null; this.refTarget = 0;
    const cols = ['#2f6fe0', '#e63946', '#ffd166', '#ffffff', '#8ecae6', '#f4a261', '#2a9d8f', '#b5179e'];
    this.crowd = [];
    for (let row = 0; row < 5; row++) for (let i = 0; i < 34; i++) {
      this.crowd.push({ x: (i + rand(0.1, 0.9)) / 34, row, c: cols[(Math.random() * cols.length) | 0], k: SKINS[(Math.random() * SKINS.length) | 0], ph: rand(0, 6), sign: Math.random() < 0.05 });
    }
    this.scratches = []; for (let i = 0; i < 16; i++) this.scratches.push({ x: Math.random(), y: Math.random(), w: rand(30, 90), a: rand(-0.2, 0.2) });
  }
  start() { this.state = 'countdown'; this.cd = 3; }
  action() {
    if (this.state !== 'running') return;
    const P = this.p;
    if (P.mode !== 'ready') return;
    if (this.b.mode === 'tell') { P.mode = 'duck'; }                 // good timing: duck under the punch
    else { P.mode = 'wobble'; P.modeT = 1.0; this.balance -= 8; addText(this.texts, 'WOBBLE!', this.px - 10, this.feetY - 160, '#7fd3ff', 26); if (this.balance <= 0.5) { this.balance = 0; this.knockout(); } }
  }
  tellStart(dur, fake, combo) { const B = this.b; B.mode = 'tell'; B.modeT = dur; B.tellMax = dur; B.fake = fake; B.combo = combo; }
  feint() {
    const B = this.b, P = this.p; B.mode = 'feint'; B.modeT = 0.3;
    addText(this.texts, 'FAKE!', this.bx + 20, this.feetY - 175, '#ff9de0', 28);
    if (P.mode === 'duck') { P.mode = 'rise'; P.modeT = 0.35; }

    if (Math.random() > E.p.bite) { addText(this.texts, 'NOT FOOLED', L.cx + sgn(s) * 60 * L.k, L.head - 30 * L.k, '#c9d3de', 22); return; }

    E.baited = { side: s, t: FP.BAIT }; E.blockT = FP.BLOCK_WINDOW; E.blockAt = this.t;

  }
  landPunch(s) {

    if (E.mode === 'swap') return this.hitRival(FP.DMG.hit * 1.5, s, 'OPEN!', '#7dffb0');   // busy passing the button: no guard at all
    if (E.mode === 'open') return this.hitRival(FP.DMG.counter * (1 + this.combo * 0.1), s, 'COUNTER!', '#7dffb0');
    if (E.mode === 'tell') {

    if (E.mode === 'guard') { E.mode = 'flinch'; E.modeT = 0.22; }

  blocked(s, parry) {

  koRival() {

  }

  /* ---------- screaming ---------- */
  listen(dt) {
    const lvl = fpMicLevel();
    this.mic = Math.max(lvl, this.mic - dt * 0.8);   // for the meter
    if (lvl > FP.SCREAM) { if (this.loudT === 0) this.loudAt = this.t; this.loudT += dt; } else this.loudT = 0;
    this.screamCD -= dt;

    if (this.loudT >= FP.SCREAM_HOLD && this.screamCD <= 0 && E.blockT > 0 && this.loudAt >= E.blockAt - 0.15 &&

      E.mode = 'open'; E.modeT = FP.STUN; E.combo = 0; E.punish = null; E.baited = null; E.blockT = 0;   // same state as after your perfect block
      this.screamCD = 1.2; this.shake = 0.6; this.cheer = 1;
      const L = this.layout(); addText(this.texts, 'STUNNED!', L.cx, L.head - 110 * L.k, '#7dffb0', 36);
    }
  }

  /* ---------- the rival ---------- */
  gap() { const d = this.diff; return (1.2 - 0.6 * d) + Math.random() * (0.7 - 0.35 * d); }
  pickGuard() {
    const E = this.e, u = this.usage, smart = E.p.smart;
    this.setGuard(Math.random() < lerp(0.5, (u.L + 0.5) / (u.L + u.R + 1), smart) ? 'L' : 'R');   // guards the side you punch most

  setGuard(s) {

  }
  nextAttack() {
    const E = this.e, d = this.diff, r = Math.random();
    const feintP = E.ft > 6 ? (0.1 + 0.15 * d) * E.p.feint : 0;
    const type = r < feintP ? 'feint' : r < feintP + (1 - feintP) * (1 - E.p.hook) ? 'jab' : 'hook';
    let side = Math.random() < 0.5 ? 'L' : 'R';

    if (bl.length === 1 && Math.random() < 0.35 + 0.35 * d) side = otherSide(bl[0]);   // goes around a held block
    let speed = 1;
    if (E.punish) { side = E.punish; E.punish = null; speed = 0.75; }
    E.combo = type !== 'feint' && E.ft > 8 && Math.random() < (0.15 + 0.3 * d) * E.p.combo ? (Math.random() < d * 0.6 ? 2 : 1) : 0;

  }
  startAttack(type, side, speed = 1) {
    const A = FP.ATK[type], d = this.diff, dur = lerp(A.wind[0], A.wind[1], d) * speed * this.e.p.speed;
    const hitch = type === 'hook' && this.e.ft > 6 && Math.random() < 0.2 + 0.3 * d;   // freezes mid wind-up to bait an early block
    const E = this.e; E.mode = 'tell'; E.guardTo = null; this.setGuard(otherSide(side));

  }
  impact() {

    const tx = W / 2 + sgn(s) * 120 * k, ty = H * 0.5;

        this.stamina = Math.min(100, this.stamina + 15); this.cheer = Math.max(this.cheer, 0.7);

      }

      if (bt <= FP.WEAK) { addText(this.texts, 'WEAK BLOCK', tx, ty, '#ffb347', 24); this.shake = 0.4; this.hurt(dmg * lerp(0.4, 0.8, (bt - FP.GOOD) / (FP.WEAK - FP.GOOD))); return; }
      h.st = 'stun'; h.t = 0; h.stunT = 0.7;

    addText(this.texts, A.name, tx, ty, '#ff6b6b', A.dmg > 15 ? 38 : 30);
    if (E.kind === 'trump' && Math.random() < 0.6) { const L = this.layout(); addText(this.texts, TRUMP_LINES[(Math.random() * TRUMP_LINES.length) | 0], L.cx, L.head - 95 * L.k, '#ffffff', 26); }

  }
  win() {

    this.overTitle = 'Champion of the ice!';
    this.overText = 'You knocked out your rival, Kim Jong Un and Trump. You win!';
    addText(this.texts, 'CHAMPION!', W / 2, H * 0.3, '#ffcf4a', 56); this.texts[this.texts.length - 1].life = this.texts[this.texts.length - 1].max = 3;
  }
  nuke() {

    E.mode = 'celebrate'; E.combo = 0; this.cheer = 0;
    this.rocket = { x: W * (Math.random() < 0.5 ? 0.17 : 0.83), y: this.iceY - 40 * k, vy: 0, puff: 0 }; this.smoke = [];
    this.overTitle = 'NUKED!'; this.overText = 'And so the world was destroyed.'; this.overIcon = '☢️';

  }

      this.balance = 0; this.state = 'dying'; this.endT = 2.6; this.e.mode = 'celebrate'; this.cheer = 1; this.releaseAll();

  updateRival(dt) {

        else if (E.mode === 'strike' && E.combo > 0) { E.combo--; this.startAttack(Math.random() < 0.6 ? 'jab' : 'hook', Math.random() < 0.7 ? otherSide(E.atk.side) : E.atk.side, 0.75); }

            addText(this.texts, N.p.name, W / 2, H * 0.38, '#ffcf4a', 46); this.texts[this.texts.length - 1].life = this.texts[this.texts.length - 1].max = 1.8;
            if (N.btn) { addText(this.texts, "DON'T PUNCH THE RED BUTTON!", W / 2, H * 0.52, '#ff3b3b', 26); this.texts[this.texts.length - 1].life = this.texts[this.texts.length - 1].max = 3; }
          } else addText(this.texts, N.p.label, W / 2, H * 0.3, '#ffffff', 40);

  /* ---------- loop ---------- */
  update(dt) {
    const { W, H } = this.v;
    if (this.slow > 0) { this.slow -= dt; dt *= 0.3; }                 // slow-mo after a perfect block
    this.t += dt;
    this.cheer = Math.max(0, this.cheer - dt * 0.7); this.shake = Math.max(0, this.shake - dt * 3); this.flash = Math.max(0, this.flash - dt * 3);
    if (this.state === 'countdown') {
      this.cd -= dt;
      if (this.cd <= 0) { this.state = 'running'; this.cheer = 1; addText(this.texts, 'FIGHT!', W / 2, H * 0.34, '#ffcf4a', 46); }
    } else if (this.state === 'running') {
      this.time += dt;
      this.balance = Math.min(FP.HP, this.balance + FP.REGEN * dt);
      const blocking = SIDES.filter(s => this.hands[s].st === 'block').length;
      this.stamina = clamp(this.stamina + (blocking ? -FP.BLOCK_DRAIN * blocking : FP.STAM_REGEN) * dt, 0, 100);
      const decay = Math.exp(-dt * 0.5); this.usage.L *= decay; this.usage.R *= decay;
      for (const s of SIDES) {
        const h = this.hands[s]; h.t += dt;
        if (h.st === 'block') h.bt += dt;
        else if (h.st === 'fake') {
          if (!h.resolved && h.t >= FP.FAKE_LEN * 0.4) { h.resolved = true; this.landFake(s); }
          if (h.st === 'fake' && h.t >= FP.FAKE_LEN) { h.st = 'rest'; h.t = 0; this.syncBlock(s); }
        } else if (h.st === 'punch') {
          if (!h.resolved && h.t >= FP.PUNCH_HIT) { h.resolved = true; this.landPunch(s); }
          if (h.st === 'punch' && h.t >= FP.PUNCH_LEN) { h.st = 'recover'; h.t = 0; }
        } else if ((h.st === 'recover' && h.t >= FP.PUNCH_RECOVER) || (h.st === 'recoil' && h.t >= 0.4) || (h.st === 'stun' && h.t >= h.stunT)) {
          h.st = 'rest'; h.t = 0; this.syncBlock(s);
        }
      }
      if (this.state === 'running') this.updateRival(dt);
      if (this.state === 'running') this.listen(dt);
    } else if (this.state === 'dying') {
      this.endT -= dt; this.fall = Math.min(1, this.fall + dt * 1.6);
      if (this.endT <= 0) this.state = 'done';
    } else if (this.state === 'nuking') {
      const r = this.rocket, k = this.k; this.nukeT += dt;
      if (this.nukeT > 0.5) {                                          // lift-off

        this.shake = Math.max(this.shake, 0.15);
      }
      for (const p of this.smoke) { p.life -= dt; p.r += 26 * k * dt; p.y += 10 * k * dt; }
      this.smoke = this.smoke.filter(p => p.life > 0);
      if (this.nukeT > 2.6 && this.nukeT - dt <= 2.6) this.shake = 1.4;   // the flash
      if (this.nukeT >= 6.5) this.state = 'done';
    } else if (this.state === 'winning') {
      this.endT -= dt; this.cheer = 1;
      if (this.endT <= 0) this.state = 'done';
    }
    if (this.hatFly) {
      const f = this.hatFly; f.vy += 1500 * this.k * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.r += f.vr * dt;
      if (f.y > H + 120 * this.k) this.hatFly = null;
    }
    // animate the rival
    const E = this.e;
    E.flinch = Math.max(0, E.flinch - dt * 4);
    E.drop = ease(E.drop, E.mode === 'ko' && E.modeT < 2.3 ? 1 : 0, dt, E.mode === 'enter' ? 3 : 4);
    for (const s of SIDES) {
      const tgt = this.fistTarget(s);
      if (!E.fist[s] || (E.mode === 'tell' && s === E.atk.side)) E.fist[s] = tgt;   // the wind-up is exact, so you can time it
      else { const r = E.mode === 'strike' ? 40 : 16, f = E.fist[s]; f.x = ease(f.x, tgt.x, dt, r); f.y = ease(f.y, tgt.y, dt, r); f.s = ease(f.s, tgt.s, dt, r); }
    }
    for (const s of SIDES) {
      const h = this.hands[s], tgt = this.handTarget(s);
      if (!h.pos || h.st === 'punch' || h.st === 'fake') h.pos = tgt;
      else { const r = h.st === 'block' ? 30 : 14; h.pos.x = ease(h.pos.x, tgt.x, dt, r); h.pos.y = ease(h.pos.y, tgt.y, dt, r); h.pos.s = ease(h.pos.s, tgt.s, dt, r); }
    }
    tickTexts(this.texts, dt);
  }

  /* ---------- layout ---------- */
  layout() {
    const { W, H } = this.v, k = this.k, E = this.e;
    const bob = Math.sin(this.t * 2.2) * 4 * k;
    const lean = E.mode === 'tell' ? sgn(E.atk.side) * 16 * k * E.atk.prog * FP.ATK[E.atk.type].depth : 0;
    const cx = W / 2 + lean + E.flinchDir * E.flinch * 18 * k;
    const sh = H * 0.53 + bob + E.drop * H * 0.7;
    return { cx, sh, head: sh - 72 * k, k };
  }
  fistTarget(s) {
    const E = this.e, L = this.layout(), k = L.k, g = sgn(s), { W, H } = this.v;
    const low = { x: L.cx + g * 95 * k, y: L.sh + 100 * k, s: 1 };
    const guard = { x: L.cx + g * 42 * k, y: L.head + 34 * k, s: 1.1 };
    switch (E.mode) {
      case 'tell':
        if (s !== E.atk.side) return guard;
        return P_LERP(low, { x: L.cx + g * 170 * k, y: L.head - 34 * k, s: 0.78 }, E.atk.prog * FP.ATK[E.atk.type].depth);
      case 'strike': return s === E.atk.side ? { x: W / 2 + g * 80 * k, y: H * 0.6, s: 2.6 } : guard;
      case 'feint': return s === E.atk.side ? low : guard;
      case 'open': return { x: L.cx + g * 150 * k, y: L.sh + 150 * k, s: 1 };
      case 'ko': return { x: L.cx + g * 125 * k, y: L.sh + 50 * k, s: 1 };
      case 'celebrate': return { x: L.cx + g * 110 * k, y: L.head - 80 * k + Math.sin(this.t * 10 + g) * 10 * k, s: 1 };
      case 'swap': return { x: L.cx + g * 26 * k, y: L.sh + 70 * k, s: 1 };
      default: return s === E.guard ? guard : low;
    }

        ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = w; line(ctx, f.x + Math.cos(a) * (d + 1.5 * k), f.y + Math.sin(a) * (d + 1.5 * k), f.x + Math.cos(a) * (d + 9.5 * k), f.y + Math.sin(a) * (d + 9.5 * k)); ctx.lineCap = 'round';
      }

    }
    if (E.btn) {                                                       // the NUKE button, in his fist (passed over during a swap)
      let f = E.fist[E.btn] || this.fistTarget(E.btn);
      if (E.mode === 'swap' && E.swapFrom) {
        const a = E.fist[E.swapFrom] || f, t = clamp(1 - E.modeT / FP.SWAP, 0, 1), e = t * t * (3 - 2 * t);
        f = { x: lerp(a.x, f.x, e), y: lerp(a.y, f.y, e) - Math.sin(Math.PI * e) * 30 * k, s: lerp(a.s, f.s, e) };
      }
      this.drawNukeButton(ctx, f.x, f.y - 30 * k * f.s, k * f.s);
    }
    ctx.restore();
  }
  drawTell(ctx) {
    const E = this.e, k = this.k;
    if (this.state === 'running' && E.mode === 'tell') {
      const a = E.atk, f = E.fist[a.side], A = FP.ATK[a.type];
      const r = lerp(100 * k, 30 * k, a.prog), pulse = 0.75 + 0.25 * Math.sin(this.t * 25);
      ctx.save(); ctx.globalAlpha = pulse;
      ctx.strokeStyle = A.color; ctx.lineWidth = 6 * k; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      // which block to use: the badge sits on that side
      const bx = f.x + sgn(a.side) * (r + 22 * k), by = f.y;
      ctx.fillStyle = A.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(bx, by, 17 * k, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = a.type === 'jab' ? '#5a3b00' : '#fff'; ctx.font = `900 ${18 * k}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(this.touch ? (a.side === 'L' ? '◀' : '▶') : (a.side === 'L' ? 'A' : 'D'), bx, by + 1);
      ctx.restore();
    }
    for (let i = 0; i < E.combo && (E.mode === 'tell' || E.mode === 'strike'); i++) {

      ctx.fillStyle = '#ff9de0'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(L.cx - (E.combo - 1) * 9 * k + i * 18 * k, L.head - 78 * k, 6 * k, 0, TAU); ctx.fill(); ctx.stroke();
    }
    if (this.state === 'running' && E.blockT > 0 && (E.mode === 'guard' || E.mode === 'tell' || E.mode === 'flinch')) {
      const f = E.fist[E.guard], L = this.layout(), a = E.blockT / FP.BLOCK_WINDOW;
      if (f) { ctx.save(); ctx.globalAlpha = 0.8 * a; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5 * k; ctx.beginPath(); ctx.arc(f.x, f.y, 40 * k * f.s, 0, TAU); ctx.stroke(); ctx.restore(); }
      if (FP_MIC.state === 'on') {
        ctx.save(); ctx.globalAlpha = Math.min(1, a * 2); ctx.font = `900 ${20 * k}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 5; ctx.strokeStyle = '#13223f'; ctx.strokeText('🎤 SCREAM!', L.cx, L.head - 100 * k);
        ctx.fillStyle = '#7dffb0'; ctx.fillText('🎤 SCREAM!', L.cx, L.head - 100 * k); ctx.restore();
      }
    }
    if (E.mode === 'open') {

  }
  drawHands(ctx) {
    const { W, H } = this.v, k = this.k;
    for (const s of SIDES) {
      const h = this.hands[s], g = sgn(s), p = h.pos || this.handTarget(s);
      this.drawLimb(ctx, W / 2 + g * 300 * k, H + 90 * k, p.x, p.y + 30 * k * p.s, 64 * k * p.s, TEAM_BLUE.jersey);
      this.drawFist(ctx, p.x, p.y, 42 * k * p.s, TEAM_BLUE.skin, true);
      if (h.st === 'block') {
        // block freshness: white = perfect window, green = solid, orange = weak, red = about to break
        const bt = h.bt, col = bt <= FP.PERFECT ? '#ffffff' : bt <= FP.GOOD ? '#5ee6b0' : bt <= FP.WEAK ? '#ffb347' : '#ff5a5a';
        ctx.save(); ctx.globalAlpha = bt <= FP.PERFECT ? 0.95 : 0.7;

  }
  drawUI(ctx) {
    const { W, H } = this.v, k = this.k, E = this.e;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // rival health
    const bw = 230, bx = W - bw - 22, by = 40;
    ctx.fillStyle = 'rgba(14,22,44,.7)'; rr(ctx, bx - 10, by - 28, bw + 20, 50, 14); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(ctx, bx, by, bw, 9, 4); ctx.fill();
    ctx.fillStyle = E.p.name ? '#ff3b3b' : E.col.jersey; rr(ctx, bx, by, Math.max(0, bw * E.hp / E.maxHp), 9, 4); ctx.fill();
    ctx.font = `900 13px ${FONT}`; ctx.fillStyle = '#eaf4ff';
    ctx.fillText(`${E.p.name || E.p.label}  ·  KOs ${this.kos}/${ROSTER.length}`, bx + bw / 2, by - 13);
    // your stamina
    const sw = 170, sx = W / 2 - sw / 2, sy = H - 22;
    ctx.fillStyle = 'rgba(14,22,44,.6)'; rr(ctx, sx - 4, sy - 4, sw + 8, 14, 7); ctx.fill();
    ctx.fillStyle = this.stamina < FP.PUNCH_COST ? '#ff5a5a' : '#8ecae6'; rr(ctx, sx, sy, sw * this.stamina / 100, 6, 3); ctx.fill();
    ctx.font = `900 11px ${FONT}`; ctx.fillStyle = '#13223f'; ctx.fillText('STAMINA', W / 2, sy - 12);
    // microphone: level meter with the scream line
    const mx = bx + 40, my = by + 34, mw = bw - 40;          // under the rival's health bar
    if (FP_MIC.state === 'on') {
      const full = FP.SCREAM * 2, lv = clamp(this.mic / full, 0, 1);
      ctx.fillStyle = 'rgba(14,22,44,.7)'; rr(ctx, bx - 10, my - 10, bw + 20, 22, 11); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(ctx, mx, my - 3, mw, 6, 3); ctx.fill();
      ctx.fillStyle = this.mic > FP.SCREAM ? '#7dffb0' : '#c9d3de'; rr(ctx, mx, my - 3, mw * lv, 6, 3); ctx.fill();
      ctx.fillStyle = '#ffcf4a'; ctx.fillRect(mx + mw * 0.5 - 1, my - 6, 2, 12);   // scream line
      ctx.font = `900 11px ${FONT}`; ctx.fillStyle = '#eaf4ff'; ctx.fillText('🎤', bx + 14, my + 1);
    } else if (FP_MIC.state === 'denied' || FP_MIC.state === 'none') {
      ctx.fillStyle = 'rgba(14,22,44,.7)'; rr(ctx, bx - 10, my - 10, bw + 20, 22, 11); ctx.fill();
      ctx.font = `800 11px ${FONT}`; ctx.fillStyle = 'rgba(234,244,255,.75)'; ctx.fillText('🎤 mic off: no scream stuns', bx + bw / 2, my + 1);
    }

    if (this.touch) {
      ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#13223f'; ctx.lineWidth = 3;
      for (const s of SIDES) {
        const x = s === 'L' ? 54 : W - 54;
        for (const [y, t] of [[H * 0.25, 'FAKE'], [H * 0.47, 'PUNCH'], [H * 0.8, 'BLOCK']]) {
          ctx.beginPath(); ctx.arc(x, y, t === 'BLOCK' ? 38 : 32, 0, TAU); ctx.fill(); ctx.stroke();
          ctx.globalAlpha = 0.8; ctx.fillStyle = '#13223f'; ctx.font = `900 12px ${FONT}`; ctx.fillText(t, x, y);

      ctx.restore();
    } else {
      ctx.font = `800 13px ${FONT}`; ctx.fillStyle = 'rgba(19,34,63,.75)';

  draw(ctx) {
    const { W, H } = this.v;
    ctx.save();
    if (this.fall > 0) { ctx.translate(W / 2, H); ctx.rotate(this.fall * 0.5); ctx.translate(-W / 2, -H + this.fall * 60); }
    if (this.shake > 0) ctx.translate(rand(-1, 1) * this.shake * 9, rand(-1, 1) * this.shake * 6);
    this.drawArena(ctx);
    if (this.rocket) this.drawRocket(ctx);                             // behind everything but the arena
    this.drawRival(ctx);
    if (this.hatFly) this.drawMagaCap(ctx, this.hatFly.x, this.hatFly.y, this.k, this.hatFly.r);
    this.drawTell(ctx);
    if (this.state !== 'dying' && this.state !== 'done' && this.state !== 'nuking') this.drawHands(ctx);
    ctx.restore();
    if (this.flash > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
      g.addColorStop(0, 'rgba(255,40,40,0)'); g.addColorStop(1, `rgba(255,40,40,${0.5 * this.flash})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (this.fall > 0) { ctx.fillStyle = `rgba(10,14,30,${this.fall * 0.45})`; ctx.fillRect(0, 0, W, H); }
    if (this.rocket && this.nukeT > 2.6) {                             // the flash, then a burnt orange sky and the last words
      const t = this.nukeT - 2.6;
      ctx.fillStyle = `rgba(255,170,60,${Math.min(0.55, t * 0.4)})`; ctx.fillRect(0, 0, W, H);
      if (t < 1.2) { ctx.fillStyle = `rgba(255,255,255,${1 - t / 1.2})`; ctx.fillRect(0, 0, W, H); }
      if (t > 0.6) {
        const a = Math.min(1, (t - 0.6) * 1.5), sz = Math.min(40, W / 17);
        ctx.save(); ctx.globalAlpha = a; ctx.font = `900 ${sz}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 8; ctx.strokeStyle = '#13223f'; ctx.fillStyle = '#ffffff';
        ctx.strokeText('And so the world', W / 2, H * 0.4); ctx.fillText('And so the world', W / 2, H * 0.4);
        ctx.strokeText('was destroyed.', W / 2, H * 0.4 + sz * 1.2); ctx.fillText('was destroyed.', W / 2, H * 0.4 + sz * 1.2);
        ctx.restore();
      }
    }
    if (this.state === 'running' || this.state === 'countdown') this.drawUI(ctx);
    if (this.state === 'countdown') {
      const n = Math.max(1, Math.ceil(this.cd)), f = this.cd - Math.floor(this.cd);
      const sc = 1 + (f > 0.7 ? (f - 0.7) / 0.3 * 0.6 : 0);

      ctx.font = `900 96px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 10; ctx.strokeStyle = '#13223f'; ctx.strokeText(String(n), 0, 0);
      ctx.fillStyle = '#ffcf4a'; ctx.fillText(String(n), 0, 0);
      ctx.restore();
    }
    drawTexts(ctx, this.texts);
  }
}

const available = () => GAMES.filter(g => !g.locked && !g.href && !g.winOnly);   // survival games: counted in the overall score and "Play all"

/* =====================================================================
   FRAMEWORK — hub, shared HUD, overlays, input, scoring
   ===================================================================== */
const $ = id => document.getElementById(id);
const canvas = $('stage'), ctx = canvas.getContext('2d');
const hubEl = $('hub'), resultsEl = $('results'), overlay = $('overlay'), panel = $('panel'), hud = $('hud');
const timerEl = $('timer'), meterEl = $('meter'), meterFill = $('meterFill'), meterLabel = $('meterLabel');
const view = { W: 640, H: 480 };
const best = {};                         // best score per game, kept for this session only
const wins = {};                         // win-or-lose games (winOnly) that have been won this session
let mode = 'hub', phase = '', cur = null, curDef = null, paused = false, playAll = null, overlayAt = 0;

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), sw = window.innerWidth, sh = window.innerHeight;
  canvas.width = Math.round(sw * dpr); canvas.height = Math.round(sh * dpr);
  const s = Math.min(sw / 640, sh / 480);   // keep at least a 640x480 play area, extend on longer screens
  view.W = sw / s; view.H = sh / s;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
}
window.addEventListener('resize', resize); resize();

const show = el => el.classList.remove('off');
const hide = el => el.classList.add('off');
const scoreFor = (def, time) => Math.min(100, Math.round(time / def.targetTime * 100));
const overallScore = () => { const g = available(); return Math.round(g.reduce((a, d) => a + (best[d.id] || 0), 0) / g.length); };
const message = s => s >= 90 ? 'Legendary!' : s >= 70 ? 'Impressive!' : s >= 40 ? 'Nice work!' : 'Good start!';
const hint = txt => `<div class="hint">Press <kbd>SPACE</kbd> / Tap ${txt}</div>`;

function fadeTo(fn) {
  const f = $('fade'); f.classList.add('on');
  setTimeout(() => { fn(); requestAnimationFrame(() => f.classList.remove('on')); }, 260);
}
function applyTheme(t) {
  const r = document.documentElement.style;
  r.setProperty('--hud-bg', t.hudBg); r.setProperty('--hud-ink', t.hudInk);
  r.setProperty('--panel-bg', t.panelBg); r.setProperty('--panel-ink', t.panelInk); r.setProperty('--panel-edge', t.panelEdge);
  r.setProperty('--accent', t.accent); r.setProperty('--accent-ink', t.accentInk);
}

function renderHub() {
  const cards = $('cards'); cards.innerHTML = '';
  GAMES.forEach((g, i) => {
    const b = document.createElement('button');
    b.className = 'card' + (g.locked ? ' locked' : '');
    b.style.setProperty('--art', g.art);
    const sc = best[g.id] || 0;
    const art = g.img ? `<div class="art shot"><img src="${g.img}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('shot');this.remove()"><span class="badge">${g.icon}</span></div>`
                      : `<div class="art">${g.icon}</div>`;
    b.innerHTML = `${art}<div class="body"><span class="num">Game ${i + 1}</span><h3>${g.name}</h3><p>${g.desc}</p>` +
      (g.href ? `<div class="best"><span>${g.tag || '2 players · Opens the game'}</span></div>` :
       g.locked ? `<div class="best">Locked</div>` :
       g.winOnly ? `<div class="best"><span>${wins[g.id] ? '🏆 Champion' : 'Not beaten yet'}</span></div>` :
        `<div class="best"><span>Best</span><div class="bar"><i style="width:${sc}%"></i></div><span>${sc}/100</span></div>`) + `</div>`;
    if (g.locked) b.setAttribute('aria-disabled', 'true');
    else if (g.href) b.addEventListener('click', () => { window.location.href = g.href; });
    else b.addEventListener('click', () => { playAll = null; startGame(g); });
    cards.appendChild(b);
  });
  const o = overallScore();
  $('hubScore').textContent = o; $('hubRing').style.setProperty('--v', o);
  const played = available().filter(g => best[g.id] !== undefined).length;
  $('hubSub').textContent = played ? `${message(o)} Average of your best runs in ${available().length} games.` : 'Play the games to fill your score up to 100.';
}

function startGame(def) {
  if (document.activeElement) document.activeElement.blur();
  fadeTo(() => {
    if (cur && cur.leave) cur.leave();
    curDef = def; cur = def.create(view); applyTheme(def.theme);
    mode = 'game'; paused = false;
    hide(hubEl); hide(resultsEl); show(hud);
    if (def.winOnly) hide(timerEl); else show(timerEl);
    if (def.meterLabel) { meterLabel.textContent = def.meterLabel; show(meterEl); } else hide(meterEl);
    showIntro();
  });
}
function tag() { return playAll ? `<div class="tag">Game ${playAll.idx + 1} of ${playAll.queue.length}</div>` : ''; }
function openOverlay(html) { panel.innerHTML = html; show(overlay); overlayAt = performance.now(); }
function showIntro() {
  phase = 'intro';
  openOverlay(`${tag()}<h2>${curDef.icon} ${curDef.name}</h2><p class="howto">${curDef.howTo}</p>` +
    `<p class="target">${curDef.winOnly ? curDef.goal : `Survive ${curDef.targetTime} seconds for a perfect 100.`}</p>${hint('to play')}`);
}
function showGameOver() {
  phase = 'over';
  if (curDef.winOnly) {                                // win or lose: no score
    if (cur.won) wins[curDef.id] = true;
    openOverlay(`<h2>${cur.overTitle || curDef.overTitle}</h2><p class="howto">${cur.overText || ''}</p>` +
      `<div class="score">${cur.overIcon || (cur.won ? '🏆' : '🥊')}</div><p class="target">${cur.won ? 'Champion!' : wins[curDef.id] ? 'You have beaten it before.' : 'Not beaten yet.'}</p>` +
      `${hint(cur.won ? 'to fight again' : 'to try again')}<div class="row"><button class="link-btn" data-act="hub">Back to hub</button></div>`);
    return;
  }
  const time = cur.time, sc = scoreFor(curDef, time), prev = best[curDef.id];
  const isBest = prev === undefined || sc > prev;
  best[curDef.id] = Math.max(prev || 0, sc);
  if (playAll) playAll.results.push({ def: curDef, time, score: sc });
  const last = playAll && playAll.idx === playAll.queue.length - 1;
  const next = playAll ? (last ? 'to see your results' : 'for the next game') : 'to play again';
  openOverlay(`${tag()}<h2>${cur.overTitle || curDef.overTitle}</h2><p class="howto">${cur.overText || `You survived <b>${cur.time.toFixed(1)} seconds</b>.`}</p>` + (cur.overNote ? `<p class="target">${cur.overNote}</p>` : '') +
    `<div class="score">${sc}<span>/100</span></div><p class="target">${isBest && sc > 0 ? 'New best score!' : `Your best: ${best[curDef.id]}/100`}</p>` +
    `${hint(next)}<div class="row"><button class="link-btn" data-act="hub">Back to hub</button></div>`);
}
function setPaused(p) {
  if (phase !== 'play' || paused === p) return;
  paused = p;
  if (p && cur.releaseAll) cur.releaseAll();
  if (p) openOverlay(`<h2>Paused</h2><p class="howto">Take a breather. Your run is waiting.</p>${hint('to resume')}<div class="row"><button class="link-btn" data-act="hub">Back to hub</button></div>`);
  else hide(overlay);
}

/* The one action used by every game */
function handleAction() {
  if (mode !== 'game' || !cur) return;
  if (performance.now() - overlayAt < 350 && phase !== 'play') return;   // avoid accidental double taps
  if (paused) { setPaused(false); return; }
  if (phase === 'intro') { hide(overlay); phase = 'play'; cur.start(); }
  else if (phase === 'play') cur.action();
  else if (phase === 'over') {
    if (playAll) {
      playAll.idx++;
      if (playAll.idx < playAll.queue.length) startGame(playAll.queue[playAll.idx]);
      else showResults();
    } else { cur.reset(); hide(overlay); phase = 'play'; cur.start(); }
  }
}

function goHub() {
  fadeTo(() => {
    if (cur && cur.leave) cur.leave();
    mode = 'hub'; cur = null; playAll = null; paused = false; phase = '';
    hide(overlay); hide(hud); hide(resultsEl); renderHub(); show(hubEl);
  });
}
function startPlayAll() { playAll = { queue: available(), idx: 0, results: [] }; startGame(playAll.queue[0]); }
function showResults() {
  const res = playAll.results;
  const total = Math.round(res.reduce((a, r) => a + r.score, 0) / res.length);
  fadeTo(() => {
    if (cur && cur.leave) cur.leave();
    mode = 'results'; cur = null; phase = '';
    hide(overlay); hide(hud);
    $('resBox').innerHTML = `<h2>Your survival score</h2><div class="ring" style="--v:${total}"><b>${total}</b></div>` +
      `<div class="msg">${message(total)}</div><div class="res-rows">` +
      res.map(r => `<div class="res-row"><span class="ic">${r.def.icon}</span><span class="nm">${r.def.name}</span><span class="tm">${r.time.toFixed(1)}s</span><span class="sc">${r.score}</span></div>`).join('') +
      `</div><div class="actions"><button class="big-btn" data-r="again">Play all again</button><button class="ghost-btn" data-r="hub">Back to hub</button></div>`;
    show(resultsEl);
  });
}

/* ---------- input wiring ---------- */
const ownInput = () => mode === 'game' && cur && phase === 'play' && !paused;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  pointer3.down = true; pointer3.x = e.clientX;        // Jet Escape 3D steers towards a held finger
  if (ownInput() && cur.pointerDown) {                 // games with several buttons get the position instead
    const r = canvas.getBoundingClientRect();
    cur.pointerDown(e.pointerId, (e.clientX - r.left) / r.width * view.W, (e.clientY - r.top) / r.height * view.H, e.pointerType === 'touch');
  } else handleAction();
});
const pointerUp = e => { pointer3.down = false; if (cur && cur.pointerUp) cur.pointerUp(e.pointerId); };
window.addEventListener('pointerup', pointerUp); window.addEventListener('pointercancel', pointerUp);
// Jet Escape 3D: held keys for flying
window.addEventListener('pointermove', e => { pointer3.x = e.clientX; });
window.addEventListener('keydown', e => {
  keys3.add(e.code);
  if (mode === 'game' && cur && cur.is3D && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => keys3.delete(e.code));
window.addEventListener('blur', () => { keys3.clear(); pointer3.down = false; });
overlay.addEventListener('pointerdown', e => { if (e.target.closest('[data-act]')) return; e.preventDefault(); handleAction(); });
overlay.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && b.dataset.act === 'hub') goHub(); });
window.addEventListener('keydown', e => {
  if (ownInput() && cur.keyDown && cur.keyDown(e.code, e.repeat)) { e.preventDefault(); return; }
  if (e.code !== 'Space' && e.key !== ' ') return;
  if (mode !== 'game') return;
  e.preventDefault();
  if (!e.repeat) handleAction();
});
window.addEventListener('keyup', e => { if (mode === 'game' && cur && cur.keyUp) cur.keyUp(e.code); if ((e.code === 'Space' || e.key === ' ') && mode === 'game') e.preventDefault(); });
$('btnHub').addEventListener('click', e => { e.currentTarget.blur(); goHub(); });
$('btnPause').addEventListener('click', e => { e.currentTarget.blur(); setPaused(!paused); });
$('btnPlayAll').addEventListener('click', startPlayAll);
$('resBox').addEventListener('click', e => {
  const b = e.target.closest('[data-r]'); if (!b) return;
  if (b.dataset.r === 'again') startPlayAll(); else goHub();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
window.addEventListener('blur', () => setPaused(true));

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (mode === 'game' && cur) {
    if (!paused) cur.update(dt);
    cur.draw(ctx);
    timerEl.textContent = cur.time.toFixed(1) + 's';
    if (curDef.meterLabel && cur.meter !== undefined) {
      const m = clamp(cur.meter, 0, 1);
      meterFill.style.width = (m * 100) + '%';
      meterFill.style.backgroundColor = m > 0.5 ? '#5ee6b0' : m > 0.25 ? '#ffd25a' : '#ff5a5a';
    }
    if (phase === 'play' && cur.state === 'done') showGameOver();
  }
  requestAnimationFrame(frame);
}
renderHub();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
